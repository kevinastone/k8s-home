# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-rules
spec:
  groups:
  - name: flux
    rules:
    - alert: FluxComponentAbsent
      annotations:
        summary: Flux component has disappeared from Prometheus target discovery.
      expr: |
        absent(up{job=~".*flux-system.*"} == 1)
      for: 15m
      labels:
        severity: critical
    - alert: FluxReconciliationFailure
      annotations:
        summary: >-
          {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} reconciliation has been failing for more than 15 minutes.
      expr: |
        gotk_resource_info{customresource_group=~".*\\.toolkit\\.fluxcd\\.io", ready="False"} == 1
      for: 15m
      labels:
        severity: critical
