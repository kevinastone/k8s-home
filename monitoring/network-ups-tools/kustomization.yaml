# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: network-ups-tools
resources:
- helmrelease.yaml
- prometheus-rule.yaml
configMapGenerator:
- name: network-ups-tools-config
  files:
  - resources/nut.conf
  - resources/ups.conf
  - resources/upsd.conf
  - resources/upsd.users
- name: network-ups-tools-dashboard
  options:
    labels:
      grafana_dashboard: 'true'
  files:
  - dashboards/network-ups-tools.json
components:
- ../../components/namespace
- ../../components/kustomizeconfig
