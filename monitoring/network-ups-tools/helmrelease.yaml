# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: network-ups-tools
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 1m
    remediation:
      retries: 3
  upgrade:
    timeout: 1m
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        strategy: Recreate
        pod:
          nodeSelector:
            hardware.device/ups: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jr0dd/network-ups-tools
              tag: v2.8.3@sha256:9f8e14d155c6ef05940cee6f8861e259e951eb11750aeddd02539d986dac1ca0
            resources:
              limits:
                device/ups: 1
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
          exporter:
            image:
              repository: ghcr.io/druggeri/nut_exporter
              tag: 3.3.0@sha256:276460d141c732772f8b1fcd785a7de272473e6d39fd85c32b163efc2999cb9a
            args:
            - --nut.vars_enable=
    service:
      app:
        controller: main
        type: LoadBalancer
        annotations:
          coredns.io/hostname: "ups.k8s.kevinastone.com"
          io.cilium/lb-ipam-ips: 192.168.120.93
          metallb.universe.tf/loadBalancerIPs: 192.168.120.93
        labels:
          ip-pool: static
        ports:
          http:
            port: 3493
            protocol: TCP
          metrics:
            port: 9199
    serviceMonitor:
      app:
        enabled: true
        serviceName: network-ups-tools
        endpoints:
        - path: /ups_metrics
          interval: 30s
          scrapeTimeout: 10s
          port: metrics
          params:
            ups: [ups]
          relabelings:
          - targetLabel: ups
            sourceLabels: [__param_ups]
          metricRelabelings:
          # Remove noise from changing pod ids and addresses
          - targetLabel: instance
            replacement: ""
          - targetLabel: pod
            replacement: ""
          - targetLabel: endpoint
            replacement: ""
          - targetLabel: job
            replacement: ""
          - targetLabel: namespace
            replacement: ""
          - targetLabel: service
            replacement: ""
    persistence:
      config:
        type: configMap
        name: network-ups-tools-config # overriden by kustomizeconfig
        defaultMode: 0640
        globalMounts:
        - path: /etc/nut
          readOnly: true
