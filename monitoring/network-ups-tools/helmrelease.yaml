# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: network-ups-tools
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 1m
  upgrade:
    timeout: 1m
  values:
    controllers:
      main:
        strategy: Recreate
        pod:
          nodeSelector:
            hardware.device/ups: "true"
        containers:
          app:
            image:
              repository: ghcr.io/kevinastone/nix-containers/nut
              tag: 2.8.5@sha256:384283a6c7898d9f00dca632ee004f62c3a011d1861e778c4026a92c5279d684
            resources:
              limits:
                device/ups: 1
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
          exporter:
            image:
              repository: ghcr.io/kevinastone/nix-containers/prometheus-nut-exporter
              tag: 3.2.5@sha256:b0c46133cf66c92be2466c8b720eba8416014ef55c41299fea5bb68b717877cf
            args:
            - --nut.vars_enable=
    service:
      app:
        controller: main
        type: LoadBalancer
        annotations:
          coredns.io/hostname: "ups.k8s.kevinastone.com"
          lbipam.cilium.io/ips: 192.168.120.93
        labels:
          ip-pool: static
        ports:
          http:
            port: 3493
            protocol: TCP
          metrics:
            port: 9199
    serviceMonitor:
      app:
        enabled: true
        serviceName: network-ups-tools
        endpoints:
        - path: /ups_metrics
          interval: 5s
          scrapeTimeout: 4s
          port: metrics
          params:
            ups: [ups]
          relabelings:
          - targetLabel: ups
            sourceLabels: [__param_ups]
          metricRelabelings:
          # Remove noise from changing pod ids and addresses
          - targetLabel: instance
            replacement: ""
          - targetLabel: pod
            replacement: ""
          - targetLabel: endpoint
            replacement: ""
          - targetLabel: job
            replacement: ""
          - targetLabel: namespace
            replacement: ""
          - targetLabel: service
            replacement: ""
    persistence:
      config:
        type: configMap
        name: network-ups-tools-config # overriden by kustomizeconfig
        defaultMode: 0640
        globalMounts:
        - path: /etc/nut
          readOnly: true
