---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: network-ups-tools
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  install:
    timeout: 1m
  upgrade:
    timeout: 1m
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/jr0dd/network-ups-tools
              tag: v2.8.1@sha256:2a6e47d431cbb901482ad6692f089a7541524fd3538e42857b39663bb331ba25
            resources:
              limits:
                squat.ai/ups: 1
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
          exporter:
            image:
              repository: ghcr.io/druggeri/nut_exporter
              tag: 3.1.3@sha256:9970d7a16170cb26f70de5bea4c1d90454556c5195760a97f503d838fcbe8b4c
            args:
              - --nut.vars_enable=
    service:
      app:
        controller: main
        type: LoadBalancer
        annotations:
          coredns.io/hostname: "ups.k8s.kevinastone.com"
          io.cilium/lb-ipam-ips: 192.168.120.93
          metallb.universe.tf/loadBalancerIPs: 192.168.120.93
        labels:
          ip-pool: static
        ports:
          http:
            port: 3493
            protocol: TCP
          metrics:
            port: 9199
    serviceMonitor:
      app:
        enabled: true
        serviceName: network-ups-tools
        endpoints:
        - path: /ups_metrics
          interval: 30s
          scrapeTimeout: 10s
          port: metrics
          params:
            ups: [ups]
          relabelings:
          - targetLabel: ups
            sourceLabels: [__param_ups]            
          metricRelabelings:
            # Remove noise from changing pod ids and addresses
          - targetLabel: instance
            replacement: ""
          - targetLabel: pod
            replacement: ""
          - targetLabel: endpoint
            replacement: ""
          - targetLabel: job
            replacement: ""
          - targetLabel: namespace
            replacement: ""
          - targetLabel: service
            replacement: ""
    persistence:
      config:
        type: configMap
        name: network-ups-tools-config # overriden by kustomizeconfig
        defaultMode: 0640
        globalMounts:
          - path: /etc/nut
            readOnly: true

