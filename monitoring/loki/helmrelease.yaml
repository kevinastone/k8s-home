# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: loki
      version: 7.5.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    deploymentMode: SingleBinary
    lokiCanary:
      enabled: false
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      limits_config:
        max_query_lookback: 168h
        retention_period: 168h
      storage:
        type: filesystem
      schemaConfig:
        configs:
        - from: "2024-01-01"
          object_store: filesystem
          store: tsdb
          schema: v13
          index:
            prefix: index_
            period: 24h
      ingester:
        chunk_encoding: snappy
      querier:
        # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
        max_concurrent: 2
      compactor:
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 1h
        retention_delete_worker_count: 150
        delete_request_store: filesystem
    singleBinary:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 547M
        limits:
          cpu: 250m
          memory: 2048M
      extraEnv:
      # Keep a little bit lower than memory limits
      - name: GOMEMLIMIT
        value: 1792MiB
      persistence:
        size: 50Gi
    chunksCache:
      # default is 500MB, with limited memory keep this smaller
      writebackSizeLimit: 10MB
      allocatedMemory: 512
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        annotations:
          grafana_folder: Loki
        labels:
          grafana_dashboard: "true"
    test:
      enabled: false
    # Zero out replica counts of other deployment modes
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
    compactor:
      replicas: 0
