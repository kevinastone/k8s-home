# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: loki
resources:
- namespace.yaml
- helmrelease.yaml
- helmrelease-alloy.yaml
configurations:
- kustomizeconfig.yaml
configMapGenerator:
- name: alloy-config
  files:
  - resources/config.alloy
secretGenerator:
- name: loki-datasources
  options:
    labels:
      grafana_datasource: "true"
  files:
  - loki.yaml=datasources/loki.yaml
