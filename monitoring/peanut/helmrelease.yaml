---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: peanut
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: brandawg93/peanut
              tag: 5.7.2
            ports:
              - containerPort: 8080
                name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 8080

    persistence:
      config:
        type: configMap
        name: peanut-config # overriden by kustomizeconfig
        globalMounts:
          - path: /config/settings.yml
            subPath: settings.yml
