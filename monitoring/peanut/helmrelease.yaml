# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: peanut
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/brandawg93/peanut
              tag: 6.1.1
            env:
              DISABLE_CONFIG_FILE: "true"
              DISABLE_VERSION_CHECK: "true"
              # We do auth at the gateway, so we don't need auth here
              AUTH_DISABLED: "true"
            ports:
            - containerPort: 8080
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 8080

    persistence:
      config:
        type: configMap
        name: peanut-config # overriden by kustomizeconfig
        globalMounts:
        - path: /config/settings.yml
          subPath: settings.yml
