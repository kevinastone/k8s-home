apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: peanut
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Metrics
    gethomepage.dev/icon: /icons/svg/peanut.svg
    gethomepage.dev/name: PeaNUT
    gethomepage.dev/href: https://peanut.k8s.kevinastone.com/device/ups
    gethomepage.dev/weight: -6
    gethomepage.dev/widget.type: peanut
    gethomepage.dev/widget.url: http://peanut.peanut.svc
    gethomepage.dev/widget.key: ups

spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - peanut.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: peanut
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
