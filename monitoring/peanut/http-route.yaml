---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: peanut
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Metrics
    gethomepage.dev/name: Peanut
spec:
  parentRefs:
    - name: auth-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - peanut.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: peanut
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
