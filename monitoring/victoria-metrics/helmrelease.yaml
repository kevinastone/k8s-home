# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
      ref:
        tag: 0.99.0
  values:
    fullnameOverride: vm-stack
    defaultDashboards:
      enabled: true
      grafanaOperator:
        # -- Create dashboards as CRDs (requires grafana-operator to be installed)
        enabled: false
        # labels:
        #   grafana_dashboard: "true"
      dashboards:
        prometheus:
          enabled: false
        prometheus-remote-write:
          enabled: false

    defaultRules:
      create: true
      groups:
        # These metrics don't seem to work
        kubeScheduler:
          create: false
        kube-prometheus-general.rules:
          enabled: false
        general.rules:
          rules:
            Watchdog:
              enabled: false

    vmsingle:
      enabled: false

    vlsingle:
      enabled: true
      spec:
        retentionPeriod: 30d
        resources:
          requests:
            cpu: 200m
            memory: 500Mi
          limits:
            memory: 3Gi
        storage:
          resources:
            requests:
              storage: 50Gi

    vmcluster:
      enabled: true
      spec:
        retentionPeriod: 30d
        replicationFactor: 1
        vmstorage:
          replicaCount: 1
          storageDataPath: /vm-data
          storage:
            volumeClaimTemplate:
              spec:
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 60Gi
          resources:
            requests:
              cpu: 500m
              memory: 1.2Gi
            limits:
              memory: 3Gi
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 1
                preference:
                  matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - ser5max
        vminsert:
          replicaCount: 1
          resources:
            requests:
              cpu: 200m
              memory: 500Mi
            limits:
              memory: 2Gi
        vmselect:
          replicaCount: 1
          storage:
            emptyDir: {}
          resources:
            requests:
              cpu: 200m
              memory: 200Mi
            limits:
              memory: 1Gi

    vmagent:
      spec:
        extraArgs:
          opentelemetry.usePrometheusNaming: "true"
          promscrape.maxScrapeSize: "64MiB"
        resources:
          limits:
            cpu: 1
            memory: 500Mi
          requests:
            cpu: 500m
            memory: 100Mi
        remoteWrite:
        - url: "http://vminsert-vm-stack.victoria-metrics.svc:8480/insert/0/prometheus/api/v1/write"

    alertmanager:
      enabled: true
      spec:
        externalURL: "https://alertmanager.k8s.kevinastone.com"

    vmalert:
      enabled: true

    external:
      grafana:
        host: "grafana.k8s.kevinastone.com"

    # Cilium replaces kube-proxy
    kubeProxy:
      enabled: false

    kubeScheduler:
      enabled: true
      vmScrape: &https-scrape
        spec:
          endpoints:
          - !!merge <<: &endpoint
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
            tlsConfig: &tls-config
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecureSkipVerify: true

    kubeControllerManager:
      enabled: true
      vmScrape: *https-scrape

    kubeApiServer:
      enabled: true
      vmScrape:
        spec:
          endpoints:
          - !!merge <<: *endpoint
            port: https
            tlsConfig:
              !!merge <<: *tls-config
              serverName: kubernetes

    kubeEtcd:
      enabled: true
      service:
        port: &etcd-port 2381
        targetPort: *etcd-port
      vmScrape: &http-scrape
        spec:
          endpoints:
          - !!merge <<: *endpoint
            scheme: http

    coreDns:
      enabled: true

    # Dependent charts
    grafana:
      enabled: false
    victoria-metrics-operator:
      enabled: false

    prometheus-node-exporter:
      enabled: true
    kube-state-metrics:
      enabled: true
      rbac:
        extraRules:
        - apiGroups:
          - source.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
          - notification.toolkit.fluxcd.io
          - image.toolkit.fluxcd.io
          - infra.contrib.fluxcd.io
          resources:
          - gitrepositories
          - buckets
          - helmrepositories
          - helmcharts
          - ocirepositories
          - kustomizations
          - helmreleases
          - alerts
          - providers
          - receivers
          - imagerepositories
          - imagepolicies
          - imageupdateautomations
          - terraforms
          verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
            - groupVersionKind:
                group: kustomize.toolkit.fluxcd.io
                version: v1
                kind: Kustomization
              metricNamePrefix: gotk
              metrics:
              - name: "resource_info"
                help: "The current state of a GitOps Toolkit resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, lastAppliedRevision]
                  source_name: [spec, sourceRef, name]
            - groupVersionKind:
                group: helm.toolkit.fluxcd.io
                version: v2
                kind: HelmRelease
              metricNamePrefix: gotk
              metrics:
              - name: "resource_info"
                help: "The current state of a GitOps Toolkit resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, lastAppliedRevision]
                  chart_name: [spec, chart, spec, chart]
                  chart_source_name: [spec, chart, spec, sourceRef, name]
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: GitRepository
              metricNamePrefix: gotk
              metrics:
              - name: "resource_info"
                help: "The current state of a GitOps Toolkit resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: Bucket
              metricNamePrefix: gotk
              metrics:
              - name: "resource_info"
                help: "The current state of a GitOps Toolkit resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  endpoint: [spec, endpoint]
                  bucket_name: [spec, bucketName]
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmRepository
              metricNamePrefix: gotk
              metrics:
              - name: "resource_info"
                help: "The current state of a GitOps Toolkit resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmChart
              metricNamePrefix: gotk
              metrics:
              - name: "resource_info"
                help: "The current state of a GitOps Toolkit resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  chart_name: [spec, chart]
                  chart_version: [spec, version]
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: OCIRepository
              metricNamePrefix: gotk
              metrics:
              - name: "resource_info"
                help: "The current state of a GitOps Toolkit resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]
            - groupVersionKind:
                group: notification.toolkit.fluxcd.io
                version: v1beta3
                kind: Alert
              metricNamePrefix: gotk
              metrics:
              - name: "resource_info"
                help: "The current state of a GitOps Toolkit resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  suspended: [spec, suspend]
            - groupVersionKind:
                group: notification.toolkit.fluxcd.io
                version: v1beta3
                kind: Provider
              metricNamePrefix: gotk
              metrics:
              - name: "resource_info"
                help: "The current state of a GitOps Toolkit resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  suspended: [spec, suspend]
            - groupVersionKind:
                group: notification.toolkit.fluxcd.io
                version: v1
                kind: Receiver
              metricNamePrefix: gotk
              metrics:
              - name: "resource_info"
                help: "The current state of a GitOps Toolkit resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  webhook_path: [status, webhookPath]
            - groupVersionKind:
                group: image.toolkit.fluxcd.io
                version: v1
                kind: ImageRepository
              metricNamePrefix: gotk
              metrics:
              - name: "resource_info"
                help: "The current state of a GitOps Toolkit resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  image: [spec, image]
            - groupVersionKind:
                group: image.toolkit.fluxcd.io
                version: v1
                kind: ImagePolicy
              metricNamePrefix: gotk
              metrics:
              - name: "resource_info"
                help: "The current state of a GitOps Toolkit resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  source_name: [spec, imageRepositoryRef, name]
            - groupVersionKind:
                group: image.toolkit.fluxcd.io
                version: v1
                kind: ImageUpdateAutomation
              metricNamePrefix: gotk
              metrics:
              - name: "resource_info"
                help: "The current state of a GitOps Toolkit resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  source_name: [spec, sourceRef, name]
            - groupVersionKind:
                group: infra.contrib.fluxcd.io
                version: v1alpha2
                kind: Terraform
              metricNamePrefix: gotk
              metrics:
              - name: "resource_info"
                help: "The current state of an OpenTofu/Terraform resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
