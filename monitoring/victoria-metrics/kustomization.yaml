# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: victoria-metrics
resources:
- namespace.yaml
- helmrelease.yaml
- influx-gateway.yaml
#   - helmrelease-blackbox-exporter.yaml
#   - helmrelease-snmp-exporter.yaml
#   - helmrelease-json-exporter.yaml
- http-route.yaml
- vmrules.yaml
- vmcluster-influx.yaml
- vmsingle.yaml
- migration-jobs.yaml
configMapGenerator:
- name: vm-datasources
  options:
    labels:
      grafana_datasource: "true"
  files:
  - victoria-metrics.yaml=datasources/victoria-metrics.yaml
  - alertmanager.yaml=datasources/alertmanager.yaml
- name: vm-dashboards
  options:
    labels:
      grafana_dashboard: "true"
  files:
  - system-health.json=dashboards/system-health.json
