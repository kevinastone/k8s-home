# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: victoria-metrics
resources:
- namespace.yaml
- helmrelease.yaml
- http-route.yaml
- vmrules.yaml
- vmcluster-influx.yaml
components:
- ../../components/kopiur
patches:
- target:
    group: kopiur.home-operations.com
    version: v1alpha1
    kind: SnapshotPolicy
    name: kopiur-backup
  patch: |-
    - op: replace
      path: /spec/retention
      value:
        keepLatest: 3
        keepDaily: 3
configMapGenerator:
- name: vm-datasources
  options:
    labels:
      grafana_datasource: "true"
  files:
  - victoria-metrics.yaml=datasources/victoria-metrics.yaml
  - victoria-logs.yaml=datasources/victoria-logs.yaml
  - alertmanager.yaml=datasources/alertmanager.yaml
- name: vm-dashboards
  options:
    labels:
      grafana_dashboard: "true"
  files:
  - system-health.json=dashboards/system-health.json
  - alerts-overview.json=dashboards/alerts-overview.json
