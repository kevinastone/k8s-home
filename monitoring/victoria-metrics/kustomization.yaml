---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: victoria-metrics
resources:
  - namespace.yaml
  - helmrelease.yaml
  #   - helmrelease-blackbox-exporter.yaml
  #   - helmrelease-snmp-exporter.yaml
  #   - helmrelease-json-exporter.yaml
  - http-route.yaml
configMapGenerator:
  - name: vm-datasources
    options:
      labels:
        grafana_datasource: "true"
    files:
      - victoria-metrics.yaml=datasources/victoria-metrics.yaml
      # - alertmanager.yaml=datasources/alertmanager.yaml
