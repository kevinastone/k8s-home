apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vm
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Metrics
    gethomepage.dev/icon: /icons/svg/victoriametrics-light.svg
    gethomepage.dev/name: Victoria Metrics
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=vmsingle"
    gethomepage.dev/href: https://vm.k8s.kevinastone.com/vmalert/alerts
    gethomepage.dev/weight: -8
    gethomepage.dev/widget.type: prometheusmetric
    gethomepage.dev/widget.url: http://vmsingle-vm-stack.victoria-metrics.svc:8428
    gethomepage.dev/widget.refreshInterval: 5000
    gethomepage.dev/widget.metrics.0.label: Firing Alerts
    gethomepage.dev/widget.metrics.0.query: alertmanager_alerts{state="active", service="vmalertmanager-vm-stack"}
    gethomepage.dev/widget.metrics.0.format.type: number
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - vm.k8s.kevinastone.com
  rules:
  - matches:
    - path: {value: /config}
    - path: {value: /targets}
    - path: {value: /service-discovery}
    backendRefs:
    - name: vmagent-vm-stack
      port: 8429
  - matches:
    - path: {value: /vmalert}
    backendRefs:
    - name: vmalert-vm-stack
      port: 8080
  - backendRefs:
    - name: vmsingle-vm-stack
      port: 8428
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: influxdb
spec:
  parentRefs:
  - name: vm-influx-gateway
    sectionName: http
  hostnames:
  - influxdb.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: vmagent-vm-stack
      port: 8429
    matches:
    - path: {value: /write}
    - path: {value: /query}
