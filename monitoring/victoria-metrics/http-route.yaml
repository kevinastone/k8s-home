apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vm
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Metrics
    gethomepage.dev/icon: /assets/icons/svg/victoriametrics-light.svg
    gethomepage.dev/name: Victoria Metrics
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=vmselect"
    gethomepage.dev/href: https://vm.k8s.kevinastone.com/select/0/prometheus/vmui/
    gethomepage.dev/weight: -8
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - vm.k8s.kevinastone.com
  rules:
  - matches:
    - path:
        type: Exact
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /select/0/prometheus/vmui/
        statusCode: 302
  - backendRefs:
    - name: vmselect-vm-stack
      port: 8481
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmagent
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Metrics
    gethomepage.dev/icon: /assets/icons/svg/victoriametrics-light.svg
    gethomepage.dev/name: VMAgent
    gethomepage.dev/href: https://vmagent.k8s.kevinastone.com/targets
    gethomepage.dev/weight: -5
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - vmagent.k8s.kevinastone.com
  rules:
  - matches:
    - path:
        type: Exact
