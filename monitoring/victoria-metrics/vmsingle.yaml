apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: vm-stack
  namespace: victoria-metrics
  labels:
    app.kubernetes.io/instance: vm
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: vmsingle
spec:
  retentionPeriod: 30d
  replicaCount: 1
  port: "8428"
  storage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 60Gi
  resources:
    requests:
      cpu: 200m
      memory: 500Mi
    limits:
      memory: 2Gi
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: kubernetes.io/hostname
            operator: NotIn
            values:
            - ser5max
