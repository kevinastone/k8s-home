---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: influxdb-gateway
spec:
  gatewayClassName: envoy-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 8086
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Same
