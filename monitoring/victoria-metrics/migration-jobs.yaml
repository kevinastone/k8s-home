apiVersion: batch/v1
kind: Job
metadata:
  name: vmctl-migrate-default-v6
  namespace: victoria-metrics
  labels:
    app.kubernetes.io/name: vmctl
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmctl
    spec:
      restartPolicy: OnFailure
      containers:
      - name: vmctl
        image: victoriametrics/vmctl:v1.115.0
        args:
        - vm-native
        - --vm-native-src-addr=http://vmsingle-vm-stack.victoria-metrics.svc:8428
        - --vm-native-dst-addr=http://vminsert-vm-stack.victoria-metrics.svc:8480/insert/0/prometheus
        - --vm-native-filter-match={__name__!~"^(home_assistant|telegraf)_.*"}
        - --vm-native-filter-time-start=2026-08-15T00:00:00Z
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            memory: 1Gi
