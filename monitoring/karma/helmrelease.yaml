# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app karma
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/prymitive/karma
              tag: v0.122@sha256:87312daa8b8ca740e2acd427fc996724f8c69e36b9f0ad15c1961c1e4ccb1987
            env:
              CONFIG_FILE: &config /config/config.yaml
              LISTEN_PORT: &port 80
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
              readiness: *probes

    service:
      main:
        controller: main
        ports:
          http:
            port: *port
    serviceMonitor:
      main:
        serviceName: *app
        endpoints:
        - port: http
    persistence:
      config:
        type: emptyDir
      config-file:
        type: configMap
        name: karma-config
        globalMounts:
        - path: *config
          subPath: config.yaml
          readOnly: true
