# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app karma
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/prymitive/karma
              tag: v0.133@sha256:f5d0a0ff4062291f733980de56204b2073cfdd7d00e0444c910d78ca1478adf0
            env:
              CONFIG_FILE: &config /config/config.yaml
              LISTEN_PORT: &port 80
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
              readiness: *probes

    service:
      main:
        controller: main
        ports:
          http:
            port: *port
    serviceMonitor:
      main:
        serviceName: *app
        endpoints:
        - port: http
    persistence:
      config:
        type: emptyDir
      config-file:
        type: configMap
        name: karma-config
        globalMounts:
        - path: *config
          subPath: config.yaml
          readOnly: true
