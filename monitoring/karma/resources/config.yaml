---
alertmanager:
  interval: 60s
  servers:
    - name: main
      uri: http://vmalertmanager-vm-stack.victoria-metrics.svc.cluster.local:9093
      timeout: 10s
      healthcheck:
        visible: false
        filters:
          main:
            - alertname=Watchdog
            # - prometheus=victoria-metrics/vm-stack

alertAcknowledgement:
  enabled: true

filters:
  default:
    - "@state!=suppressed"
