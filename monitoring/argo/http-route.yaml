apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-workflows-server
  namespace: argo
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Servers
    gethomepage.dev/icon: /icons/svg/argo-cd.svg
    gethomepage.dev/name: Argo
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - argo.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: argo-workflows-server
      port: 2746
    matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 0s
