# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
  namespace: postgres
spec:
  groups:
  - name: cloudnative-pg
    rules:
    - alert: CNPGClusterDown
      annotations:
        summary: "PostgreSQL cluster is down"
        description: "All instances in PostgreSQL cluster {{ $labels.cluster }} are unreachable."
      expr: sum by (cluster) (cnpg_collector_up) == 0
      for: 2m
      labels:
        severity: critical
    - alert: CNPGInstanceDown
      annotations:
        summary: "PostgreSQL instance down"
        description: "PostgreSQL instance {{ $labels.pod }} in cluster {{ $labels.cluster }} is down."
      expr: cnpg_collector_up == 0
      for: 5m
      labels:
        severity: warning
    - alert: CNPGBackupFailed
      annotations:
        summary: "PostgreSQL backup failed"
        description: "Last attempted backup for {{ $labels.job }} in namespace {{ $labels.namespace }} failed."
      expr: barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp > barman_cloud_cloudnative_pg_io_last_available_backup_timestamp
      for: 5m
      labels:
        severity: warning
    - alert: CNPGBackupMissing
      annotations:
        summary: "PostgreSQL backup missing"
        description: "No successful backup has completed for {{ $labels.job }} in the last 30 hours."
      expr: (time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 108000
      for: 15m
      labels:
        severity: warning
    - alert: CNPGWALArchivingFailing
      annotations:
        summary: "PostgreSQL WAL archiving is failing"
        description: "WAL archiving is failing or backlog is accumulating on {{ $labels.pod }} in {{ $labels.namespace }}."
      expr: cnpg_collector_pg_wal_archive_status{value="ready"} > 32
      for: 5m
      labels:
        severity: warning
    - alert: CNPGReplicationLag
      annotations:
        summary: "PostgreSQL replication lag high"
        description: "Standby replica in cluster {{ $labels.cluster }} is lagging behind primary by {{ $value }}s."
      expr: cnpg_pg_replication_lag > 30
      for: 5m
      labels:
        severity: warning
