# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg-dashboards
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/cloudnative-pg/grafana-dashboards/cluster
      ref:
        tag: 0.0.5
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    grafanaDashboard:
      sidecarLabelValue: "true"
