---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Metrics
    gethomepage.dev/icon: /static/icons/svg/prometheus.svg
    gethomepage.dev/name: Prometheus
    gethomepage.dev/href: https://prometheus.k8s.kevinastone.com/alerts?state=firing&state=pending&showEmptyGroups=0
    gethomepage.dev/weight: -8
    gethomepage.dev/widget.type: prometheusmetric
    gethomepage.dev/widget.url: http://prometheus-kube-prometheus-prometheus.prometheus.svc:9090
    gethomepage.dev/widget.refreshInterval: 5000
    gethomepage.dev/widget.metrics.0.label: Firing Alerts
    gethomepage.dev/widget.metrics.0.query: alertmanager_alerts{state="active"}
    gethomepage.dev/widget.metrics.0.format.type: number
spec:
  parentRefs:
    - name: auth-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - prometheus.k8s.kevinastone.com
  rules:
    # Allow long-polling on notifications/live api endpoint
    - backendRefs:
        - name: prometheus-kube-prometheus-prometheus
          port: 9090
      matches:
        - path:
            type: PathPrefix
            value: /api/v1/notifications/live
      timeouts:
        request: "5m"
    - backendRefs:
        - name: prometheus-kube-prometheus-prometheus
          port: 9090
      matches:
        - path:
            type: PathPrefix
            value: /
