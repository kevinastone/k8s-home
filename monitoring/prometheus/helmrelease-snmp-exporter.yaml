# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snmp-exporter
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/prometheus-community/charts/prometheus-snmp-exporter
      ref:
        tag: 9.19.0
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    serviceMonitor:
      enabled: true
      namespace: prometheus
      params: []
      # - name: storage
      #   target: storage.home.kevinastone.com
      #   module: [synology, ucd_la_table]
      # - name: backup
      #   target: backup.home.kevinastone.com
      #   module: [synology, ucd_la_table]
      selector:
        release: prometheus
      selfMonitor:
        enabled: true
