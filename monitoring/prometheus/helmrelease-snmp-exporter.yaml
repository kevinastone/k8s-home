---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: snmp-exporter
spec:
  interval: 5m
  chart:
    spec:
      chart: prometheus-snmp-exporter
      version: 1.8.2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 5m
  values:
    serviceMonitor:
      enabled: true
      namespace: prometheus
      params:
        - name: storage
          target: storage.home.kevinastone.com
          module: [synology]
        - name: backup
          target: backup.home.kevinastone.com
          module: [synology]
      selfMonitor:
        enabled: true
