---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: json-exporter
spec:
  interval: 5m
  chart:
    spec:
      chart: prometheus-json-exporter
      version: 0.14.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 5m
  values:
    serviceMonitor:
      enabled: true

      targets:
        - name: verizon-lte
          url: http://192.168.20.161/webapi/simStatus
          module: verizon

    configuration:
      config: |
        ---
        modules:
          verizon:
            metrics:
              - name: verizon_lte_status
                type: object
                path: "{@}"
                values:
                  cell_type: "{.cellType}"
                  active_ue_count: "{.activeUECount}"
                  active_ue_count_tot: "{.activeUECountTot}"
                  ip_mode: "{.ipMode}"
                  gps_signal: "{.gpsSignal}"
                  result: "{.result}"
