# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: json-exporter
spec:
  interval: 12h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://ghcr.io/prometheus-community/charts/prometheus-json-exporter
  ref:
    tag: 0.20.2
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: json-exporter
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: json-exporter
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    serviceMonitor:
      enabled: true
      defaults:
        interval: 30s
        scrapeTimeout: 30s
      targets:
      - name: verizon-lte
        url: http://192.168.20.161/webapi/simStatus
        module: verizon

    configuration:
      config: |
        ---
        modules:
          verizon:
            metrics:
              - name: verizon_lte_status
                type: object
                path: "{@}"
                values:
                  cell_type: "{.cellType}"
                  active_ue_count: "{.activeUECount}"
                  active_ue_count_tot: "{.activeUECountTot}"
                  ip_mode: "{.ipMode}"
                  gps_signal: "{.gpsSignal}"
                  result: "{.result}"
