# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: blackbox-exporter
spec:
  interval: 12h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://ghcr.io/prometheus-community/charts/prometheus-blackbox-exporter
  ref:
    tag: 11.17.2
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter
  values:
    serviceMonitor:
      enabled: true

      selfMonitor:
        enabled: true

      defaults:
        labels:
          release: prometheus

      targets:
      - name: max
        url: https://max.home.kevinastone.com
        interval: 5m

    prometheusRule:
      enabled: true
      rules:
      - alert: SSLExpiryWarning
        expr: min by (instance) (probe_ssl_earliest_cert_expiry - time()) < 14 * 24 * 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Certificate for {{ $labels.instance }} will expire in {{ $value | humanizeDuration }}"
          description: "The certificate for {{ $labels.instance }} is about to expire in less than 14 days."
