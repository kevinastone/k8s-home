# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/prometheus-community/charts/prometheus-blackbox-exporter
      ref:
        tag: 11.22.0
  values:
    serviceMonitor:
      enabled: true

      selfMonitor:
        enabled: true

      defaults:
        labels:
          release: prometheus

      targets:
      - name: max
        url: https://max.home.kevinastone.com
        interval: 5m

    prometheusRule:
      enabled: true
      rules:
      - alert: SSLExpiryWarning
        expr: min by (instance) (probe_ssl_earliest_cert_expiry - time()) < 14 * 24 * 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Certificate for {{ $labels.instance }} will expire in {{ $value | humanizeDuration }}"
          description: "The certificate for {{ $labels.instance }} is about to expire in less than 14 days."
