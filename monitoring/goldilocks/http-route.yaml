# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goldilocks
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Metrics
    gethomepage.dev/icon: /assets/custom/goldilocks.svg
    gethomepage.dev/name: Goldilocks
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - goldilocks.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: goldilocks-dashboard
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
