# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name vector-aggregator
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/vectordotdev/helm-charts/vector
      ref:
        tag: 0.61.0
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    role: Stateless-Aggregator
    replicas: 2
    containerPorts:
    - name: influxdb
      containerPort: &influxPort 8086
      protocol: TCP
    - name: &promPort prom-exporter
      containerPort: 9090
      protocol: TCP
    podMonitor:
      enabled: true
      port: *promPort
    service:
      enabled: true
      type: ClusterIP
      ports:
      - name: influxdb
        port: *influxPort
        targetPort: *influxPort
        protocol: TCP
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - *name
            topologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        memory: 1Gi
    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: false
      sources:
        raw_influxdb:
          type: http_server
          address: 0.0.0.0:8086
          path: /write
          response_code: 204
          log_namespace: true
          query_parameters:
          - db
          decoding:
            codec: bytes
        internal_metrics:
          type: internal_metrics
      transforms:
        parse_and_tag:
          type: remap
          inputs:
          - raw_influxdb
          source: |
            db_name = %http_server.query_parameters.db
            metrics = parse_influxdb!(.)

            . = map_values(metrics) -> |m| {
              if is_string(db_name) && db_name != "" {
                if !is_object(m.tags) {
                  m.tags = {}
                }
                m.tags.db = db_name
              }
              m
            }
        influxdb:
          type: log_to_metric
          inputs:
          - parse_and_tag
          all_metrics: true
          metrics: []
        prefix_db_influx:
          type: remap
          inputs:
          - influxdb
          source: |
            if exists(.tags.db) {
              .name = to_string!(.tags.db) + "_" + to_string!(.name)
              del(.tags.db)
            }
      sinks:
        vmcluster_influx:
          type: prometheus_remote_write
          inputs:
          - prefix_db_influx
          endpoint: http://vminsert-vmcluster-influx.victoria-metrics.svc.cluster.local:8480/insert/0/prometheus/api/v1/write
          healthcheck:
            enabled: false
          acknowledgements:
            enabled: true
        prom_exporter:
          type: prometheus_exporter
          inputs:
          - internal_metrics
          address: 0.0.0.0:9090
