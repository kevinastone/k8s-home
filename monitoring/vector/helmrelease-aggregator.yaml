# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name vector-aggregator
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/vectordotdev/helm-charts/vector
      ref:
        tag: 0.62.1
  values:
    role: Stateless-Aggregator
    replicas: 2
    containerPorts:
    - name: &promPort prom-exporter
      containerPort: 9090
      protocol: TCP
    - name: otlp-grpc
      containerPort: &otlpGrpcPort 4317
      protocol: TCP
    - name: otlp-http
      containerPort: &otlpHttpPort 4318
      protocol: TCP
    podMonitor:
      enabled: true
      port: *promPort
    service:
      enabled: true
      type: ClusterIP
      ports:
      - name: otlp-grpc
        port: *otlpGrpcPort
        targetPort: *otlpGrpcPort
        protocol: TCP
      - name: otlp-http
        port: *otlpHttpPort
        targetPort: *otlpHttpPort
        protocol: TCP
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - *name
            topologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        memory: 1Gi
    dataDir: /vector-data-dir
    extraVolumes:
    - name: clickhouse-creds
      secret:
        secretName: clickhouse-vector-creds
    extraVolumeMounts:
    - name: clickhouse-creds
      mountPath: /etc/vector-secrets
      readOnly: true
    existingConfigMaps:
    - vector-aggregator-config
