# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vector-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: envoy-gateway-class
  listeners:
  - name: influxdb
    protocol: HTTP
    port: 8086
    allowedRoutes:
      kinds:
      - kind: HTTPRoute
      namespaces:
        from: Same
  - name: otlp-grpc
    protocol: HTTP
    port: 4317
    allowedRoutes:
      kinds:
      - kind: GRPCRoute
      - kind: HTTPRoute
      namespaces:
        from: Same
  - name: otlp-http
    protocol: HTTP
    port: 4318
    allowedRoutes:
      kinds:
      - kind: HTTPRoute
      namespaces:
        from: Same
  - name: https
    protocol: HTTPS
    hostname: "*.k8s.kevinastone.com"
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: vector-tls
    allowedRoutes:
      kinds:
      - kind: HTTPRoute
      namespaces:
        from: Same
