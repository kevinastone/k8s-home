# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/vectordotdev/helm-charts/vector
      ref:
        tag: 0.61.0
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    role: Agent
    service:
      enabled: false
    serviceMonitor:
      enabled: false
    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: false
      sources:
        kubernetes_logs:
          type: kubernetes_logs
      sinks:
        vlogs:
          type: elasticsearch
          inputs:
          - kubernetes_logs
          endpoints:
          - http://vlsingle-vm-stack.victoria-metrics.svc.cluster.local:9428/insert/elasticsearch/
          api_version: v8
          compression: gzip
          healthcheck:
            enabled: false
          request:
            concurrency: 1
          query:
            _msg_field: message
            _time_field: timestamp
            _stream_fields: kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name
