# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vector
resources:
# keep-sorted start
- gateway.yaml
- helmrelease-agent.yaml
- helmrelease-aggregator.yaml
- http-route.yaml
- namespace.yaml
# keep-sorted end
configMapGenerator:
- name: vector-dashboard
  options:
    labels:
      grafana_dashboard: "true"
  files:
  # keep-sorted start
  - dashboards/vector-cluster.json
  - dashboards/vector-logging.json
  - dashboards/vector-stats.json
  # keep-sorted end
