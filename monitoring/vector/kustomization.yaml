# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vector
resources:
# keep-sorted start
- gateway.yaml
- helmrelease-agent.yaml
- helmrelease-aggregator.yaml
- http-route.yaml
# keep-sorted end
components:
- ../../components/namespace
- ../../components/kustomizeconfig
patches:
- target:
    kind: Namespace
  patch: |-
    apiVersion: v1
    kind: Namespace
    metadata:
      name: _
      labels:
        secrets.k8s-home.internal/clickhouse-vector: "true"
configMapGenerator:
- name: vector-aggregator-config
  files:
  # keep-sorted start
  - config/base.yaml
  - config/clickhouse.yaml
  - config/internal_metrics.yaml
  - config/otlp.yaml
  # keep-sorted end
- name: vector-dashboard
  options:
    labels:
      grafana_dashboard: "true"
  files:
  # keep-sorted start
  - dashboards/vector-cluster.json
  - dashboards/vector-logging.json
  # keep-sorted end
