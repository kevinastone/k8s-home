# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: grafana
spec:
  interval: 12h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://ghcr.io/grafana/helm-charts/grafana
  ref:
    tag: 10.5.15
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: grafana
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    grafana.ini:
      auth:
        oauth_auto_login: true
        oauth_allow_insecure_email_lookup: true
        check_for_updates: false
        check_for_plugin_updates: false
      auth.generic_oauth:
        enabled: true
        name: Authelia
        icon: signin
        client_id: grafana
        # client_secret: insecure_secret
        scopes: openid profile email groups
        empty_scopes: false
        auth_url: https://auth.k8s.kevinastone.com/api/oidc/authorization
        token_url: https://auth.k8s.kevinastone.com/api/oidc/token
        api_url: https://auth.k8s.kevinastone.com/api/oidc/userinfo
        login_attribute_path: preferred_username
        groups_attribute_path: groups
        name_attribute_path: name
        use_pkce: true
        allow_assign_grafana_admin: true
        # https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/configure-authentication/generic-oauth/#map-one-role-to-all-users
        role_attribute_path: |
          "'Admin'"
        skip_org_role_sync: false
        org_id: 1
      # auth.generic_oauth.group_mapping:
      #   org_id: 1
      #   role_attribute_path: |
      #     contains(groups[*], 'lldap_admin') && 'Admin' || 'Viewer'
      auth.anonymous:
        enabled: false
      # auth.anonymous:
      #   enabled: true
      #   org_name: Main Org.
      #   org_role: Admin
      server:
        serve_from_sub_path: false
        root_url: https://grafana.k8s.kevinastone.com
      panels:
        disable_sanitize_html: true
      news:
        news_feed_enabled: false
      users:
        home_page: /dashboards

    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
        provider:
          disableDelete: true
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        searchNamespace: ALL
    serviceMonitor:
      enabled: true

    podAnnotations:
      reloader.stakater.com/auto: "true"

    envFromSecret: grafana-client-secret
