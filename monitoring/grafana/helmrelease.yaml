# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/grafana-community/helm-charts/grafana
      ref:
        tag: 14.6.1
  values:
    plugins:
    - grafana-clickhouse-datasource
    - victoriametrics-logs-datasource
    grafana.ini:
      auth:
        oauth_auto_login: true
        oauth_allow_insecure_email_lookup: true
        check_for_updates: false
        check_for_plugin_updates: false
      auth.generic_oauth:
        enabled: true
        name: Keycloak
        icon: signin
        client_id: grafana
        scopes: openid profile email groups
        empty_scopes: false
        auth_url: https://sso.k8s.kevinastone.com/realms/homelab/protocol/openid-connect/auth
        token_url: https://sso.k8s.kevinastone.com/realms/homelab/protocol/openid-connect/token
        api_url: https://sso.k8s.kevinastone.com/realms/homelab/protocol/openid-connect/userinfo
        login_attribute_path: preferred_username
        groups_attribute_path: groups
        name_attribute_path: name
        use_pkce: true
        allow_assign_grafana_admin: true
        role_attribute_path: contains(groups[*], 'admin') && 'Admin' || 'Viewer'
        skip_org_role_sync: false
        org_id: 1
      auth.anonymous:
        enabled: false
      # auth.anonymous:
      #   enabled: true
      #   org_name: Main Org.
      #   org_role: Admin
      alerting:
        enabled: false
      unified_alerting:
        enabled: true
        # Keep VMAlertmanager as the default Alertmanager source in the UI
        default_alertmanager_datasource_uid: alertmanager
      server:
        serve_from_sub_path: false
        root_url: https://grafana.k8s.kevinastone.com
      panels:
        disable_sanitize_html: true
      news:
        news_feed_enabled: false
      users:
        home_page: /dashboards

    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
        provider:
          disableDelete: false
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        searchNamespace: ALL
    serviceMonitor:
      enabled: true

    podAnnotations:
      reloader.stakater.com/auto: "true"

    envFromSecret: oidc-client-secret
