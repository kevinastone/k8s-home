# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
resources:
- namespace.yaml
- helmrelease.yaml
- http-route.yaml
configurations:
- kustomizeconfig.yaml
secretGenerator:
- name: grafana-secret
  files:
  - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=secrets/client.secret.encrypted
