# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Metrics
    gethomepage.dev/icon: /assets/icons/svg/grafana.svg
    gethomepage.dev/name: Grafana
    gethomepage.dev/weight: -10
spec:
  parentRefs:
  - name: public-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - grafana.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: grafana
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
