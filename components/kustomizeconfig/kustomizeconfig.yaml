nameReference:
- kind: ConfigMap
  version: v1
  fieldSpecs:
  - path: spec/values/persistence/config/name
    kind: HelmRelease
  - path: spec/values/persistence/config-file/name
    kind: HelmRelease

- kind: Secret
  version: v1
  fieldSpecs:
  - path: spec/values/persistence/secrets/name
    kind: HelmRelease
  - path: spec/values/controllers/main/containers/main/envFrom/secretRef/name
    kind: HelmRelease
  - path: spec/provider/onepassword/auth/secretRef/connectTokenSecretRef/name
    kind: ClusterSecretStore
  - path: spec/provider/onepasswordSDK/auth/serviceAccountSecretRef/name
    kind: ClusterSecretStore
  - path: spec/secretRef/name
    kind: Receiver
