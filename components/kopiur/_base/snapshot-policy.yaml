# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: kopiur-backup
spec:
  repository:
    kind: ClusterRepository
    name: nas-smb
  credentialProjection:
    enabled: true
  mover:
    privilegedMode: true
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
  retention:
    keepLatest: 7
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 12
  verification:
    verifyFilesPercent: 5
    quick:
      schedule:
        cron: "H 4 * * 0"
        timezone: "America/Los_Angeles"
  sources:
  - pvcSelector:
      labelSelector:
        matchLabels:
          kopiur.home-operations.com/backup: "true"
    sourcePathStrategy: PvcNamespacedName
