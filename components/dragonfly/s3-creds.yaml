apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-s3-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: dragonfly-kubernetes-store
  target:
    name: dragonfly-s3-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: dragonfly
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
  - extract:
      key: s3-creds
