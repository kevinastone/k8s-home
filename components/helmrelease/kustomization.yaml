# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- target:
    group: helm.toolkit.fluxcd.io
    kind: HelmRelease
  patch: |-
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: _
    spec:
      driftDetection:
        mode: enabled
      install:
        remediation:
          retries: 3
      upgrade:
        cleanupOnFail: true
        remediation:
          retries: 3
