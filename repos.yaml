# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: repos
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: fluxcd-sync
  path: "./repos"
  prune: true
  timeout: 10m
  retryInterval: 1m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
