# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-events
  namespace: argo-events
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/argoproj/argo-helm/argo-events
      ref:
        tag: 2.4.27
  dependsOn:
  - name: prometheus-crds
    namespace: prometheus
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    controller:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    eventBus:
      nats:
        native: {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-workflows
  namespace: argo
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/argoproj/argo-helm/argo-workflows
      ref:
        tag: 2.0.18
  dependsOn:
  - name: prometheus-crds
    namespace: prometheus
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      install: true
      full: false
    controller:
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      metricsConfig:
        enabled: true
      serviceMonitor:
        enabled: true
    server:
      enabled: true
      authModes:
      - server
