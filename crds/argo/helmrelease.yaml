# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: argo-events
spec:
  interval: 12h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://ghcr.io/argoproj/argo-helm/argo-events
  ref:
    tag: 2.4.22
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: argo-workflows
spec:
  interval: 12h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://ghcr.io/argoproj/argo-helm/argo-workflows
  ref:
    tag: 1.0.19
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-events
  namespace: argo-events
spec:
  chartRef:
    kind: OCIRepository
    name: argo-events
  interval: 5m
  dependsOn:
  - name: prometheus-crds
    namespace: prometheus
  values:
    controller:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    eventBus:
      nats:
        native: {}
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-workflows
  namespace: argo
spec:
  chartRef:
    kind: OCIRepository
    name: argo-workflows
  interval: 5m
  dependsOn:
  - name: prometheus-crds
    namespace: prometheus
  values:
    crds:
      install: true
      full: false
    controller:
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      metricsConfig:
        enabled: true
      serviceMonitor:
        enabled: true
    server:
      enabled: true
      authModes:
      - server
