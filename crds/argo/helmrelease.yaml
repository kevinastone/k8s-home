# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-events
  namespace: argo-events
spec:
  chart:
    spec:
      chart: argo-events
      version: 2.4.21
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: flux-system
  interval: 5m
  dependsOn:
  - name: prometheus-crds
    namespace: prometheus
  values:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    eventBus:
      nats:
        native: {}
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-workflows
  namespace: argo
spec:
  chart:
    spec:
      chart: argo-workflows
      version: 1.0.14
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: flux-system
  interval: 5m
  dependsOn:
  - name: prometheus-crds
    namespace: prometheus
  values:
    server:
      enabled: true
      authModes:
      - server
    metricsConfig:
      enabled: true
    serviceMonitor:
      enabled: true
