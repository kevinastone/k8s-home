# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      url: oci://ghcr.io/home-operations/charts-mirror/keda
      ref:
        tag: 2.21.0
  interval: 1h
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    enableServiceLinks: false
    prometheus:
      metricServer:
        enabled: true
        serviceMonitor:
          enabled: true
      operator:
        enabled: true
        serviceMonitor:
          enabled: true
      webhooks:
        enabled: true
        serviceMonitor:
          enabled: true
    resources:
      operator:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 512Mi
      metricServer:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 512Mi
      webhooks:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
