# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/flux-iac/charts/tofu-controller
      ref:
        tag: 0.16.6
  interval: 5m
  dependsOn:
  - name: prometheus-crds
    namespace: prometheus
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    allowCrossNamespaceRefs: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 1m
    runner:
      image:
        repository: ghcr.io/home-operations/opentofu-runner
        tag: 1.13.8@sha256:499e0dfbcf80a92ad31c3320c95b6082746cbd3e481b960ab69e5995c0b192f5
    awsPackage:
      install: false
