# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: tofu-controller
spec:
  interval: 12h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://ghcr.io/flux-iac/charts/tofu-controller
  ref:
    tag: 0.16.4
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  interval: 5m
  dependsOn:
  - name: prometheus-crds
    namespace: prometheus
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    allowCrossNamespaceRefs: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 1m
    runner:
      image:
        repository: ghcr.io/home-operations/opentofu-runner
        tag: 1.12.1@sha256:dfea14ae93bb05348f8f9a13793e24085ebdf49f5a83c8a3f458aa1a6a450efb
    awsPackage:
      install: false
