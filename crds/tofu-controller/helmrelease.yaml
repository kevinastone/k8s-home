# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/flux-iac/charts/tofu-controller
      ref:
        tag: 0.17.0
  dependsOn:
  - name: prometheus-crds
    namespace: prometheus
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    allowCrossNamespaceRefs: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 1m
    runner:
      image:
        repository: ghcr.io/kevinastone/nix-containers/opentofu-runner
        tag: 0.17.0@sha256:1a37fe858c9958f0b532f57e20d4f7dcaa4349b47d8dd01224e1cc0ba7846d5a
    awsPackage:
      install: false
