# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator
      ref:
        tag: v1.7.1
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    crds:
      install: true
      keep: false
    serviceMonitor:
      enabled: false
    grafanaDashboard:
      enabled: false
