# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
resources:
- crds.yaml
components:
- ../../components/namespace
- ../../components/goldilocks
patches:
- target:
    kind: Namespace
  patch: |-
    apiVersion: v1
    kind: Namespace
    metadata:
      name: _
      labels:
        secrets.k8s-home.internal/cloudflare-dns: "true"
