# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      url: oci://ghcr.io/external-secrets/charts/external-secrets
      ref:
        tag: 2.14.0
  dependsOn:
  - name: cert-manager
    namespace: cert-manager
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    installCRDs: true

    leaderElect: true

    serviceMonitor:
      enabled: true

    # certManager:
    #   enabled: true

    grafanaDashboard:
      enabled: true
      sidecarLabelValue: "true"
