# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      url: oci://ghcr.io/external-secrets/charts/external-secrets
      ref:
        tag: 2.14.0
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    installCRDs: true

    leaderElect: true

    serviceMonitor:
      enabled: true

    grafanaDashboard:
      enabled: true
      sidecarLabelValue: "true"
