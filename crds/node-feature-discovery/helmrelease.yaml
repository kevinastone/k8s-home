# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://registry.k8s.io/nfd/charts/node-feature-discovery
      ref:
        tag: 0.20.1
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    master:
      resources:
        limits: null
    worker:
      config:
        core:
          featureSources:
          - custom
          - usb
          labelSources:
          - custom
        sources:
          usb:
            deviceClassWhitelist:
            - "03"
            - "0e"
            - "ef"
            - "fe"
            - "ff"
      resources:
        limits: null
    topologyUpdater:
      resources:
        limits: null
    gc:
      resources:
        limits: null
    prometheus:
      enabled: true
