# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  annotations:
    reconcile.fluxcd.io/requestedAt: "2026-10-15T15:15:04Z"
spec:
  interval: 30m
  chart:
    spec:
      chart: redis-operator
      version: 0.27.0
      sourceRef:
        kind: HelmRepository
        name: redis-operator
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    force: true
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
  values:
    monitoring:
      enabled: true
