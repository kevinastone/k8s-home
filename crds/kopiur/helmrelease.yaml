# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/home-operations/charts/kopiur
      ref:
        tag: 0.11.2
  dependsOn:
  - name: prometheus-crds
    namespace: prometheus
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  uninstall:
    keepHistory: false
  values:
    installScope: cluster
    features:
      credentialProjection:
        enabled: true
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "true"
