# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: envoy-gateway-crds
  namespace: envoy
spec:
  interval: 24h
  url: https://github.com/envoyproxy/gateway
  ref:
    tag: v1.10.0
  ignore: |
    /*
    !/charts/gateway-helm/charts/crds/crds
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-crds
  namespace: envoy
spec:
  interval: 1h
  prune: false
  sourceRef:
    kind: GitRepository
    name: envoy-gateway-crds
  path: "./charts/gateway-helm/charts/crds/crds"
