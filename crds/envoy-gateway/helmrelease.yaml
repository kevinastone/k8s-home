# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      ref:
        tag: 1.9.3
      url: oci://docker.io/envoyproxy/gateway-crds-helm
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  interval: 1h
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      envoyGateway:
        enabled: true
      gatewayAPI:
        channel: experimental
        enabled: true
