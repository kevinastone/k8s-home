# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
- nzbgeek-secret.yaml
- vpn-secret.yaml
- volume-downloads.yaml
- volume-incoming.yaml
- volume-media.yaml
- postgres
- qbittorrent
- sabnzbd
- sonarr
- radarr
- recyclarr
- prowlarr
- transcoder
- http-route.yaml
- security-policy.yaml
components:
- ../components/helmrelease
- ../components/namespace
- ../components/tf-runner
patches:
- target:
    group: helm.toolkit.fluxcd.io
    kind: HelmRelease
    name: sabnzbd
  patch: |-
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: sabnzbd
    spec:
      upgrade:
        remediation:
          retries: 0
