# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: radarr-main-db
spec:
  name: radarr_main
  owner: app
  cluster:
    name: postgres
  encoding: UTF8
  localeProvider: builtin
  builtinLocale: PG_UNICODE_FAST
  localeCollate: C
  localeCType: C
  template: template0
  databaseReclaimPolicy: retain
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: radarr-log-db
spec:
  name: radarr_log
  owner: app
  cluster:
    name: postgres
  encoding: UTF8
  localeProvider: builtin
  builtinLocale: PG_UNICODE_FAST
  localeCollate: C
  localeCType: C
  template: template0
  databaseReclaimPolicy: delete
