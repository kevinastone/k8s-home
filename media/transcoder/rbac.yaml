apiVersion: v1
kind: ServiceAccount
metadata:
  name: transcoder-sa
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: transcoder-role
  namespace: media
rules:
# Pods needed for Argo workflows
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/log", "events"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Workflows and task results needed for Argo workflows and events
- apiGroups: ["argoproj.io"]
  resources: ["workflows", "workflowtaskresults", "workflowtasksets", "workfloweventbindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: transcoder-rolebinding
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: transcoder-role
subjects:
- kind: ServiceAccount
  name: transcoder-sa
  namespace: media
