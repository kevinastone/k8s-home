# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
- ../../components/postgres
patches:
- patch: |-
    apiVersion: barmancloud.cnpg.io/v1
    kind: ObjectStore
    metadata:
      name: postgres
    spec:
      configuration:
        destinationPath: s3://postgres/media
