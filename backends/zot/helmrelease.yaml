# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app zot
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/project-zot/zot
              tag: v2.1.23
            args:
            - serve
            - /etc/zot/config.json
            envFrom:
            - secretRef:
                name: zot-s3-creds
            ports:
            - containerPort: &httpPort 5000
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /v2/
                port: http
              readiness: *probes
              startup:
                enabled: true
                type: HTTP
                path: /v2/
                port: http
                spec:
                  initialDelaySeconds: 2
                  periodSeconds: 2
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: *httpPort
            targetPort: http
    serviceMonitor:
      main:
        enabled: true
        service:
          identifier: main
        endpoints:
        - port: http
          path: /metrics
          interval: 30s
    persistence:
      data:
        type: emptyDir
        globalMounts:
        - path: /var/lib/zot
      config:
        type: configMap
        name: zot-config # overridden by kustomizeconfig
        globalMounts:
        - path: /etc/zot/config.json
          subPath: config.json
          readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
