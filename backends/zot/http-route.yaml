# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zot
spec:
  parentRefs:
  - name: public-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - zot.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: zot
      port: 5000
    matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 5m
      backendRequest: 5m
