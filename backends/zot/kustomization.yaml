# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zot
resources:
- dragonfly.yaml
- helmrelease.yaml
- http-route.yaml
- s3-creds.yaml
configMapGenerator:
- name: zot-config
  files:
  - resources/config.json
- name: zot-dashboard
  options:
    labels:
      grafana_dashboard: "true"
  files:
  - dashboards/zot.json
components:
- ../../components/dragonfly
- ../../components/namespace
- ../../components/goldilocks
- ../../components/kustomizeconfig
