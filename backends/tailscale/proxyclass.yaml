# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tailscale.com/proxyclass_v1alpha1.json
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: tailscale-connector-class
spec:
  statefulSet:
    pod:
      annotations:
        config.cilium.io/disable-source-ip-verification: "true"
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            tailscale.com/parent-resource: home-network
      tailscaleContainer:
        env:
        - name: TS_USERSPACE
          value: "true"
  metrics:
    enable: true
    serviceMonitor:
      enable: true
