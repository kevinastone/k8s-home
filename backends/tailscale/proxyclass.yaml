apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: tailscale-connector-class
spec:
  statefulSet:
    pod:
      annotations:
        config.cilium.io/disable-source-ip-verification: "true"
      tailscaleContainer:
        env:
        - name: TS_USERSPACE
          value: "true"



