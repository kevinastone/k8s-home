# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tailscale.com/connector_v1alpha1.json
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: &name home-network
spec:
  proxyClass: tailscale-connector-class
  replicas: 2
  hostnamePrefix: *name
  exitNode: true
  subnetRouter:
    advertiseRoutes:
    - 192.168.0.0/16
    - 10.96.0.0/12
