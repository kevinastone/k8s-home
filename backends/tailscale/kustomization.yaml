# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tailscale
resources:
- connector.yaml
- proxyclass.yaml
configMapGenerator:
- name: tailscale-dashboard
