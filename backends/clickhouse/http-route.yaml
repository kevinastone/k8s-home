# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clickhouse
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Metrics
    gethomepage.dev/href: https://clickhouse.k8s.kevinastone.com
    gethomepage.dev/icon: /assets/icons/svg/clickhouse.svg
    gethomepage.dev/name: ClickHouse
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - clickhouse.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: clickhouse-ui
      port: 3488
    matches:
    - path:
        type: PathPrefix
        value: /
