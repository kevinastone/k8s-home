# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-users
spec:
  refreshPolicy: CreatedOnce
  target:
    name: clickhouse-users
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        grafana: "{{ .grafana_password }}"
        grafana.yaml: |
          profiles:
            grafana_readonly:
              readonly: 2
          users:
            grafana:
              password: "{{ .grafana_password }}"
              profile: grafana_readonly
              allow_databases:
                database: metrics
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: ClusterGenerator
        name: password-alphanumeric
    rewrite:
    - transform:
        template: grafana_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-vector-user
spec:
  refreshPolicy: CreatedOnce
  target:
    name: clickhouse-vector-user
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        vector: "{{ .vector_password }}"
        vector.yaml: |
          users:
            vector:
              password: "{{ .vector_password }}"
              allow_databases:
                database: metrics
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: ClusterGenerator
        name: password-alphanumeric
    rewrite:
    - transform:
        template: vector_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-admin-user
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: one-password
  target:
    name: clickhouse-admin-user
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        admin.yaml: |
          profiles:
            admin:
              s3_allow_server_credentials_in_user_queries: 1
          users:
            {{ .username }}:
              password: "{{ .password }}"
              profile: admin
              access_management: 1
              named_collection_control: 1
              show_named_collections: 1
              show_named_collections_secrets: 1
  dataFrom:
  - extract:
      key: Clickhouse
