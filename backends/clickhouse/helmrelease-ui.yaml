# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app clickhouse-ui
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/caioricciuti/ch-ui
              tag: v2.33.1@sha256:669a92700a775081fd0ab4c0828d626bbb566d731add0acddbde4cfd9274fa4b
            args:
            - --pid-file=/app/data/ch-ui-server.pid
            env:
              CLICKHOUSE_URL: http://clickhouse.clickhouse.svc.cluster.local:8123
            ports:
            - containerPort: &httpPort 3488
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
                port: http
              readiness: *probes
              startup: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: *httpPort
            targetPort: http
    persistence:
      data:
        type: emptyDir
        globalMounts:
        - path: /app/data
