# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app clickhouse
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        statefulset:
          volumeClaimTemplates:
          - name: data
            accessMode: ReadWriteOnce
            size: 15Gi
            storageClass: longhorn
            labels:
              kopiur.home-operations.com/backup: "true"
            globalMounts:
            - path: /data
        containers:
          main:
            image:
              repository: docker.io/clickhouse/clickhouse-server
              tag: 26.10@sha256:4c60eed5d046f5cc4cf4633c400093e9f3d09f842e34e1625b6e4c25ecc0ab2f
            env:
              CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "1"
              CLICKHOUSE_SKIP_USER_SETUP: "1"
            envFrom:
            - secretRef:
                name: s3-creds
            ports:
            - containerPort: &httpPort 8123
              name: http
            - containerPort: &nativePort 9000
              name: native
            - containerPort: &metricsPort 9363
              name: metrics
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /ping
                port: http
              readiness: *probes
              startup:
                !!merge <<: *probes
                spec:
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: *httpPort
            targetPort: http
          native:
            port: *nativePort
            targetPort: native
          metrics:
            port: *metricsPort
            targetPort: metrics
    serviceMonitor:
      main:
        enabled: true
        service:
          identifier: main
        endpoints:
        - port: metrics
          interval: 30s
    persistence:
      s3-cache:
        type: emptyDir
        sizeLimit: 5Gi
        globalMounts:
        - path: /cache
      config:
        type: configMap
        name: clickhouse-config # overridden by kustomizeconfig
        globalMounts:
        - path: /etc/clickhouse-server/config.d
      init:
        type: configMap
        name: clickhouse-init # overridden by kustomizeconfig
        globalMounts:
        - path: /docker-entrypoint-initdb.d
      users-grafana:
        type: secret
        name: clickhouse-grafana-user
        globalMounts:
        - path: /etc/clickhouse-server/users.d/grafana.yaml
          subPath: grafana.yaml
      users-vector:
        type: secret
        name: clickhouse-vector-user
        globalMounts:
        - path: /etc/clickhouse-server/users.d/vector.yaml
          subPath: vector.yaml
      users-default:
        type: configMap
        name: clickhouse-default-user
        globalMounts:
        - path: /etc/clickhouse-server/users.d/default.yaml
          subPath: default.yaml
      users-admin:
        type: secret
        name: clickhouse-admin-user
        globalMounts:
        - path: /etc/clickhouse-server/users.d/admin.yaml
          subPath: admin.yaml
