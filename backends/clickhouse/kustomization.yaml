# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clickhouse
resources:
- datasource.yaml
- helmrelease-ui.yaml
- helmrelease.yaml
- http-route.yaml
- kubernetes-store.yaml
- users.yaml
- vector-creds.yaml
components:
- ../../components/namespace
- ../../components/goldilocks
- ../../components/kopiur/rolling
- ../../components/kustomizeconfig
- ../../components/rustfs-bucket
patches:
- target:
    group: external-secrets.io
    version: v1
    kind: ExternalSecret
    name: s3-creds
  patch: |-
    - op: replace
      path: /spec/target/template/data/AWS_ACCESS_KEY_ID
      value: clickhouse
configMapGenerator:
- name: clickhouse-config
  files:
  - config/config.yaml
- name: clickhouse-init
  files:
  - initdb/telegraf.sql
  - initdb/zigbee2mqtt.sql
- name: clickhouse-default-user
  files:
  - users/default.yaml
- name: clickhouse-dashboard
  options:
    labels:
      grafana_dashboard: "true"
  files:
  - dashboards/clickhouse.json
