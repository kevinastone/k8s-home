# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clickhouse
resources:
- datasource.yaml
- helmrelease-ui.yaml
- helmrelease.yaml
- http-route.yaml
- kubernetes-store.yaml
- s3-creds.yaml
- users.yaml
- vector-creds.yaml
components:
- ../../components/namespace
- ../../components/goldilocks
- ../../components/kustomizeconfig
configMapGenerator:
- name: clickhouse-config
  files:
  - resources/config.yaml
- name: clickhouse-init
  files:
  - resources/telegraf.sql
  - resources/zigbee2mqtt.sql
- name: clickhouse-dashboard
  options:
    labels:
      grafana_dashboard: "true"
  files:
  - dashboards/clickhouse.json
