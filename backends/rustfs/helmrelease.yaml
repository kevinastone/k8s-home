# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rustfs
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: docker.io/rustfs/rustfs
              tag: 1.0.0-beta.3
            env:
              # Sends logs to stdout instead of writing to a file
              RUSTFS_OBS_LOG_DIRECTORY: ""
              RUSTFS_CONSOLE_ENABLE: "true"
              RUSTFS_OBS_ENDPOINT: "http://localhost:4318"
              RUSTFS_OBS_LOGGER_LEVEL: "debug"
              RUSTFS_IDENTITY_OPENID_ENABLE: "true"
              RUSTFS_IDENTITY_OPENID_CONFIG_URL: https://auth.k8s.kevinastone.com/.well-known/openid-configuration
              RUSTFS_IDENTITY_OPENID_CLIENT_ID: rustfs
              RUSTFS_IDENTITY_OPENID_ROLE_POLICY: consoleAdmin
              RUSTFS_IDENTITY_OPENID_CLAIM_PREFIX: authelia
              RUSTFS_IDENTITY_OPENID_DISPLAY_NAME: Authelia
              RUSTFS_IDENTITY_OPENID_SCOPES: openid,profile,email
              RUSTFS_BROWSER_REDIRECT_URL: https://rustfs.k8s.kevinastone.com
            envFrom:
            - secretRef:
                name: rustfs-secret # overriden by kustomizeconfig
            - secretRef:
                name: rustfs-root-secret # overriden by kustomizeconfig
            args:
            - /data
            ports:
            - containerPort: &s3Port 9000
              name: s3
            - containerPort: &httpPort 9001
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
                port: s3
              readiness: *probes
              startup:
                !!merge <<: *probes
                spec:
                  initialDelaySeconds: 2
                  periodSeconds: 2
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
                ephemeral-storage: 50Mi
              limits:
                cpu: 750m
                memory: 1Gi
                ephemeral-storage: 2Gi
          otel-collector:
            image:
              repository: docker.io/otel/opentelemetry-collector-contrib
              tag: 0.152.0
            args:
            - "--config=/etc/otel/config.yaml"
            ports:
            - containerPort: &metricsPort 8889
              name: metrics
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 13133
              name: healthcheck
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
                port: healthcheck
              readiness: *probes
              startup: *probes
      provisioning:
        type: job
        annotations:
          "helm.sh/hook": post-install,post-upgrade
          "helm.sh/hook-delete-policy": before-hook-creation
        initContainers:
          wait-for-minio:
            image:
              repository: ghcr.io/groundnuty/k8s-wait-for
              tag: v2.0
            args:
            - service
            - *app
        containers:
          main:
            image:
              repository: docker.io/rustfs/rc
              tag: v0.1.16
            env:
              MINIO_SCHEME: http
              MC_CONFIG_DIR: /home
            envFrom:
            - secretRef:
                name: rustfs-root-secret # overriden by kustomizeconfig
            command:
            - /bin/sh
            - -c
            - |-
              echo "Start RustFS provisioning";

              rc alias set rustfs http://rustfs:9000 "${RUSTFS_ACCESS_KEY}" "${RUSTFS_SECRET_KEY}"

              # # Provision Users
              for f in /users/*; do
                rc admin user add rustfs "$(basename $f)" "$(cat $f)";
                rc admin policy attach rustfs readwrite --user="$(basename $f)";
              done

              # Provision Buckets
              # TODO: Use this once --ignore-existing is supported
              # rc mb rustfs/postgres --ignore-existing
              rc ls rustfs/postgres 2>/dev/null || rc mb rustfs/postgres

              echo "End RustFS provisioning";

            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        # rustfs requires the user to be in the group 10001
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          api:
            port: *s3Port
            targetPort: s3
          http:
            port: *httpPort
            targetPort: http
          metrics:
            port: *metricsPort
            targetPort: metrics
    serviceMonitor:
      main:
        enabled: true
        serviceName: *app
        endpoints:
        - port: metrics
          interval: 30s
    serviceAccount:
      rustfs: {}
    rbac:
      roles:
        service-reader:
          forceRename: service-reader
          type: Role
          rules:
          - apiGroups:
            - ""
            resources:
            - pods
            - services
            - jobs
            verbs:
            - get
            - list
            - watch
      bindings:
        service-reader:
          forceRename: service-reader
          type: RoleBinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: service-reader
          subjects:
          - kind: ServiceAccount
            name: *app
            namespace: "{{ .Release.Namespace }}"
    persistence:
      home:
        type: emptyDir
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        retain: true
        size: 100Gi
        storageClass: longhorn
        advancedMounts:
          main:
            main:
            - path: /data
      otel-config:
        type: configMap
        name: otel-config # overriden by kustomizeconfig
        advancedMounts:
          main:
            otel-collector:
            - path: /etc/otel
      secrets:
        type: secret
        name: rustfs-root-secret # overriden by kustomizeconfig
        globalMounts:
        - path: /secrets
      users:
        type: secret
        name: rustfs-users # overriden by kustomizeconfig
        advancedMounts:
          provisioning:
            main:
            - path: /users
