# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rustfs
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        type: statefulset
        replicas: 3
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
        annotations:
          reloader.stakater.com/auto: "true"
        statefulset:
          podManagementPolicy: Parallel
          serviceName:
            identifier: headless
          volumeClaimTemplates:
          - name: data
            accessMode: ReadWriteOnce
            size: 50Gi
            storageClass: openebs-hostpath
            globalMounts:
            - path: /data
        pod:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rustfs
                topologyKey: kubernetes.io/hostname
        containers:
          main:
            image:
              repository: docker.io/rustfs/rustfs
              tag: 1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
            env:
              # Sends logs to stdout instead of writing to a file
              RUSTFS_OBS_LOG_DIRECTORY: ""
              RUSTFS_OBS_LOG_STDOUT_ENABLED: "true"
              RUST_LOG: "warn"
              RUSTFS_CONSOLE_ENABLE: "true"
              RUSTFS_OBS_METRIC_ENDPOINT: "http://localhost:4318/v1/metrics"
              RUSTFS_OBS_LOGGER_LEVEL: "warn"
              RUSTFS_OBS_ENDPOINT: "http://localhost:4318"
              RUSTFS_OBS_USE_STDOUT: "false"
              RUSTFS_OBS_TRACES_EXPORT_ENABLED: "false"
              RUSTFS_OBS_LOGS_EXPORT_ENABLED: "false"
              RUSTFS_IDENTITY_OPENID_ENABLE: "true"
              RUSTFS_IDENTITY_OPENID_CONFIG_URL: https://auth.k8s.kevinastone.com/.well-known/openid-configuration
              RUSTFS_IDENTITY_OPENID_CLIENT_ID: rustfs
              RUSTFS_IDENTITY_OPENID_ROLE_POLICY: consoleAdmin
              RUSTFS_IDENTITY_OPENID_CLAIM_PREFIX: authelia
              RUSTFS_IDENTITY_OPENID_DISPLAY_NAME: Authelia
              RUSTFS_IDENTITY_OPENID_SCOPES: openid,profile,email
              RUSTFS_OUTBOUND_ALLOW_ORIGINS: "https://auth.k8s.kevinastone.com"
              RUSTFS_BROWSER_REDIRECT_URL: https://rustfs.k8s.kevinastone.com
              RUSTFS_VOLUMES: "http://rustfs-{0...2}.rustfs-headless.rustfs.svc.cluster.local:9000/data"
              RUSTFS_ERASURE_SET_DRIVE_COUNT: "3"
              RUSTFS_STORAGE_CLASS_STANDARD: "EC:1"
            envFrom:
            - secretRef:
                name: rustfs-client-secret
            - secretRef:
                name: rustfs-root-secret # overriden by kustomizeconfig
            ports:
            - containerPort: &s3Port 9000
              name: s3
            - containerPort: &httpPort 9001
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
                port: s3
              readiness: *probes
              startup:
                !!merge <<: *probes
                spec:
                  initialDelaySeconds: 2
                  periodSeconds: 2
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
                ephemeral-storage: 50Mi
              limits:
                cpu: 750m
                memory: 1Gi
                ephemeral-storage: 2Gi
          otel-collector:
            image:
              repository: docker.io/otel/opentelemetry-collector-contrib
              tag: 0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
            args:
            - "--config=/etc/otel/config.yaml"
            ports:
            - containerPort: &metricsPort 8889
              name: metrics
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 13133
              name: healthcheck
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
                port: healthcheck
              readiness: *probes
              startup: *probes
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        # rustfs requires the user to be in the group 10001
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          api:
            port: *s3Port
            targetPort: s3
          http:
            port: *httpPort
            targetPort: http
          metrics:
            port: *metricsPort
            targetPort: metrics
      headless:
        controller: main
        type: ClusterIP
        clusterIP: None
        publishNotReadyAddresses: true
        ports:
          api:
            port: *s3Port
            targetPort: s3
    serviceMonitor:
      main:
        enabled: true
        service:
          identifier: main
        endpoints:
        - port: metrics
          interval: 30s
    serviceAccount:
      rustfs: {}
    rbac:
      roles:
        service-reader:
          forceRename: service-reader
          type: Role
          rules:
          - apiGroups:
            - ""
            resources:
            - pods
            - services
            - jobs
            verbs:
            - get
            - list
            - watch
      bindings:
        service-reader:
          forceRename: service-reader
          type: RoleBinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: service-reader
          subjects:
          - kind: ServiceAccount
            name: *app
            namespace: "{{ .Release.Namespace }}"
    persistence:
      home:
        type: emptyDir
      otel-config:
        type: configMap
        name: otel-config # overriden by kustomizeconfig
        advancedMounts:
          main:
            otel-collector:
            - path: /etc/otel
      secrets:
        type: secret
        name: rustfs-root-secret # overriden by kustomizeconfig
        globalMounts:
        - path: /secrets
