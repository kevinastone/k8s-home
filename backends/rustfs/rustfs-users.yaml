# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-users
spec:
  refreshPolicy: OnChange
  target:
    name: rustfs-users
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        postgres: "{{ .postgres_password }}"
        dragonfly: "{{ .dragonfly_password }}"
        zot: "{{ .zot_password }}"
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: ClusterGenerator
        name: password-alphanumeric
    rewrite:
    - transform:
        template: postgres_password
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: ClusterGenerator
        name: password-alphanumeric
    rewrite:
    - transform:
        template: dragonfly_password
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: ClusterGenerator
        name: password-alphanumeric
    rewrite:
    - transform:
        template: zot_password
