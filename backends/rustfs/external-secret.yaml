apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-users
spec:
  refreshInterval: "0"
  target:
    name: rustfs-users
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        postgres: "{{ .password }}"
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: rustfs-postgres-password
