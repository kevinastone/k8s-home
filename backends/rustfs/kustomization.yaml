# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rustfs
resources:
- helmrelease.yaml
- gateway.yaml
- http-route.yaml
- rustfs-root-secret.yaml
- rustfs-kubernetes-store.yaml
- prometheus-rule.yaml
configMapGenerator:
- name: rustfs-dashboard
  options:
    labels:
      grafana_dashboard: "true"
  files:
  - dashboards/rustfs.json
components:
- ../../components/namespace
- ../../components/goldilocks
- ../../components/kustomizeconfig
- ../../components/oidc-client
patches:
- target:
    group: external-secrets.io
    version: v1
    kind: ExternalSecret
    name: oidc-client-secret
  patch: |-
    - op: add
      path: /spec/target/template/data/RUSTFS_IDENTITY_OPENID_CLIENT_SECRET
      value: "{{ .password }}"
- patch: |-
    apiVersion: infra.contrib.fluxcd.io/v1alpha2
    kind: Terraform
    metadata:
      name: oidc-client
    spec:
      vars:
      - name: client_id
        value: rustfs
      - name: client_name
        value: RustFS
      - name: redirect_uris
        value:
        - https://rustfs.k8s.kevinastone.com/rustfs/admin/v3/oidc/callback/default
      - name: web_origins
        value:
        - https://rustfs.k8s.kevinastone.com
