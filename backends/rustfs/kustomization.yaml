# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rustfs
resources:
- namespace.yaml
- helmrelease.yaml
- http-route.yaml
- terraform.yaml
- rustfs-users.yaml
- rustfs-root-secret.yaml
- rustfs-kubernetes-store.yaml
configMapGenerator:
- name: otel-config
  files:
  - resources/config.yaml
- name: rustfs-dashboard
  options:
    labels:
      grafana_dashboard: "true"
  files:
  - dashboards/rustfs.json
configurations:
- kustomizeconfig.yaml
