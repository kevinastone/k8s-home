# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rustfs
resources:
- namespace.yaml
- helmrelease.yaml
- http-route.yaml
- terraform.yaml
- postgres-password-generator.yaml
- external-secret.yaml
- rustfs-kubernetes-store.yaml
secretGenerator:
- name: rustfs-root-secret
  literals:
  - RUSTFS_ACCESS_KEY=root
  files:
  - RUSTFS_SECRET_KEY=secrets/password.txt.encrypted
configMapGenerator:
- name: otel-config
  files:
  - resources/config.yaml
- name: rustfs-dashboard
  options:
    labels:
      grafana_dashboard: "true"
  files:
  - dashboards/rustfs.json
configurations:
- kustomizeconfig.yaml
