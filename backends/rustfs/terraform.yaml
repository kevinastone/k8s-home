# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/infra.contrib.fluxcd.io/terraform_v1alpha2.json
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: rustfs
spec:
  serviceAccountName: tf-runner
  interval: 10m
  approvePlan: auto
  path: ./backends/rustfs/tofu
  sourceRef:
    kind: GitRepository
    name: fluxcd-sync
    namespace: flux-system
  varsFrom:
  - kind: Secret
    name: rustfs-root-secret
    varsKeys:
    - RUSTFS_ACCESS_KEY
    - RUSTFS_SECRET_KEY
  - kind: Secret
    name: rustfs-users
    varsKeys:
    - postgres
    - dragonfly
    - clickhouse
