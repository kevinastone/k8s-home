exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "rustfs"
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      # ORDER MATTERS: k8sattributes first, then batch
      # processors: [k8sattributes, batch]
      processors: [batch]
      exporters: [prometheus]
