# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# ---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Servers
    gethomepage.dev/icon: /assets/icons/svg/rustfs.svg
    gethomepage.dev/name: RustFS
spec:
  parentRefs:
  - name: public-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - rustfs.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: rustfs-main
      port: 9001
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-s3
spec:
  parentRefs:
  - name: public-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - s3.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: rustfs-main
      port: 9000
    matches:
    - path:
        type: PathPrefix
        value: /
