apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-admin
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Servers
    gethomepage.dev/icon: /assets/icons/svg/garage.svg
    gethomepage.dev/name: Garage
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=garage"
spec:
  parentRefs:
  - name: public-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - garage.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: garage
      port: 3903
    matches:
    - path:
        type: PathPrefix
        value: /
