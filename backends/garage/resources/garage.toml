metadata_dir = "/meta"
data_dir = "/data"
db_engine = "lmdb"
metadata_auto_snapshot_interval = "6h"
replication_factor = 3
compression_level = 2
rpc_bind_addr = "[::]:3901"
rpc_secret_file = "/secrets/rpc.token"
# This is necessary for K8s secrets support
allow_world_readable_secrets = true

[kubernetes_discovery]
namespace = "garage"
service_name = "garage"
skip_crd = false

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

[s3_web]
bind_addr = "[::]:3902"
root_domain = "web.k8s.kevinastone.com"

[admin]
api_bind_addr = "[::]:3903"
metrics_require_token = false
admin_token_file = "/secrets/admin.token"
