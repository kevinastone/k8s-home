---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app garage
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        type: statefulset
        replicas: 3
        annotations:
          reloader.stakater.com/auto: "true"
        statefulset:
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 100Gi
              storageClass: openebs-hostpath
              globalMounts:
                - path: /data
            - name: meta
              accessMode: ReadWriteOnce
              size: 5Gi
              storageClass: openebs-hostpath
              globalMounts:
                - path: /meta
        pod:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: [*app]
                  topologyKey: kubernetes.io/hostname
        containers:
          main:
            image:
              repository: docker.io/dxflrs/garage
              tag: v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a
            envFrom:
              - secretRef:
                  name: garage-secret # overriden by kustomizeconfig
            ports:
              - containerPort: 3900
                name: http
              - containerPort: 3902
                name: web
              - containerPort: 3903
                name: admin
            # probes:
            #   readiness: &probes
            #     enabled: true
            #     type: HTTP
            #     path: /health
            #     port: 3903
            #     spec:
            #       initialDelaySeconds: 10
            #       periodSeconds: 10
            #       timeoutSeconds: 5
            #       failureThreshold: 3
            #   liveness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 3900
          web:
            port: 3902
          admin:
            port: 3903
    serviceMonitor:
      main:
        enabled: true
        serviceName: *app
        endpoints:
          - port: admin
            path: /metrics
            interval: 30s
    serviceAccount:
      create: true
      name: *app
    rbac:
      create: true
      roles:
        manage-crds:
          forceRename: manage-crds-garage
          type: ClusterRole
          rules:
            - apiGroups: ["apiextensions.k8s.io"]
              resources: ["customresourcedefinitions"]
              verbs: ["get", "list", "watch", "create", "patch"]
            - apiGroups: ["deuxfleurs.fr"]
              resources: ["garagenodes"]
              verbs:
                - get
                - list
                - watch
                - create
                - update
                - patch
                - delete
      bindings:
        manage-crds:
          forceRename: manage-crds-garage
          type: ClusterRoleBinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: manage-crds-garage
          subjects:
            - kind: ServiceAccount
              name: *app
              namespace: "{{ .Release.Namespace }}"
    persistence:
      config:
        enabled: true
        type: configMap
        name: garage-config
        globalMounts:
          - path: /etc/garage.toml
            subPath: garage.toml
      secrets:
        enabled: true
        type: secret
        name: garage-secret # overriden by kustomizeconfig
        globalMounts:
          - path: /secrets
