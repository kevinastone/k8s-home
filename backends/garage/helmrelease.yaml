# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app garage
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        type: statefulset
        replicas: 3
        annotations:
          reloader.stakater.com/auto: "true"
        statefulset:
          volumeClaimTemplates:
          - name: data
            accessMode: ReadWriteOnce
            size: 100Gi
            storageClass: openebs-hostpath
            globalMounts:
            - path: /data
          - name: meta
            accessMode: ReadWriteOnce
            size: 5Gi
            storageClass: openebs-hostpath
            globalMounts:
            - path: /meta
        pod:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [*app]
                topologyKey: kubernetes.io/hostname
        containers:
          main:
            image:
              repository: docker.io/dxflrs/garage
              tag: v2.4.0@sha256:715d176efc35384bf72cf6052fd61b74b3e27a1e31a9dfedabe646bd1e92f137
            envFrom:
            - secretRef:
                name: garage-secret # overriden by kustomizeconfig
            ports:
            - containerPort: 3900
              name: http
            - containerPort: 3902
              name: web
            - containerPort: 3903
              name: admin
            # probes:
            #   readiness: &probes
            #     enabled: true
            #     type: HTTP
            #     path: /health
            #     port: 3903
            #     spec:
            #       initialDelaySeconds: 10
            #       periodSeconds: 10
            #       timeoutSeconds: 5
            #       failureThreshold: 3
            #   liveness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: {type: RuntimeDefault}
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 3900
          web:
            port: 3902
          admin:
            port: 3903
    serviceMonitor:
      main:
        enabled: true
        serviceName: *app
        endpoints:
        - port: admin
          path: /metrics
          interval: 30s
    serviceAccount:
      garage: {}
    rbac:
      roles:
        manage-crds:
          forceRename: manage-crds-garage
          type: ClusterRole
          rules:
          - apiGroups: ["apiextensions.k8s.io"]
            resources: ["customresourcedefinitions"]
            verbs: ["get", "list", "watch", "create", "patch"]
          - apiGroups: ["deuxfleurs.fr"]
            resources: ["garagenodes"]
            verbs:
            - get
            - list
            - watch
            - create
            - update
            - patch
            - delete
      bindings:
        manage-crds:
          forceRename: manage-crds-garage
          type: ClusterRoleBinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: manage-crds-garage
          subjects:
          - kind: ServiceAccount
            name: garage
            namespace: "{{ .Release.Namespace }}"
    persistence:
      config:
        enabled: true
        type: configMap
        name: garage-config
        globalMounts:
        - path: /etc/garage.toml
          subPath: garage.toml
      secrets:
        enabled: true
        type: secret
        name: garage-secret # overriden by kustomizeconfig
        globalMounts:
        - path: /secrets
