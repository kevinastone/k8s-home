---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: garage
resources:
  - namespace.yaml
  - helmrelease.yaml
  - http-route.yaml
configMapGenerator:
  - name: garage-config
    files:
      - resources/garage.toml
  - name: garage-dashboard
    options:
      labels:
        grafana_dashboard: "true"
    files:
      - dashboards/garage.json
secretGenerator:
  - name: garage-secret
    literals:
      - admin.token=5678
    files:
      - rpc.token=secrets/rpc.token.encrypted
configurations:
  - kustomizeconfig.yaml
