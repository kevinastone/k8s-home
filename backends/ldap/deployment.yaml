---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.14.0/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
spec:
  selector:
    matchLabels:
      app: lldap
  replicas: 1
  template:
    metadata:
      labels:
        app: lldap
    spec:
      containers:
        - name: lldap
          image: ghcr.io/lldap/lldap:v0.6.1@sha256:4931eeeb841b1bbf5774161b5fd9dab88f41ffeb4b08ca656f0b7595cd7cb52a
          envFrom:
            - secretRef:
                name: lldap-secret # overriden by kustomizeconfig
            - prefix: postgres_
              secretRef:
                name: postgres-app
          env:
            - name: LLDAP_DATABASE_URL
              value: $(postgres_uri)
          ports:
            - containerPort: 17170
              name: http
              protocol: TCP
            - containerPort: 3890
              name: ldap
              protocol: TCP
          livenessProbe: &probes
            exec:
              command:
                - /app/lldap
                - healthcheck
          readinessProbe: *probes
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
