---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.14.0/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
spec:
  selector:
    matchLabels:
      app: lldap
  replicas: 1
  template:
    metadata:
      labels:
        app: lldap
    spec:
      containers:
      - name: lldap
        image: ghcr.io/lldap/lldap:v0.5.0@sha256:f0f5d92cd6c6dca9415993cfc57919f0618e87090b323a98c1536975860fa45a
        envFrom:
        - secretRef:
            name: lldap-secret # overriden by kustomizeconfig
        - secretRef:
            name: postgres-app
        env:
          - name: LLDAP_DATABASE_URL
            value: $(uri)
        ports:
        - containerPort: 17170
          name: http
          protocol: TCP
        - containerPort: 3890
          name: ldap
          protocol: TCP
        livenessProbe: &probes
          exec:
            command:
              - /app/lldap
              - healthcheck
        readinessProbe: *probes
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
