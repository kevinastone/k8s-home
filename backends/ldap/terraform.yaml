# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/infra.contrib.fluxcd.io/terraform_v1alpha2.json
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: lldap
spec:
  serviceAccountName: tf-runner
  interval: 15m
  approvePlan: auto
  path: ./backends/ldap/tofu
  sourceRef:
    kind: GitRepository
    name: fluxcd-sync
    namespace: flux-system
  varsFrom:
  - kind: Secret
    name: lldap-secret
    varsKeys:
    - LLDAP_LDAP_USER_DN
    - LLDAP_LDAP_USER_PASS
    - LLDAP_LDAP_BASE_DN
  runnerPodTemplate:
    spec:
      env:
      - name: OP_CONNECT_HOST
        value: "http://onepassword-connect.one-password.svc.cluster.local:8438"
      - name: OP_CONNECT_TOKEN
        valueFrom:
          secretKeyRef:
            name: onepassword-connect-token
            key: token
