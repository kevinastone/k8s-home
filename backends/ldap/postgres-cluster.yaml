---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.2-3
  primaryUpdateStrategy: unsupervised
  storage:
    size: 1Gi
    storageClass: longhorn
  superuserSecret:
    name: postgres-secret # overriden by kustomizeconfig
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: lldap
  resources:
    requests:
      cpu: 200m
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      # Try to reduce space occupied by the WAL
      wal_keep_size: '128MB'
      wal_keep_segments: '8'
