---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/lldap/lldap
              tag: v0.6.1@sha256:4931eeeb841b1bbf5774161b5fd9dab88f41ffeb4b08ca656f0b7595cd7cb52a
            envFrom:
              - secretRef:
                  name: lldap-secret # overriden by kustomizeconfig
              - secretRef:
                  name: lldap-user-secret
              - prefix: postgres_
                secretRef:
                  name: postgres-app
            env:
              LLDAP_DATABASE_URL: $(postgres_uri)
            ports:
              - containerPort: 17170
                name: http
                protocol: TCP
              - containerPort: 3890
                name: ldap
                protocol: TCP
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /app/lldap
                      - healthcheck
              readiness: *probes

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 80
            targetPort: http
          ldap:
            port: 389
            targetPort: ldap

    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /data
