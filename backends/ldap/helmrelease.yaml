# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        strategy: RollingUpdate
        replicas: 2
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/lldap/lldap
              tag: v0.6.2@sha256:9e605a66c02514bfcffd1b67cafb1e98d50992216bb2871d7ae44622047dd09d
            envFrom:
            - secretRef:
                name: lldap-secret
            - prefix: postgres_
              secretRef:
                name: postgres-app
            env:
              LLDAP_DATABASE_URL: $(postgres_uri)
            ports:
            - containerPort: 17170
              name: http
              protocol: TCP
            - containerPort: 3890
              name: ldap
              protocol: TCP
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - /app/lldap
                    - healthcheck
              readiness: *probes

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 80
            targetPort: http
          ldap:
            port: 389
            targetPort: ldap

    persistence:
      data:
        type: emptyDir
        globalMounts:
        - path: /data
