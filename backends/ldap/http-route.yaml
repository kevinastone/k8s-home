# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lldap
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Servers
    gethomepage.dev/icon: /assets/icons/svg/lldap-dark.svg
    gethomepage.dev/name: LLDAP
spec:
  parentRefs:
  - name: public-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - ldap.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: lldap
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
