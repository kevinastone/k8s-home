---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.7.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/library/eclipse-mosquitto
              tag: 2.0.20@sha256:21421af7b32bf9ce508e9090c8eb13bb81f410ca778dc205506180a6f862d0eb
            command:
              - mosquitto
            args:
              - "-c"
              - /config/mosquitto.conf
            ports:
              - containerPort: 1883
                name: mqtt
              - containerPort: 9090
                name: websocket
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: mqtt
              readiness: *probes

    service:
      main:
        controller: main
        # annotations:
        #   coredns.io/hostname: "mqtt.k8s.kevinastone.com"
        type: LoadBalancer
        ports:
          mqtt:
            primary: true
            protocol: TCP
            port: 1883

    persistence:
      config:
        type: configMap
        name: mosquitto-config # overriden by kustomizeconfig
        globalMounts:
          - path: /config/mosquitto.conf
            subPath: mosquitto.conf
            readOnly: true
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        retain: true
        globalMounts:
          - path: /data
