---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/library/eclipse-mosquitto
              tag: 2.0.22@sha256:077fe4ff4c49df1e860c98335c77dda08360629e0e2a718147027e4db3eace9d
            command:
              - mosquitto
            args:
              - "-c"
              - /config/mosquitto.conf
            ports:
              - containerPort: 1883
                name: mqtt
              - containerPort: 9090
                name: websocket
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: mqtt
              readiness: *probes

    service:
      main:
        controller: main
        # annotations:
        #   coredns.io/hostname: "mqtt.k8s.kevinastone.com"
        type: LoadBalancer
        ports:
          mqtt:
            primary: true
            protocol: TCP
            port: 1883

    persistence:
      config:
        type: configMap
        name: mosquitto-config # overriden by kustomizeconfig
        globalMounts:
          - path: /config/mosquitto.conf
            subPath: mosquitto.conf
            readOnly: true
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        retain: true
        globalMounts:
          - path: /data
