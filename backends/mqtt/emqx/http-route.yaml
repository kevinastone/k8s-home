---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: emqx
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - emqx.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: emqx
          port: 18083
      matches:
        - path:
            type: PathPrefix
            value: /
