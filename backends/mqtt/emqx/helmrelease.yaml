# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: emqx
spec:
  interval: 5m
  chart:
    spec:
      chart: emqx
      version: 5.8.9
      sourceRef:
        kind: HelmRepository
        name: emqx
        namespace: flux-system
      interval: 5m
  values:
    emqxConfig:
      EMQX_AUTHORIZATION__NO_MATCH: allow
      EMQX_LOG__CONSOLE_HANDLER__LEVEL: info

    emqxAclConfig: >
      {allow, {user, "dashboard"}, subscribe, ["$SYS/#"]}. {allow, {ipaddr, "127.0.0.1"}, pubsub, ["$SYS/#", "#"]}. {allow, all, subscribe, ["$SYS/#", {eq, "#"}]}. {allow, all}.
    metrics:
      enabled: true
    extraVolumes:
    - name: emqx-tls
      secret:
        secretName: emqx-tls
        items:
        - key: tls.crt
          path: cert.pem
        - key: tls.key
          path: key.pem
        - key: tls.crt
          path: cacert.pem
        - key: tls.crt
          path: tls.crt
        - key: tls.key
          path: tls.key
    extraVolumeMounts:
    - name: emqx-tls
      mountPath: /opt/emqx/etc/certs
      readOnly: true
    persistence:
      enabled: true
      size: 1Gi
      storageClass: openebs-hostpath
    service:
      annotations:
        coredns.io/hostname: "mqtt.k8s.kevinastone.com"
      type: LoadBalancer
    resources:
      requests:
        cpu: 100m
        memory: 256M
      limits:
        memory: 512M
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
