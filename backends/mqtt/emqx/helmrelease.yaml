---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: emqx
spec:
  interval: 5m
  chart:
    spec:
      chart: emqx
      version: 5.8.4
      sourceRef:
        kind: HelmRepository
        name: emqx
        namespace: flux-system
      interval: 5m
  values:
    metrics:
      enabled: true
    persistence:
      enabled: true
      size: 1Gi
    service:
      annotations:
        coredns.io/hostname: "mqtt2.k8s.kevinastone.com"
      type: LoadBalancer
