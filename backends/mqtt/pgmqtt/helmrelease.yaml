# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgmqtt
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/bo0tzz/charts/pgmqtt
      ref:
        tag: 0.2.0
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      install: false
    replicaCount: 2
    database:
      existingSecret: postgres-app
      existingSecretKey: uri
    auth:
      allowAnonymous: true
    serviceMonitor:
      enabled: true
    tests:
      enabled: false
