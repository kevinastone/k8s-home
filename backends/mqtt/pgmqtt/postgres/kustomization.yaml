# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
- ../../../../components/postgres
patches:
- patch: |-
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: postgres
    spec:
      bootstrap:
        initdb:
          database: pgmqtt
          owner: pgmqtt
- patch: |-
    apiVersion: postgresql.cnpg.io/v1
    kind: ScheduledBackup
    metadata:
      name: postgres
    spec:
      schedule: "0 45 5 * * *"
- patch: |-
    apiVersion: barmancloud.cnpg.io/v1
    kind: ObjectStore
    metadata:
      name: postgres
    spec:
      configuration:
        destinationPath: s3://postgres/mqtt
