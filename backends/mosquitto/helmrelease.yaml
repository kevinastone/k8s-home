---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.4.0
      sourceRef:
        kind: HelmRepository
        name: bernd-schorgers
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/library/eclipse-mosquitto
              tag: 2.0.18@sha256:8a5c6055f9dfa964df88c49ffd533a469d7f010d4b0fc17c614707125120588a
            command:
              - mosquitto
            args:
              - "-c"
              - /config/mosquitto.conf
            ports:
            - containerPort: 1883
              name: mqtt
            - containerPort: 9090
              name: websocket
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: mqtt
              readiness: *probes

    service:
      main:
        controller: main
        annotations:
          coredns.io/hostname: "mqtt.k8s.kevinastone.com"
        type: LoadBalancer
        ports:
          mqtt:
            primary: true
            protocol: TCP
            port: 1883

    persistence:
      config:
        type: configMap
        name: mosquitto-config # overriden by kustomizeconfig
        globalMounts:
          - path: /config/mosquitto.conf
            subPath: mosquitto.conf
            readOnly: true
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        retain: false
        globalMounts:
          - path: /data
