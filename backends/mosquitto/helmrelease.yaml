---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 2.5.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/library/eclipse-mosquitto
              tag: 2.0.18
            command:
              - mosquitto
            args:
              - "-c"
              - /config/mosquitto.conf
            ports:
            - containerPort: 1883
              name: mqtt
            - containerPort: 9090
              name: websocket
            livenessProbe:
              tcpSocket:
                port: mqtt
            readinessProbe:
              tcpSocket:
                port: mqtt

    service:
      main:
        annotations:
          coredns.io/hostname: "mqtt.k8s.kevinastone.com"
        type: LoadBalancer
        ports:
          http:
            enabled: false
            primary: false
          mqtt:
            enabled: true
            primary: true
            protocol: TCP
            port: 1883

    ingress:
      main:
        enabled: false

    persistence:
      config:
        enabled: true
        type: configMap
        name: mosquitto-config # overriden by kustomizeconfig
        globalMounts:
          - path: /config/mosquitto.conf
            subPath: mosquitto.conf
            readOnly: true
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        retain: false
        globalMounts:
          - path: /data
