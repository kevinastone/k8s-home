# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: one-password
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.one-password.svc.cluster.local:8438
      vaults:
        Homelab: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: one-password-secret # overriden by kustomizeconfig
            key: token
            namespace: one-password
