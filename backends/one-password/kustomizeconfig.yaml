nameReference:
  - kind: Secret
    version: v1
    fieldSpecs:
      - path: spec/values/persistence/secrets/name
        kind: HelmRelease
      - path: spec/provider/onepassword/auth/secretRef/connectTokenSecretRef/name
        kind: ClusterSecretStore
      - path: spec/provider/onepasswordSDK/auth/serviceAccountSecretRef/name
        kind: ClusterSecretStore
