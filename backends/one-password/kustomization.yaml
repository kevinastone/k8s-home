# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: one-password
resources:
- helmrelease.yaml
- cluster-secret-store.yaml
- cluster-secret-store-sdk.yaml
- kubernetes-store.yaml
components:
- ../../components/namespace
- ../../components/goldilocks
- ../../components/kustomizeconfig
configurations:
- kustomizeconfig.yaml
secretGenerator:
- name: one-password-credentials
  files:
  - 1password-credentials.json=secrets/1password-credentials.json.encrypted
  - service-account.token=secrets/service-account.token.encrypted
- name: onepassword-connect-token
  options:
    disableNameSuffixHash: true
  files:
  - token=secrets/token.encrypted
