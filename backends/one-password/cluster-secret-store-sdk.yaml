---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: one-password-sdk
spec:
  provider:
    onepasswordSDK:
      vault: Homelab
      auth:
        serviceAccountSecretRef:
          name: one-password-secret # overriden by kustomizeconfig
          key: service-account.token
          namespace: one-password
