# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: authentik
spec:
  interval: 12h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://ghcr.io/goauthentik/helm-charts/authentik
  ref:
    tag: 2026.8.1
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: authentik
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      envFrom:
      - secretRef:
          name: authentik-secret # overriden by kustomizeconfig
      - prefix: postgres_
        secretRef:
          name: postgres-app
      env:
      - name: AUTHENTIK_POSTGRESQL__NAME
        value: $(postgres_dbname)
      - name: AUTHENTIK_POSTGRESQL__HOST
        value: $(postgres_host)
      - name: AUTHENTIK_POSTGRESQL__PORT
        value: $(postgres_port)
      - name: AUTHENTIK_POSTGRESQL__USER
        value: $(postgres_user)
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        value: $(postgres_password)
      - name: AUTHENTIK_REDIS__HOST
        value: redis-sentinel-proxy
      - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
        value: "true"
      - name: AUTHENTIK_DISABLE_UPDATE_CHECK
        value: "true"
      - name: AUTHENTIK_ERROR_REPORTING__ENABLED
        value: "false"
    server:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    worker:
      envFrom:
      - secretRef:
          name: authentik-bootstrap # overriden by kustomizeconfig
    prometheus:
      rules:
        enabled: true
    postgresql:
      enabled: false
    redis:
      enabled: false
    blueprints:
      # -- List of config maps to mount blueprints from.
      # Only keys in the configMap ending with `.yaml` will be discovered and applied.
      configMaps: []
      # -- List of secrets to mount blueprints from.
      # Only keys in the secret ending with `.yaml` will be discovered and applied.
      secrets: []
