---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.2-3
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  affinity:
    podAntiAffinityType: required
  storage:
    size: 1Gi
    storageClass: openebs-hostpath
  bootstrap:
    initdb:
      database: authentik
  resources:
    requests:
      cpu: 200m
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
  walStorage:
    size: 256Mi
    storageClass: openebs-hostpath
  replicationSlots:
    highAvailability:
      enabled: true
  postgresql:
    parameters:
      max_slot_wal_keep_size: 96MB
      hot_standby_feedback: "on"
      wal_keep_size: 32MB
      max_wal_size: 64MB
      min_wal_size: 32MB
  backup:
    barmanObjectStore:
      destinationPath: s3://postgres/authentik
      endpointURL: https://s3.k8s.kevinastone.com
      s3Credentials:
        accessKeyId:
          name: s3-creds
          key: ACCESS_KEY
        secretAccessKey:
          name: s3-creds
          key: SECRET_KEY
      wal:
        compression: &compression bzip2
      data:
        compression: *compression
    retentionPolicy: "7d"
