apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authentik-extauth
spec:
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    matchLabels:
      auth: authentik
  extAuth:
    http:
      backendRef:
        name: ak-outpost-authentik-embedded-outpost
        namespace: authentik
        port: 80
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
      - cookie
      - set-cookie
      # - x-authentik-*
      - x-authentik-username
      - x-authentik-groups
      - x-authentik-email
      - x-authentik-name
      - x-authentik-uid
      - x-authentik-jwt
      - x-authentik-meta-jwks
      - x-authentik-meta-outpost
      - x-authentik-meta-provider
      - x-authentik-meta-app
      - x-authentik-meta-version
    headersToExtAuth:
    - cookie
