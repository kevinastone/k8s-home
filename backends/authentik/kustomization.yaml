# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
resources:
- namespace.yaml
- postgres
- redis.yaml
- helmrelease.yaml
- helmrelease-redis-sentinel-proxy.yaml
- http-route.yaml
configurations:
- kustomizeconfig.yaml
secretGenerator:
- name: authentik-secret
  files:
  - AUTHENTIK_SECRET_KEY=secrets/secret.key.encrypted
- name: authentik-bootstrap
  files:
  - AUTHENTIK_BOOTSTRAP_PASSWORD=secrets/akadmin.password.encrypted
  - AUTHENTIK_BOOTSTRAP_TOKEN=secrets/akadmin.token.encrypted
