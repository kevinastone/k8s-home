# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-sentinel-proxy
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: patrickdk/redis-sentinel-proxy
              tag: v1.2@sha256:41578e1df5b8150f30cb9fdcf5b80458cb5cd8b71591a7dbbbec605a454ceaf8
              pullPolicy: IfNotPresent
            env:
            - name: SENTINEL
              value: rfs-redis:26379
            ports:
            - containerPort: 9999
              name: redis
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: redis
              readiness: *probes
    service:
      main:
        controller: main
        ports:
          redis:
            primary: true
            protocol: TCP
            port: 6379
            targetPort: redis
