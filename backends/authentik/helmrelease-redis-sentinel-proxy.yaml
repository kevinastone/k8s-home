---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-sentinel-proxy
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: patrickdk/redis-sentinel-proxy
              tag: v1.2@sha256:02ee365b50f7de1fc19c94ca994fb84fdce5cac27733cd14a7f907d691690c85
              pullPolicy: IfNotPresent
            env:
              - name: SENTINEL
                value: rfs-redis:26379
            ports:
              - containerPort: 9999
                name: redis
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: redis
              readiness: *probes
    service:
      main:
        controller: main
        ports:
          redis:
            primary: true
            protocol: TCP
            port: 6379
            targetPort: redis
