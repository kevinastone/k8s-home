# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authelia
resources:
- namespace.yaml
- postgres
- dragonfly
- helmrelease.yaml
- http-route.yaml
- reference-grant.yaml
- authelia-secret.yaml
- ldap-secret.yaml
- client-secret-generator.yaml
- rustfs-client-secret.yaml
- grafana-client-secret.yaml
components:
- ../../components/kustomizeconfig
configMapGenerator:
- name: authelia-config
  files:
  - resources/configuration.yaml
- name: authelia-dashboard
  options:
    labels:
      grafana_dashboard: "true"
  files:
  - dashboards/authelia.json
