# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        strategy: RollingUpdate
        replicas: 2
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/authelia/authelia
              tag: 4.39.27@sha256:ea6ddce051110a0459b9393117a86383771269aac72f89cabe07f3e9e07f892d
            envFrom:
            - secretRef:
                name: rustfs-client-secret
            - secretRef:
                name: grafana-client-secret
            - prefix: postgres_
              secretRef:
                name: postgres-app
            env:
              AUTHELIA_SERVER_ADDRESS: tcp://0.0.0.0:8000
              AUTHELIA_SERVER_DISABLE_HEALTHCHECK: "true"

              AUTHELIA_TELEMETRY_METRICS_ADDRESS: tcp://0.0.0.0:8080
              AUTHELIA_TELEMETRY_METRICS_ENABLED: "true"

              AUTHELIA_SESSION_SECRET_FILE: /secrets/session.token
              AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage-encryption.key
              AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE: /ldap/ldap-user.password

              AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt.token
              AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /secrets/oidc_hmac.secret
              AUTHELIA_IDENTITY_PROVIDERS_OIDC_ISSUER_PRIVATE_KEY_FILE: /secrets/oidc_issuer.key

              X_AUTHELIA_CONFIG: /config/configuration.yaml
              X_AUTHELIA_CONFIG_FILTERS: expand-env
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 8000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        pod:
          enableServiceLinks: false
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 8000
          metrics:
            port: 8080
    serviceMonitor:
      main:
        serviceName: authelia
        endpoints:
        - port: metrics
          scheme: http
          path: /metrics
    persistence:
      config:
        type: configMap
        name: authelia-config # overriden by kustomizeconfig
        globalMounts:
        - path: /config/configuration.yaml
          subPath: configuration.yaml
          readOnly: true
      secrets:
        type: secret
        name: authelia-secret
        globalMounts:
        - path: /secrets
          readOnly: true
      ldap:
        type: secret
        name: ldap-secret
        globalMounts:
        - path: /ldap
          readOnly: true
