apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Servers
    gethomepage.dev/icon: /assets/icons/svg/authelia.svg
    gethomepage.dev/name: Authelia
spec:
  parentRefs:
  - name: public-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - auth.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: authelia
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
