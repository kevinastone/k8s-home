---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - auth.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: authelia
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
