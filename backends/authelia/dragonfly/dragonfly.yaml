apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  replicas: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  args:
  # Workaround for io_uring SQPOLL pinning an idle worker thread into iowait state on Core 0
  # Fixed in Linux kernel 6.15+: https://github.com/axboe/liburing/issues/943
  # Ref: https://github.com/dragonflydb/dragonfly/issues/2270#issuecomment-1845188470
  - --force_epoll
  - --s3_endpoint=rustfs.rustfs:9000
  - --s3_use_https=false
  env:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: dragonfly-s3-creds
        key: AWS_ACCESS_KEY_ID
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: dragonfly-s3-creds
        key: AWS_SECRET_ACCESS_KEY
  snapshot:
    cron: "*/5 * * * *"
    dir: "s3://dragonfly/authelia"
