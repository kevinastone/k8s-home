# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: envoy
resources:
- envoy-proxy.yaml
- http-route.yaml
- security-policy.yaml
components:
- ../../components/oidc-client
patches:
- target:
    group: external-secrets.io
    version: v1
    kind: ExternalSecret
    name: oidc-client-secret
  patch: |-
    - op: add
      path: /spec/target/template/data/client-secret
      value: "{{ .password }}"
- patch: |-
    apiVersion: infra.contrib.fluxcd.io/v1alpha2
    kind: Terraform
    metadata:
      name: oidc-client
    spec:
      vars:
      - name: client_id
        value: envoy-gateway
      - name: client_name
        value: Envoy Gateway
      - name: redirect_uris
        value:
        - https://envoy.k8s.kevinastone.com/oauth2/callback
      - name: web_origins
        value:
        - https://*.k8s.kevinastone.com
