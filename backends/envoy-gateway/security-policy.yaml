apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: auth-gateway-policy
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: auth-gateway
  cors:
    allowOrigins:
    - "https://*.k8s.kevinastone.com"
    allowCredentials: true
  extAuth:
    failOpen: false
    headersToExtAuth:
    - X-Forwarded-Proto
    - accept
    - cookie
    http:
      backendRefs:
      - group: ""
        kind: Service
        name: authelia
        namespace: authelia
        port: 80
      path: /api/authz/ext-authz/
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: public-gateway-policy
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: public-gateway
  cors:
    allowOrigins:
    - "https://*.k8s.kevinastone.com"
    allowCredentials: true
---
# Overwrite the gateway policy for https-redirect routes
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: redirect-policy
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: https-redirect
