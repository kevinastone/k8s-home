apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: auth-gateway-policy
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: auth-gateway
  cors:
    allowOrigins:
    - "https://*.k8s.kevinastone.com"
    allowCredentials: true
  oidc:
    provider:
      issuer: https://sso.k8s.kevinastone.com/realms/homelab
    clientID: envoy-gateway
    clientSecret:
      name: oidc-client-secret
    redirectURL: https://envoy.k8s.kevinastone.com/oauth2/callback
    cookieDomain: k8s.kevinastone.com
    cookieNames:
      suffix: auth
      idToken: IdToken
    codeVerifierTTL: 2m
    csrfTokenTTL: 2m
    defaultRefreshTokenTTL: 8760h
    denyRedirect:
      headers:
      - name: sec-fetch-mode
        type: Exact
        value: cors
      - name: sec-fetch-dest
        type: Exact
        value: empty
      - name: x-requested-with
        type: Exact
        value: XMLHttpRequest
    disableTokenEncryption: true
    scopes:
    - openid
    - profile
    - email
    - groups
    - offline_access
  jwt:
    providers:
    - name: keycloak
      issuer: https://sso.k8s.kevinastone.com/realms/homelab
      audiences:
      - envoy-gateway
      remoteJWKS:
        uri: https://sso.k8s.kevinastone.com/realms/homelab/protocol/openid-connect/certs
      extractFrom:
        cookies:
        - IdToken
      claimToHeaders:
      - claim: preferred_username
        header: Remote-User
      - claim: email
        header: Remote-Email
      - claim: name
        header: Remote-Name
  authorization:
    defaultAction: Deny
    rules:
    - name: allow-admin
      action: Allow
      principal:
        jwt:
          provider: keycloak
          claims:
          - name: groups
            valueType: StringArray
            values:
            - admin
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: public-gateway-policy
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: public-gateway
  cors:
    allowOrigins:
    - "https://*.k8s.kevinastone.com"
    allowCredentials: true
---
# Overwrite the gateway policy for https-redirect routes
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: redirect-policy
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: https-redirect
