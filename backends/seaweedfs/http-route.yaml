---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - seaweedfs.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: seaweedfs-s3
          port: 8333
      matches:
        - path:
            type: PathPrefix
            value: /
