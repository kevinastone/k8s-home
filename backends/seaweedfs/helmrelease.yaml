---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: influxdb
spec:
  interval: 5m
  chart:
    spec:
      chart: seaweedfs
      version: 3.63.0
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
      interval: 5m
  values:
    global:
      monitoring:
        enabled: true
    master:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 10Gi
      logs:
        type: emptyDir
    volume:
      dataDirs:
      - name: data
        type: none
        storageClass: storage-nas
        size: 250Gi              
    filer:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 10Gi
      logs:
        type: emptyDir
      s3:
        enabled: true
    s3:
      enabled: true
