---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: seaweedfs
spec:
  interval: 5m
  chart:
    spec:
      chart: seaweedfs
      version: 4.0.376
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
      interval: 5m
  values:
    global:
      monitoring:
        enabled: true
    master:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 10Gi
      logs:
        type: emptyDir
    volume:
      dataDirs:
      - name: data
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 100Gi
        maxVolumes: 0
    filer:
      data:
        type: emptyDir
        # type: persistentVolumeClaim
        # storageClass: longhorn
        # size: 10Gi
      logs:
        type: emptyDir
      s3:
        enabled: true
        # You may specify buckets to be created during the install process.
        # Buckets may be exposed publicly by setting `anonymousRead` to `true`
        createBuckets:
          - name: longhorn
            anonymousRead: true
          - name: postgres
            anonymousRead: true

    s3:
      enabled: true
