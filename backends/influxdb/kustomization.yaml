---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: influxdb
resources:
  - namespace.yaml
  - helmrelease.yaml
  - helmrelease-chronograf.yaml
  - influxdb-gateway.yaml
  - http-route.yaml
  - http-route-chronograf.yaml
  - grafana-datasources.yaml
  - alerts.yaml
configMapGenerator:
  - name: influxdb-dashboards
    options:
      labels:
        grafana_dashboard: "true"
    files:
      - dashboards/system-health.json
      - dashboards/influxdb-cluster-overview.json
      - dashboards/influxdb-instance-overview.json
      - dashboards/influxdb-logs.json
