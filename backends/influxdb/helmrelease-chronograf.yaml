---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: chronograf
spec:
  interval: 5m
  chart:
    spec:
      chart: chronograf
      version: 1.2.6
      sourceRef:
        kind: HelmRepository
        name: influxdata
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
  values:
    persistence:
      enabled: true
    resources:
      requests:
        memory: 105Mi
        cpu: 15m
      limits:
        memory: 145Mi
        cpu: 32m
