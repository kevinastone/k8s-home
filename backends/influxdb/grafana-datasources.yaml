apiVersion: v1
kind: Secret
metadata:
  name: grafana-influxdb-datasources
  labels:
    grafana_datasource: 'true' # default value for: sidecar.datasources.label
stringData:
  influxdb.yaml: |-
    apiVersion: 1
    datasources:
      - name: Home Assistant
        type: influxdb
        database: home_assistant
        access: proxy
        uid: home_assistant
        url: http://influxdb.influxdb:8086
        editable: false
      - name: Telegraf
        type: influxdb
        database: telegraf
        access: proxy
        uid: telegraf
        url: http://influxdb.influxdb:8086
        editable: false
