---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: influxdb
spec:
  interval: 5m
  chart:
    spec:
      chart: influxdb
      version: 4.12.5
      sourceRef:
        kind: HelmRepository
        name: influxdata
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
  values:
    resources:
      requests:
        cpu: 1
        memory: 512Mi
      limits:
        cpu: 2
        memory: 1Gi
    persistence:
      size: 20Gi
    initScripts:
      enabled: true
      scripts:
        creat_telegraf_db.iql: |+
          CREATE DATABASE "telegraf"
        creat_home_assistant_db.iql: |+
          CREATE DATABASE "home_assistant"
