---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: influxdb
spec:
  parentRefs:
    - name: influxdb-gateway
      namespace: influxdb
      sectionName: http
  hostnames:
    - influxdb.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: influxdb
          port: 8086
      matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              kind: Service
              name: vmsingle-vm-stack
              namespace: victoria-metrics
              port: 8428
