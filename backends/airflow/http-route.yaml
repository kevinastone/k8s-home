apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: airflow
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Servers
    gethomepage.dev/icon: /icons/svg/apache-airflow.svg
    gethomepage.dev/name: Apache Airflow
    gethomepage.dev/pod-selector: "component=api-server,release=airflow"
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - airflow.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: airflow-api-server
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
