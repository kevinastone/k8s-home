# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: one-password
  target:
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        fitbit_user_id: "{{ .username }}"
        fitbit_api_bearer_token: "{{ .credential }}"
  dataFrom:
  - extract:
      key: "Fitbit API"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-ssh-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: one-password
  target:
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        gitSshKey: '{{ index . "airflow-git-sync-key" }}'
  dataFrom:
  - extract:
      key: "Airflow Pipelines SSH"
