---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
spec:
  interval: 5m
  chart:
    spec:
      chart: airflow
      version: 1.18.0
      sourceRef:
        kind: HelmRepository
        name: airflow
        namespace: flux-system
      interval: 5m
  driftDetection:
    mode: enabled
  values:
    useStandardNaming: true

    securityContexts:
      pod:
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"

    airflowPodAnnotations:
      reloader.stakater.com/auto: "true"

    executor: KubernetesExecutor

    env:
      - name: AIRFLOW__CORE__HIDE_SENSITIVE_VAR_CONN_FIELDS
        value: "False"
      - name: AIRFLOW__CORE__SQL_ALCHEMY_CONN
        value: "$(postgres_uri)"
      - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
        value: "$(postgres_uri)"
      - name: AIRFLOW_CONN_AIRFLOW_DB
        value: "$(postgres_uri)"

    enableBuiltInSecretEnvVars:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: false
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: false
      AIRFLOW_CONN_AIRFLOW_DB: false

    extraEnvFrom: |
      - prefix: postgres_
        secretRef:
          name: 'postgres-app'

    kerberos:
      enabled: false

    scheduler:
      enabled: true

    # Needed for FluxCD
    createUserJob:
      useHelmHooks: false
    migrateDatabaseJob:
      useHelmHooks: false

    triggerer:
      enabled: true
      persistence:
        enabled: false

    flower:
      enabled: false

    statsd:
      enabled: true

    # pgbouncer:
    #   enabled: true

    redis:
      enabled: false

    elasticsearch:
      enabled: false

    cleanup:
      enabled: false

    webserver:
      enabled: false
      defaultUser:
        enabled: false

    apiServer:
      waitForMigrations:
        # Whether to create init container to wait for db migrations
        enabled: false

    postgresql:
      enabled: false

    config:
      core:
        auth_manager: "airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager"
        simple_auth_manager_all_admins: "True"
      logging:
        colored_console_log: "True"

    dags:
      persistence:
        enabled: false

      # gitSync:
      #   enabled: true
      #   repo: git@github.com:kevinastone/airflow-pipelines.git
      #   branch: "main"
      #   ref: "main"
      #   subPath: ""
      #   sshKeySecret: repo-ssh-secret
