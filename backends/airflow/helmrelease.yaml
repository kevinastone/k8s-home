---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
spec:
  interval: 5m
  chart:
    spec:
      chart: airflow
      version: 1.18.0
      sourceRef:
        kind: HelmRepository
        name: airflow
        namespace: flux-system
      interval: 5m
  driftDetection:
    mode: enabled
  values:
    useStandardNaming: true

    securityContexts:
      pod:
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"

    airflowPodAnnotations:
      reloader.stakater.com/auto: "true"

    executor: KubernetesExecutor

    env:
      - name: AIRFLOW__CORE__LOAD_EXAMPLES
        value: "True"
      - name: AIRFLOW__CORE__HIDE_SENSITIVE_VAR_CONN_FIELDS
        value: "False"
      - name: AIRFLOW__WEBSERVER__DEFAULT_WRAP
        value: "True"
      - name: AIRFLOW__WEBSERVER__EXPOSE_CONFIG
        value: "True"

    kerberos:
      enabled: false

    scheduler:
      enabled: true

    # Needed for FluxCD
    createUserJob:
      useHelmHooks: false
      applyCustomEnv: false
    migrateDatabaseJob:
      useHelmHooks: false
      applyCustomEnv: false

    webserver:
      enabled: true
      defaultUser:
        enabled: false
      webserverConfig: |
        AUTH_ROLE_PUBLIC = 'Admin'

    triggerer:
      enabled: true
      persistence:
        enabled: false

    dagProcessor:
      enabled: false

    flower:
      enabled: false

    statsd:
      enabled: true

    # pgbouncer:
    #   enabled: true

    redis:
      enabled: false

    elasticsearch:
      enabled: false

    cleanup:
      enabled: false

    postgresql:
      # Temp until we spin up our own postgres cluster
      enabled: true

    config:
      logging:
        colored_console_log: "True"

    dags:
      persistence:
        enabled: false

      # gitSync:
      #   enabled: true
      #   repo: git@github.com:kevinastone/airflow-pipelines.git
      #   branch: "main"
      #   ref: "main"
      #   subPath: ""
      #   sshKeySecret: repo-ssh-secret
