# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
spec:
  interval: 5m
  chart:
    spec:
      chart: airflow
      version: 1.22.0
      sourceRef:
        kind: HelmRepository
        name: airflow
        namespace: flux-system
      interval: 5m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    useStandardNaming: true

    securityContexts:
      pod:
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"

    airflowPodAnnotations:
      reloader.stakater.com/auto: "true"

    # executor: KubernetesExecutor
    executor: LocalExecutor

    env:
    - name: AIRFLOW__CORE__HIDE_SENSITIVE_VAR_CONN_FIELDS
      value: "False"
    - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
      # value: "$(postgres_uri)"
      value: "postgresql://$(postgres_user):$(postgres_password)@pooler.airflow/$(postgres_dbname)"

    enableBuiltInSecretEnvVars:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: false
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: false
      AIRFLOW_CONN_AIRFLOW_DB: false

    extraEnvFrom: |
      - prefix: postgres_
        secretRef:
          name: 'postgres-app'

    kerberos:
      enabled: false

    scheduler:
      enabled: true

    # Needed for FluxCD
    createUserJob:
      useHelmHooks: false
    migrateDatabaseJob:
      useHelmHooks: false

    triggerer:
      enabled: true
      persistence:
        enabled: false

    flower:
      enabled: false

    statsd:
      enabled: true

    pgbouncer:
      # We run pgbouncer via cnpg
      enabled: false

    redis:
      enabled: false

    elasticsearch:
      enabled: false

    cleanup:
      enabled: false

    webserver:
      enabled: false
      defaultUser:
        enabled: false

    postgresql:
      enabled: false

    config:
      core:
        auth_manager: "airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager"
        simple_auth_manager_all_admins: "True"
      logging:
        colored_console_log: "True"

    images:
      airflow:
        repository: ghcr.io/kevinastone/airflow-pipelines
        tag: main
        digest: sha256:234fc1b5da5cf6b1b3f708254313de503a456fe90b164212ceabb50f6278483d
        # Specifying digest takes precedence over tag.
      # To avoid images with user code, you can turn this to 'true' and
      # all the 'run-airflow-migrations' and 'wait-for-airflow-migrations' containers/jobs
      # will use the images from 'defaultAirflowRepository:defaultAirflowTag' values
      # to run and wait for DB migrations .
      useDefaultImageForMigration: false
