# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: airflow
spec:
  endpoints:
  - path: /metrics
    port: statsd-scrape
    scheme: http
  jobLabel: airflow
  namespaceSelector:
    matchNames:
    - airflow
  selector:
    matchLabels:
      component: statsd
      release: airflow
