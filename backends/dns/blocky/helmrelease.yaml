# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        replicas: 2
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/0xerr0r/blocky
              tag: v0.26@sha256:b259ada3f943e73283f1fc5e84ac39a791afec7de86515d1aeccc03d2c39e595
              pullPolicy: IfNotPresent
            env:
            - name: TZ
              value: UTC
            ports:
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 4000
              name: http
            probes:
              liveness:
                custom: true
                spec:
                  exec:
                    command:
                    - /app/blocky
                    - healthcheck
              readiness:
                custom: true
                spec:
                  exec:
                    command:
                    - /app/blocky
                    - healthcheck
              startup:
                custom: true
                spec:
                  exec:
                    command:
                    - /app/blocky
                    - healthcheck

    service:
      main:
        controller: main
        type: LoadBalancer
        externalTrafficPolicy: Local
        labels:
          ip-pool: static
        annotations:
          lbipam.cilium.io/ips: 192.168.120.53
        ports:
          http:
            port: 80
            targetPort: http
          dns-udp:
            port: 53
            protocol: UDP
            targetPort: dns-udp
          dns-tcp:
            port: 53
            protocol: TCP
            targetPort: dns-tcp

    serviceMonitor:
      main:
        serviceName: blocky
        endpoints:
        - port: http
          scheme: http
          path: /metrics

    persistence:
      config:
        enabled: true
        type: configMap
        name: blocky-config # overriden by kustomizeconfig
        globalMounts:
        - path: /app/config.yml
          subPath: config.yml
      lists:
        type: configMap
        name: blocky-lists # overriden by kustomizeconfig
        globalMounts:
        - readOnly: true
