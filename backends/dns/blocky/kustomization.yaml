# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- dragonfly
- helmrelease.yaml
configMapGenerator:
- name: blocky-config
  files:
  - resources/config.yml
- name: blocky-dashboard
  options:
    labels:
      grafana_dashboard: 'true'
  files:
  - dashboards/blocky.json
- name: blocky-lists
  files:
  - lists/whitelist.txt
  - lists/custom.txt
configurations:
- kustomizeconfig.yaml
