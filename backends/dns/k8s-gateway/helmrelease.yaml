# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: k8s-gateway
spec:
  interval: 12h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://ghcr.io/k8s-gateway/charts/k8s-gateway
  ref:
    tag: 3.7.2
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: exdns
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  values:
    watchedResources:
    - HTTPRoute
    - TLSRoute
    - GRPCRoute
    - Ingress
    - Service

    domain: k8s.kevinastone.com

    replicaCount: 2

    service:
      type: LoadBalancer
      labels:
        ip-pool: static
      annotations:
        io.cilium/lb-ipam-ips: 192.168.120.54
        metallb.universe.tf/loadBalancerIPs: 192.168.120.54
