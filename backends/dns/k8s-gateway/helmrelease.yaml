# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: exdns
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/k8s-gateway/charts/k8s-gateway
      ref:
        tag: 3.7.2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    watchedResources:
    - HTTPRoute
    - TLSRoute
    - GRPCRoute
    - Ingress
    - Service

    domain: k8s.kevinastone.com

    replicaCount: 2

    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: k8s-gateway
          app.kubernetes.io/instance: exdns

    service:
      type: LoadBalancer
      labels:
        ip-pool: static
      annotations:
        lbipam.cilium.io/ips: 192.168.120.54
        io.cilium/lb-ipam-ips: 192.168.120.54
        metallb.universe.tf/loadBalancerIPs: 192.168.120.54
