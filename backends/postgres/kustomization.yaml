# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postgres
resources:
- kubernetes-store.yaml
components:
- ../../components/rustfs-bucket
patches:
- target:
    group: external-secrets.io
    version: v1
    kind: ExternalSecret
    name: s3-creds
  patch: |-
    - op: replace
      path: /spec/target/template/data/AWS_ACCESS_KEY_ID
      value: postgres
- target:
    group: infra.contrib.fluxcd.io
    version: v1alpha2
    kind: Terraform
    name: rustfs-bucket
  patch: |-
    - op: replace
      path: /spec/path
      value: ./backends/rustfs/tofu/import-postgres
