---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: cloudnative-pg-dashboards
spec:
  interval: 30m
  chart:
    spec:
      chart: cluster
      version: 0.0.3
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg-dashboards
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    grafanaDashboard:
      sidecarLabelValue: "true"
