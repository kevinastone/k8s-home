name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Magic Nix Cache (Faster Builds)
      uses: DeterminateSystems/magic-nix-cache-action@v15
    - name: Run All Flake Checks
      run: nix flake check -L

  validate:
    name: Flux Manifest Validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: home-operations/flate/action@v0.6.5
    - name: Run flate test
      run: flate test all

  diff:
    name: Flux Rendered Diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: home-operations/flate/action@v0.6.5
    - name: Generate rendered diff
      run: |
        flate diff --base origin/main -o github >> $GITHUB_STEP_SUMMARY

  fix-format:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && failure()
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref }}
        token: ${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Magic Nix Cache (Faster Builds)
      uses: DeterminateSystems/magic-nix-cache-action@v15
    - name: Auto-format
      run: |
        nix fmt
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "style: auto-format manifests" || echo "No changes to commit"
        git push
