# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: watcher
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/kevinastone/argus
              tag: main@sha256:cf7d7606f2bdb95c1af62c2489229b2c5bedc7db36bf70c112f674808082ff83
            env:
              RUST_LOG: debug
              # Need to escape the braces for helm
              ARGUS_WEBHOOK_TEMPLATE: |-
                {
                  "path": "Transcode/{{ "{{" }} path {{ "}}" }}",
                  "output_path": "Output/{{ "{{" }} path {{ "}}" }}"
                }
            args:
            - "--pattern"
            - "**/*.{mp4,mkv,avi,wmv,mov,mpg,m4v,f4v}"
            - "/media/Transcode"
            - "http://transcoder-webhook-eventsource-svc:12000/webhook"
    persistence:
      media:
        type: persistentVolumeClaim
        existingClaim: media-incoming
        globalMounts:
        - path: /media
