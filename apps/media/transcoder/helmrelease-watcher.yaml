# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: watcher
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/kevinastone/argus
              tag: main@sha256:a37ef833a7e11e72f498355f1b80a8d6f18e6534ddc4e2341dbe659e91a94655
            env:
              RUST_LOG: debug
            args:
            - "--pattern"
            - "**/*.{mp4,mkv,avi,wmv,mov,mpg,m4v,f4v}"
            - "/media/Transcode"
            - "http://transcoder-webhook-eventsource-svc:12000/webhook"
    persistence:
      media:
        type: persistentVolumeClaim
        existingClaim: media-incoming
        globalMounts:
        - path: /media
