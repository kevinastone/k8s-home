# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: httpbox
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/kevinastone/argus
              tag: main
            env:
              RUST_LOG: debug
            args:
            - "--pattern **/*.{mp4,mkv,avi,wmv,mov,mpg,m4v,f4v}"
            - "/media"
            - "http://transcoder-webhook-eventsource-svc:12000/webhook"
    persistence:
      media:
        type: persistentVolumeClaim
        existingClaim: media-incoming
        globalMounts:
        - path: /media
