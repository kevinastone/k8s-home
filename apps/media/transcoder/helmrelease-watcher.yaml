# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: watcher
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/kevinastone/lynceus
              tag: v0.5.0@sha256:6b047e57aafeea8998022954576166c815366677a88dd646d431f7c6052db146
            env:
              RUST_LOG: info,lynceus=debug
              # Need to escape the braces for helm
              LYNCEUS_WEBHOOK_TEMPLATE: |-
                {
                  "path": "Transcode/{{ "{{" }} path {{ "}}" }}",
                  "output_path": "Output/{{ "{{" }} path {{ "}}" }}"
                }
            args:
            - "--pattern"
            - "**/*.{mp4,mkv,avi,wmv,mov,mpg,m4v,f4v,m2ts}"
            - "/media/Transcode"
            - "http://transcoder-webhook-eventsource-svc:12000/webhook"
    persistence:
      media:
        type: persistentVolumeClaim
        existingClaim: media-incoming
        globalMounts:
        - path: /media
