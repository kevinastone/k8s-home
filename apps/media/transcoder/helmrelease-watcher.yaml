# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: watcher
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/kevinastone/lynceus
              tag: v0.5.3@sha256:043704f80345a6184b62de1b4261392b45bfd5c29dba50a5ace9a9942376aaba
            env:
              RUST_LOG: info,lynceus=debug
              # Need to escape the braces for helm
              LYNCEUS_WEBHOOK_TEMPLATE: |-
                {
                  "path": "Transcode/{{ "{{" }} path {{ "}}" }}",
                  "output_path": "Output/{{ "{{" }} path {{ "}}" }}"
                }
            args:
            - "--pattern"
            - "**/*.{mp4,mkv,avi,wmv,mov,mpg,mpeg,m4v,f4v,flv,m2ts}"
            - "/media/Transcode"
            - "http://transcoder-webhook-eventsource-svc:12000/webhook"
    persistence:
      media:
        type: persistentVolumeClaim
        existingClaim: media-incoming
        globalMounts:
        - path: /media
