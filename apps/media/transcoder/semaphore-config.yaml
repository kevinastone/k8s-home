# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: transcoder-semaphore
  namespace: media
data:
  # Maximum number of concurrent transcoding workflows allowed cluster-wide.
  # Set this to (2 × number_of_nodes) to allow ≤2 per host.
  # Note: This value is static. The per-node limit is dynamically enforced
  # by the device/vaapi extended resource — if a node joins or leaves,
  # the scheduler adjusts automatically. This semaphore just caps the
  # total cluster-wide queue to prevent unbounded workflow creation.
  max-concurrent: "6"
