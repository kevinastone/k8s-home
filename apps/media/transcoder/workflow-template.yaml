apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: transcoder-workflow
  namespace: media
spec:
  serviceAccountName: transcoder-sa
  entrypoint: transcode-media
  # Retry strategy handles transient failures, ensuring jobs aren't lost
  retryStrategy:
    limit: "3"
    retryPolicy: "Always"
    backoff:
      duration: "1m"
      factor: "2"
      maxDuration: "10m"

  templates:
  - name: transcode-media
    inputs:
      parameters:
      - name: filepath
      - name: output_filepath
        default: ""

    outputs:
      parameters:
      - name: transcoded_filepath
        valueFrom:
          path: /tmp/transcoded_filepath.txt

    # Pod anti-affinity to spread Argo jobs across hosts
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: workflows.argoproj.io/workflow
                operator: Exists
            topologyKey: kubernetes.io/hostname

    container:
      image: lscr.io/linuxserver/ffmpeg:version-8.1-cli
      command:
      - /bin/bash
      - -c
      - |
        set -o pipefail

        # The filepath parameter is passed dynamically from the MQTT payload
        FILEPATH="{{inputs.parameters.filepath}}"
        OUTPUT_FILEPATH="{{inputs.parameters.output_filepath}}"

        if [ -z "$FILEPATH" ]; then
          echo "Error: No filepath provided."
          exit 1
        fi

        echo "Received transcoding request for: $FILEPATH"
        INPUT_FILE="/media/$FILEPATH"

        if [ ! -f "$INPUT_FILE" ]; then
          echo "Error: File $INPUT_FILE not found on PVC."
          exit 1
        fi

        if [ -z "$OUTPUT_FILEPATH" ]; then
          OUTPUT_FILE="$INPUT_FILE"
        else
          OUTPUT_FILE="/media/$OUTPUT_FILEPATH"
        fi
        TEMP_OUTPUT_FILE="/temp/$(basename "$OUTPUT_FILE")"

        # Pick the highest render device available (e.g., renderD129 over renderD128)
        # This commonly bypasses ASPEED BMC display adapters in homelab servers.
        RENDER_DEVICE=$(ls /dev/dri/renderD* 2>/dev/null | sort -r | head -n 1)
        if [ -z "$RENDER_DEVICE" ]; then
          RENDER_DEVICE="/dev/dri/renderD128"
        fi

        TOTAL_FRAMES=$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=nokey=1:noprint_wrappers=1 "$INPUT_FILE" 2>/dev/null)
        if [ -z "$TOTAL_FRAMES" ] || [ "$TOTAL_FRAMES" == "N/A" ]; then
          TOTAL_FRAMES=0
        fi

        echo "Selected render device: $RENDER_DEVICE"
        echo "Total frames: $TOTAL_FRAMES"

        echo "Starting ffmpeg transcode: $INPUT_FILE -> $TEMP_OUTPUT_FILE (temp)"
        ffmpeg -hide_banner -y \
          -hwaccel vaapi \
          -hwaccel_device "$RENDER_DEVICE" \
          -hwaccel_output_format vaapi \
          -i "$INPUT_FILE" \
          -c:v hevc_vaapi \
          -q:v 24 \
          -c:a copy \
          -progress /dev/stdout \
          -nostats \
          "$TEMP_OUTPUT_FILE" 2>&1 | while read -r line; do
            echo "$line"
            if [[ "$line" == frame=* ]]; then
              FRAME="${line#frame=}"
              FRAME="${FRAME// /}"
              if [ -n "$ARGO_PROGRESS_FILE" ] && [ "$TOTAL_FRAMES" -gt 0 ]; then
                echo "$FRAME/$TOTAL_FRAMES" > "$ARGO_PROGRESS_FILE"
              fi
            fi
          done

        if [ $? -eq 0 ]; then
          echo "Transcode completed successfully! Moving file to destination..."
          mv "$TEMP_OUTPUT_FILE" "$OUTPUT_FILE"
          echo "$OUTPUT_FILE" > /tmp/transcoded_filepath.txt
        else
          echo "Transcode failed."
          exit 1
        fi

      resources:
        requests:
          cpu: 1000m
          memory: 512Mi
        limits:
          cpu: 4000m
          memory: 4Gi
          device/vaapi: 1
      volumeMounts:
      - name: media
        mountPath: /media
      - name: temp
        mountPath: /temp

  volumes:
  - name: media
    persistentVolumeClaim:
      claimName: media-incoming-pvc
  - name: temp
    emptyDir: {}
