apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: transcoder-workflow
  namespace: media
spec:
  serviceAccountName: transcoder-sa
  entrypoint: transcode-media
  # Retry strategy handles transient failures, ensuring jobs aren't lost
  retryStrategy:
    limit: "3"
    retryPolicy: "Always"
    backoff:
      duration: "1m"
      factor: "2"
      maxDuration: "10m"

  templates:
  - name: transcode-media
    inputs:
      parameters:
      - name: filepath
      - name: output_filepath
        default: ""
      - name: quality

    outputs:
      parameters:
      - name: transcoded_filepath
        valueFrom:
          path: /tmp/transcoded_filepath.txt

    # Pod anti-affinity to spread Argo jobs across hosts
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: workflows.argoproj.io/workflow
                operator: Exists
            topologyKey: kubernetes.io/hostname

    container:
      image: lscr.io/linuxserver/ffmpeg:version-8.1-cli
      command: [/scripts/transcode.sh]
      env:
      - name: FILEPATH
        value: "{{inputs.parameters.filepath}}"
      - name: OUTPUT_FILEPATH
        value: "{{inputs.parameters.output_filepath}}"
      - name: QUALITY
        value: "{{inputs.parameters.quality}}"
      resources:
        requests:
          cpu: 1000m
          memory: 512Mi
        limits:
          cpu: 4000m
          memory: 4Gi
          device/vaapi: 1
      volumeMounts:
      - name: media
        mountPath: /media
      - name: temp
        mountPath: /temp
      - name: scripts
        mountPath: /scripts

  volumes:
  - name: media
    persistentVolumeClaim:
      claimName: media-incoming-pvc
  - name: temp
    emptyDir: {}
  - name: scripts
    configMap:
      name: transcoder-scripts
      defaultMode: 0755
