# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/argoproj.io/workflowtemplate_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: transcoder-workflow
  namespace: media
spec:
  workflowMetadata:
    annotations:
      workflows.argoproj.io/title: 'Transcode: {{workflow.parameters.filepath}}'
      workflows.argoproj.io/description: 'Processing {{workflow.parameters.filepath}} to {{workflow.parameters.output_filepath}}'
  ttlStrategy:
    secondsAfterCompletion: 86400 # 24 hours

  arguments:
    parameters:
    - name: filepath
    - name: output_filepath
      value: ""
    - name: encoder
      value: "software"
      enum:
      - "hardware"
      - "software"
    - name: delete_original
      value: "false"
      enum:
      - "true"
      - "false"
    - name: force_transcode
      value: "false"
      enum:
      - "true"
      - "false"

  serviceAccountName: transcoder-sa
  activeDeadlineSeconds: 86400 # 24 hours — transcodes can queue and run for a long time
  entrypoint: transcode-media
  # Retry strategy handles transient failures, ensuring jobs aren't lost
  retryStrategy:
    limit: "3"
    retryPolicy: "Always"
    backoff:
      duration: "1m"
      factor: "2"
      maxDuration: "48h"

  volumes:
  - name: media
    persistentVolumeClaim:
      claimName: media-incoming
  - name: temp
    emptyDir: {}
  - name: scripts
    configMap:
      name: transcoder-scripts # replaced by kustomizeconfig
      defaultMode: 0755

  templates:
  # DAG orchestrator: probe first, then evaluate, then transcode if eligible, then optionally delete the original
  - name: transcode-media
    dag:
      tasks:
      - name: wait-for-file
        template: wait-for-file
      - name: probe-file
        template: probe-file
        depends: "wait-for-file.Succeeded"
      - name: evaluate-rules
        template: evaluate-rules
        depends: "probe-file.Succeeded"
        arguments:
          parameters:
          - name: media-info
            value: "{{tasks.probe-file.outputs.parameters.media-info}}"
      - name: transcode
        template: transcode
        depends: "evaluate-rules.Succeeded"
        when: "{{tasks.evaluate-rules.outputs.parameters.should_transcode}} == true"
        arguments:
          parameters:
          - name: transcode_params
            value: "{{tasks.evaluate-rules.outputs.parameters.transcode_params}}"
      - name: delete-original
        template: delete-original
        when: "{{workflow.parameters.delete_original}} == true"
        depends: "transcode.Succeeded"
        arguments:
          parameters:
          - name: input_filepath
            value: "{{workflow.parameters.filepath}}"
          - name: output_filepath
            value: "{{tasks.transcode.outputs.parameters.transcoded_filepath}}"

  # Transcode step: runs ffmpeg via the external script
  - name: transcode
    inputs:
      parameters:
      - name: filepath
        value: "{{workflow.parameters.filepath}}"
      - name: output_filepath
        value: "{{workflow.parameters.output_filepath}}"
      - name: transcode_params
      - name: encoder
        value: "{{workflow.parameters.encoder}}"

    outputs:
      parameters:
      - name: transcoded_filepath
        valueFrom:
          path: /tmp/transcoded_filepath.txt
          default: ""

    # Pod anti-affinity to spread Argo jobs across hosts
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: workflows.argoproj.io/workflow
                operator: Exists
            topologyKey: kubernetes.io/hostname

    container:
      image: lscr.io/linuxserver/ffmpeg:version-8.1-cli
      command: [/scripts/transcode.sh]
      env:
      - name: FILEPATH
        value: "{{inputs.parameters.filepath}}"
      - name: OUTPUT_FILEPATH
        value: "{{inputs.parameters.output_filepath}}"
      - name: TRANSCODE_PARAMS
        value: "{{inputs.parameters.transcode_params}}"
      - name: ENCODER
        value: "{{inputs.parameters.encoder}}"
      resources:
        requests:
          cpu: 1000m
          memory: 512Mi
        limits:
          cpu: 4000m
          memory: 4Gi
          device/vaapi: 1
      volumeMounts:
      - name: media
        mountPath: /media
      - name: temp
        mountPath: /temp
      - name: scripts
        mountPath: /scripts

  # Delete step: removes the original input file if it differs from the output
  - name: delete-original
    inputs:
      parameters:
      - name: input_filepath
      - name: output_filepath
    script:
      image: alpine:3
      command: [sh]
      source: |
        set -eu

        INPUT="/media/{{inputs.parameters.input_filepath}}"
        OUTPUT="/media/{{inputs.parameters.output_filepath}}"

        # Guard: must be a regular file, not a directory or symlink to one
        if [ ! -f "$INPUT" ]; then
          echo "Skipping: input path is not a regular file: $INPUT"; exit 0
        fi

        REAL_INPUT=$(realpath "$INPUT")
        REAL_OUTPUT=$(realpath "$OUTPUT" 2>/dev/null || echo "$OUTPUT")

        if [ "$REAL_INPUT" != "$REAL_OUTPUT" ]; then
          echo "Deleting original input file: $INPUT"
          DELETED=false
          for i in 1 2 3; do
            echo "Deletion attempt $i of 3..."
            rm -f "$INPUT"
            sync
            if [ ! -f "$INPUT" ]; then
              echo "Successfully verified original file deletion."
              DELETED=true
              break
            fi
            echo "Warning: File still detected after attempt $i. Retrying after delay..." >&2
            sleep 10
          done
          if [ "$DELETED" = "false" ]; then
            echo "Error: Failed to delete original file after 3 attempts." >&2
          fi
        else
          echo "Skipping deletion: output overwrote the original file."
        fi
      volumeMounts:
      - name: media
        mountPath: /media

  # Wait for file step: loops and ensures the file isn't changing size before continuing
  - name: wait-for-file
    inputs:
      parameters:
      - name: filepath
        value: "{{workflow.parameters.filepath}}"
    container:
      image: alpine:3
      command: [sh, -c]
      args:
      - |
        set -eu
        FILEPATH="{{inputs.parameters.filepath}}"
        if [ "${FILEPATH#/media/}" != "$FILEPATH" ]; then
          INPUT_FILE="$FILEPATH"
        else
          INPUT_FILE="/media/$FILEPATH"
        fi

        if [ ! -f "$INPUT_FILE" ]; then
          echo "Error: File $INPUT_FILE not found on PVC." >&2
          exit 1
        fi

        echo "Waiting for file to stabilize: $INPUT_FILE"
        prev_size=-1
        stable_count=0
        required_stable_checks=3
        check_interval=10

        while true; do
          # Force NFS/SMB attribute cache invalidation by attempting a touch
          touch -c "$INPUT_FILE" 2>/dev/null || true

          curr_size=$(stat -c %s "$INPUT_FILE" 2>/dev/null || stat -f %z "$INPUT_FILE" 2>/dev/null || wc -c < "$INPUT_FILE")
          if [ -z "$curr_size" ]; then
            echo "Error: Could not determine size of $INPUT_FILE" >&2
            exit 1
          fi

          if [ "$prev_size" -eq -1 ]; then
            echo "Initial size check: $curr_size bytes"
          else
            echo "Current size: $curr_size bytes (previous: $prev_size bytes)"
          fi

          if [ "$curr_size" -eq "$prev_size" ] && [ "$curr_size" -gt 0 ]; then
            stable_count=$((stable_count + 1))
            echo "Size has been stable for $stable_count consecutive check(s)."
            if [ "$stable_count" -ge "$required_stable_checks" ]; then
              echo "File size stabilized at $curr_size bytes."
              break
            fi
          else
            if [ "$prev_size" -ne -1 ] && [ "$curr_size" -ne "$prev_size" ]; then
              echo "Size changed. Resetting stability counter."
            fi
            stable_count=0
          fi

          prev_size=$curr_size
          sleep $check_interval
        done
      volumeMounts:
      - name: media
        mountPath: /media

  # Probe step: checks input codec and resolution to see if transcoding is needed
  - name: probe-file
    inputs:
      parameters:
      - name: filepath
        value: "{{workflow.parameters.filepath}}"
      - name: force_transcode
        value: "{{workflow.parameters.force_transcode}}"
    outputs:
      parameters:
      - name: media-info
        valueFrom:
          path: /tmp/media-info.json
    container:
      image: lscr.io/linuxserver/ffmpeg:version-8.1-cli
      command: [/bin/bash, -c]
      args:
      - |
        set -euo pipefail

        FILEPATH="{{inputs.parameters.filepath}}"
        if [[ "$FILEPATH" == /media/* ]]; then
          INPUT_FILE="$FILEPATH"
        else
          INPUT_FILE="/media/$FILEPATH"
        fi

        if [ ! -f "$INPUT_FILE" ]; then
          echo "Error: File $INPUT_FILE not found on PVC." >&2
          jq -n '{"streams": [], "format": {"size": "0"}}' > /tmp/media-info-raw.json
        else
          echo "Probing file: $INPUT_FILE"
          if ! /scripts/media-info.sh "$INPUT_FILE" > /tmp/media-info-raw.json; then
            echo "Warning: media-info.sh failed. Writing fallback JSON." >&2
            jq -n '{"streams": [], "format": {"size": "0"}}' > /tmp/media-info-raw.json
          fi
        fi

        # Merge force_transcode as a boolean into media-info for OPA engine
        jq --arg force "{{inputs.parameters.force_transcode}}" '. + {force_transcode: ($force == "true")}' /tmp/media-info-raw.json > /tmp/media-info.json
        cat /tmp/media-info.json
      volumeMounts:
      - name: media
        mountPath: /media
      - name: scripts
        mountPath: /scripts

  # Rule evaluation step: evaluates transcoding rules via Open Policy Agent (OPA) using Rego policy
  - name: evaluate-rules
    inputs:
      parameters:
      - name: media-info
    outputs:
      parameters:
      - name: should_transcode
        valueFrom:
          path: /tmp/should_transcode.txt
      - name: reason
        valueFrom:
          path: /tmp/reason.txt
          default: ""
      - name: transcode_params
        valueFrom:
          path: /tmp/transcode_params.json
          default: "{}"
    container:
      image: openpolicyagent/opa:1.16.2-debug
      command: [/bin/sh, -c]
      args:
      - |
        set -eu

        # Write media-info JSON parameter directly to input.json for OPA
        echo '{{inputs.parameters.media-info}}' > /tmp/input.json

        # Evaluate Rego policy and extract outputs from combined decision object
        /opa eval --format=raw --data=/scripts/policy.rego --data=/scripts/media-info.rego --input=/tmp/input.json "data.policy.should_transcode" > /tmp/should_transcode.txt
        /opa eval --format=raw --data=/scripts/policy.rego --data=/scripts/media-info.rego --input=/tmp/input.json "data.policy.reason" > /tmp/reason.txt
        /opa eval --format=raw --data=/scripts/policy.rego --data=/scripts/media-info.rego --input=/tmp/input.json "data.policy.transcode_params" > /tmp/transcode_params.json

        echo "OPA evaluation complete:"
        echo "  should_transcode: $(cat /tmp/should_transcode.txt)"
        # echo "  reason: $(cat /tmp/reason.txt)"
        echo "  transcode_params: $(cat /tmp/transcode_params.json)"
      volumeMounts:
      - name: scripts
        mountPath: /scripts
