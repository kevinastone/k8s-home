# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/argoproj.io/workflowtemplate_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: transcoder-workflow
  namespace: media
spec:
  workflowMetadata:
    annotations:
      workflows.argoproj.io/title: 'Transcode: {{workflow.parameters.filepath}}'
      workflows.argoproj.io/description: 'Processing {{workflow.parameters.filepath}} to {{workflow.parameters.output_filepath}}'
  ttlStrategy:
    secondsAfterCompletion: 86400 # 24 hours

  arguments:
    parameters:
    - name: filepath
    - name: output_filepath
      value: ""
    - name: quality
      value: "24"
    - name: delete_original
      value: "false"
      enum:
      - "true"
      - "false"

  serviceAccountName: transcoder-sa
  activeDeadlineSeconds: 86400 # 24 hours — transcodes can queue and run for a long time
  entrypoint: transcode-media
  # Retry strategy handles transient failures, ensuring jobs aren't lost
  retryStrategy:
    limit: "3"
    retryPolicy: "Always"
    backoff:
      duration: "1m"
      factor: "2"
      maxDuration: "48h"

  volumes:
  - name: media
    persistentVolumeClaim:
      claimName: media-incoming
  - name: temp
    emptyDir: {}
  - name: scripts
    configMap:
      name: transcoder-scripts # replaced by kustomizeconfig
      defaultMode: 0755

  templates:
  # DAG orchestrator: probe first, then transcode if eligible, then optionally delete the original
  - name: transcode-media
    dag:
      tasks:
      - name: probe-file
        template: probe-file
      - name: transcode
        template: transcode
        depends: "probe-file.Succeeded"
        when: "{{tasks.probe-file.outputs.parameters.should_transcode}} == true"
      - name: delete-original
        template: delete-original
        when: "{{workflow.parameters.delete_original}} == true"
        depends: "transcode.Succeeded"
        arguments:
          parameters:
          - name: input_filepath
            value: "{{workflow.parameters.filepath}}"
          - name: output_filepath
            value: "{{tasks.transcode.outputs.parameters.transcoded_filepath}}"

  # Transcode step: runs ffmpeg via the external script
  - name: transcode
    inputs:
      parameters:
      - name: filepath
        value: "{{workflow.parameters.filepath}}"
      - name: output_filepath
        value: "{{workflow.parameters.output_filepath}}"
      - name: quality
        value: "{{workflow.parameters.quality}}"

    outputs:
      parameters:
      - name: transcoded_filepath
        valueFrom:
          path: /tmp/transcoded_filepath.txt
          default: ""

    # Pod anti-affinity to spread Argo jobs across hosts
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: workflows.argoproj.io/workflow
                operator: Exists
            topologyKey: kubernetes.io/hostname

    container:
      image: lscr.io/linuxserver/ffmpeg:version-8.1-cli
      command: [/scripts/transcode.sh]
      env:
      - name: FILEPATH
        value: "{{inputs.parameters.filepath}}"
      - name: OUTPUT_FILEPATH
        value: "{{inputs.parameters.output_filepath}}"
      - name: QUALITY
        value: "{{inputs.parameters.quality}}"
      resources:
        requests:
          cpu: 1000m
          memory: 512Mi
        limits:
          cpu: 4000m
          memory: 4Gi
          device/vaapi: 1
      volumeMounts:
      - name: media
        mountPath: /media
      - name: temp
        mountPath: /temp
      - name: scripts
        mountPath: /scripts

  # Delete step: removes the original input file if it differs from the output
  - name: delete-original
    inputs:
      parameters:
      - name: input_filepath
      - name: output_filepath
    script:
      image: alpine:3
      command: [sh]
      source: |
        set -eu

        INPUT="/media/{{inputs.parameters.input_filepath}}"
        OUTPUT="/media/{{inputs.parameters.output_filepath}}"

        # Guard: must be a regular file, not a directory or symlink to one
        if [ ! -f "$INPUT" ]; then
          echo "Skipping: input path is not a regular file: $INPUT"; exit 0
        fi

        REAL_INPUT=$(realpath "$INPUT")
        REAL_OUTPUT=$(realpath "$OUTPUT" 2>/dev/null || echo "$OUTPUT")

        if [ "$REAL_INPUT" != "$REAL_OUTPUT" ]; then
          echo "Deleting original input file: $INPUT"
          rm -f "$INPUT"
        else
          echo "Skipping deletion: output overwrote the original file."
        fi
      volumeMounts:
      - name: media
        mountPath: /media

  # Probe step: checks input codec and resolution to see if transcoding is needed
  - name: probe-file
    inputs:
      parameters:
      - name: filepath
        value: "{{workflow.parameters.filepath}}"
    outputs:
      parameters:
      - name: should_transcode
        valueFrom:
          path: /tmp/should_transcode.txt
      - name: reason
        valueFrom:
          path: /tmp/reason.txt
          default: ""
    container:
      image: lscr.io/linuxserver/ffmpeg:version-8.1-cli
      command: [/bin/bash, -c]
      args:
      - |
        set -euo pipefail

        FILEPATH="{{inputs.parameters.filepath}}"
        if [[ "$FILEPATH" == /media/* ]]; then
          INPUT_FILE="$FILEPATH"
        else
          INPUT_FILE="/media/$FILEPATH"
        fi

        if [ ! -f "$INPUT_FILE" ]; then
          echo "Error: File $INPUT_FILE not found on PVC." >&2
          echo "false" > /tmp/should_transcode.txt
          echo "File not found on PVC: $INPUT_FILE" > /tmp/reason.txt
          exit 1
        fi

        echo "Probing file: $INPUT_FILE"
        INFO=$(/scripts/media-info.sh "$INPUT_FILE")
        echo "Media Info JSON: $INFO"

        CODEC=$(echo "$INFO" | jq -r '.codec // empty')
        WIDTH=$(echo "$INFO" | jq -r '.width // empty')
        HEIGHT=$(echo "$INFO" | jq -r '.height // empty')
        BPP=$(echo "$INFO" | jq -r '.bpp // empty')

        if [ -z "$CODEC" ] || [ "$CODEC" = "null" ]; then CODEC="unknown"; fi
        if [ -z "$WIDTH" ] || [ "$WIDTH" = "null" ]; then WIDTH=0; fi
        if [ -z "$HEIGHT" ] || [ "$HEIGHT" = "null" ]; then HEIGHT=0; fi
        if [ -z "$BPP" ] || [ "$BPP" = "null" ]; then BPP=0; fi

        echo "Detected codec: $CODEC, resolution: ${WIDTH}x${HEIGHT}, BPP: $BPP"

        CODEC_LOWER=$(echo "$CODEC" | tr '[:upper:]' '[:lower:]')
        IS_BPP_LOW=$(echo "$BPP" | jq -r '. < 0.05')

        REASON=""
        if [ "$CODEC_LOWER" != "h264" ]; then
          REASON="Codec is not H264 (detected: $CODEC)"
        elif [ "$HEIGHT" -lt 1080 ]; then
          REASON="Resolution is below 1080p (detected height: ${HEIGHT}px)"
        elif [ "$IS_BPP_LOW" = "true" ]; then
          REASON="BPP is too low (detected: $BPP, minimum: 0.05)"
        fi

        # Proceed if input codec is h264, resolution is 1080p or higher, and BPP is >= 0.05
        if [ "$CODEC_LOWER" = "h264" ] && [ "$HEIGHT" -ge 1080 ] && [ "$IS_BPP_LOW" != "true" ]; then
          echo "File is eligible for transcoding (H264, >= 1080p, BPP >= 0.05)."
          echo "true" > /tmp/should_transcode.txt
          echo "Eligible" > /tmp/reason.txt
        else
          echo "File is NOT eligible for transcoding: $REASON"
          echo "false" > /tmp/should_transcode.txt
          echo "$REASON" > /tmp/reason.txt
        fi
      volumeMounts:
      - name: media
        mountPath: /media
      - name: scripts
        mountPath: /scripts
