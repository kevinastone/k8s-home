# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/argoproj.io/workflowtemplate_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: transcoder-workflow
  namespace: media
spec:
  workflowMetadata:
    annotations:
      workflows.argoproj.io/title: 'Transcode: {{workflow.parameters.filepath}}'
      workflows.argoproj.io/description: 'Processing {{workflow.parameters.filepath}} to {{workflow.parameters.output_filepath}}'
  ttlStrategy:
    secondsAfterCompletion: 86400 # 24 hours

  arguments:
    parameters:
    - name: filepath
    - name: output_filepath
      value: ""
    - name: encoder
      value: "software"
      enum:
      - "hardware"
      - "software"
    - name: replace_original
      value: "false"
      enum:
      - "true"
      - "false"
    - name: force_transcode
      value: "false"
      enum:
      - "true"
      - "false"
    - name: target_codec
      value: "hevc"
      enum:
      - "hevc"
      - "av1"

  serviceAccountName: transcoder-sa
  activeDeadlineSeconds: 86400 # 24 hours — transcodes can queue and run for a long time
  entrypoint: transcode-media
  # Retry strategy handles transient failures, ensuring jobs aren't lost
  retryStrategy:
    limit: "3"
    retryPolicy: "Always"
    backoff:
      duration: "1m"
      factor: "2"
      maxDuration: "48h"

  volumes:
  - name: media
    persistentVolumeClaim:
      claimName: media-incoming
  - name: temp
    emptyDir: {}
  - name: scripts
    configMap:
      name: transcoder-scripts # replaced by kustomizeconfig
      defaultMode: 0755
  - name: policy
    configMap:
      name: transcoder-policy # replaced by kustomizeconfig

  templates:
  # DAG orchestrator: probe first, then evaluate, then transcode if eligible, then optionally delete the original
  - name: transcode-media
    dag:
      tasks:
      - name: probe-file
        template: probe-file
      - name: evaluate-rules
        template: evaluate-rules
        depends: "probe-file.Succeeded"
        arguments:
          parameters:
          - name: media-info
            value: "{{tasks.probe-file.outputs.parameters.media-info}}"
          - name: filepath
            value: "{{workflow.parameters.filepath}}"
          - name: output_filepath
            value: "{{workflow.parameters.output_filepath}}"
          - name: force_transcode
            value: "{{workflow.parameters.force_transcode}}"
          - name: encoder
            value: "{{workflow.parameters.encoder}}"
          - name: target_codec
            value: "{{workflow.parameters.target_codec}}"
      - name: transcode
        template: transcode
        depends: "evaluate-rules.Succeeded"
        when: "{{tasks.evaluate-rules.outputs.parameters.should_transcode}} == true"
        arguments:
          parameters:
          - name: transcode_params
            value: "{{tasks.evaluate-rules.outputs.parameters.transcode_params}}"
          - name: output_filepath
            value: "{{tasks.evaluate-rules.outputs.parameters.output_filepath}}"
      - name: move-file
        template: move-file
        depends: "evaluate-rules.Succeeded"
        when: "{{tasks.evaluate-rules.outputs.parameters.should_transcode}} == false"
        arguments:
          parameters:
          - name: input_filepath
            value: "{{workflow.parameters.filepath}}"
          - name: output_filepath
            value: "{{tasks.evaluate-rules.outputs.parameters.output_filepath}}"
          - name: replace_original
            value: "{{workflow.parameters.replace_original}}"
      - name: delete-original
        template: delete-original
        when: "{{workflow.parameters.replace_original}} == true"
        depends: "transcode.Succeeded"
        arguments:
          parameters:
          - name: input_filepath
            value: "{{workflow.parameters.filepath}}"
          - name: output_filepath
            value: "{{tasks.transcode.outputs.parameters.transcoded_filepath}}"

  # Transcode step: runs ffmpeg via the external script
  - name: transcode
    inputs:
      parameters:
      - name: filepath
        value: "{{workflow.parameters.filepath}}"
      - name: output_filepath
      - name: transcode_params

    outputs:
      parameters:
      - name: transcoded_filepath
        valueFrom:
          path: /tmp/transcoded_filepath.txt
          default: ""

    # Inject topology spread constraints via podSpecPatch for schema compatibility
    podSpecPatch: |
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            workflows.argoproj.io/template-name: transcode

    container:
      image: ghcr.io/kevinastone/ffmpeg:9.0.2@sha256:9a09b42a2a36e211d2bc980ebcb9e646dc495a87a66aea64b54c8b2533d9606e
      command: [/scripts/transcode.sh]
      env:
      - name: FILEPATH
        value: "{{inputs.parameters.filepath}}"
      - name: OUTPUT_FILEPATH
        value: "{{inputs.parameters.output_filepath}}"
      - name: TRANSCODE_PARAMS
        value: "{{inputs.parameters.transcode_params}}"
      resources:
        requests:
          cpu: 4000m
          memory: 1Gi
        limits:
          cpu: 8000m
          memory: 4Gi
          device/vaapi: 1
      volumeMounts:
      - name: media
        mountPath: /media
      - name: temp
        mountPath: /tmp
      - name: scripts
        mountPath: /scripts

  # Delete step: removes the original input file if it differs from the output
  - name: delete-original
    inputs:
      parameters:
      - name: input_filepath
      - name: output_filepath
    container:
      image: alpine:3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      command: [/scripts/delete-original.sh]
      args:
      - "{{inputs.parameters.input_filepath}}"
      - "{{inputs.parameters.output_filepath}}"
      volumeMounts:
      - name: media
        mountPath: /media
      - name: scripts
        mountPath: /scripts

  # Probe step: checks input codec and resolution to see if transcoding is needed
  - name: probe-file
    inputs:
      parameters:
      - name: filepath
        value: "{{workflow.parameters.filepath}}"
      - name: force_transcode
        value: "{{workflow.parameters.force_transcode}}"
    outputs:
      parameters:
      - name: media-info
        valueFrom:
          path: /tmp/media-info.json
    container:
      image: ghcr.io/kevinastone/ffmpeg:9.0.2@sha256:9a09b42a2a36e211d2bc980ebcb9e646dc495a87a66aea64b54c8b2533d9606e
      command: [/scripts/probe-file.sh]
      args: ["{{inputs.parameters.filepath}}"]
      volumeMounts:
      - name: media
        mountPath: /media
      - name: temp
        mountPath: /tmp
      - name: scripts
        mountPath: /scripts

  # Rule evaluation step: evaluates transcoding rules via Open Policy Agent (OPA) using Rego policy
  - name: evaluate-rules
    inputs:
      parameters:
      - name: media-info
      - name: filepath
      - name: output_filepath
      - name: force_transcode
      - name: encoder
      - name: target_codec
    outputs:
      parameters:
      - name: should_transcode
        valueFrom:
          path: /tmp/should_transcode.txt
      - name: reasons
        valueFrom:
          path: /tmp/reasons.json
          default: "[]"
      - name: transcode_params
        valueFrom:
          path: /tmp/transcode_params.json
          default: "{}"
      - name: output_filepath
        valueFrom:
          path: /tmp/output_filepath.txt
          default: ""
    container:
      image: openpolicyagent/opa:1.22.1-debug@sha256:55f29af40523070c8fb5b72a0eece788edba33a14f42960f3bb2129e669288fe
      command: [/bin/sh, -c]
      args:
      - |
        set -eu

        # Generate input.json using native Argo JSON expressions and sprig template functions
        cat << 'EOF' > /tmp/input.json
        {{=toJson(sprig.dict(
          "media_info", sprig.mustFromJson(inputs.parameters["media-info"]),
          "force_transcode", inputs.parameters["force_transcode"] == "true",
          "filepath", inputs.parameters["filepath"],
          "output_filepath", inputs.parameters["output_filepath"],
          "encoder", inputs.parameters["encoder"],
          "target_codec", inputs.parameters["target_codec"]
        ))}}
        EOF

        # Evaluate Rego policy using the Kubernetes-native ..data symlink directory to recursively load modular packages while avoiding symlink duplicate traversal
        /opa eval --format=raw --data=/policy/..data --input=/tmp/input.json "data.policy.should_transcode" > /tmp/should_transcode.txt
        /opa eval --format=raw --data=/policy/..data --input=/tmp/input.json "data.policy.reasons" > /tmp/reasons.json
        /opa eval --format=raw --data=/policy/..data --input=/tmp/input.json "data.policy.transcode_params" > /tmp/transcode_params.json
        /opa eval --format=raw --data=/policy/..data --input=/tmp/input.json "data.policy.final_output_filepath" > /tmp/output_filepath.txt

        echo "OPA evaluation complete:"
        echo "  should_transcode: $(cat /tmp/should_transcode.txt)"
        echo "  reasons: $(cat /tmp/reasons.json)"
        echo "  transcode_params: $(cat /tmp/transcode_params.json)"
        echo "  output_filepath: $(cat /tmp/output_filepath.txt)"
      volumeMounts:
      - name: policy
        mountPath: /policy

  # Move file step: moves the input file to the output file if they're not the same
  - name: move-file
    inputs:
      parameters:
      - name: input_filepath
      - name: output_filepath
      - name: replace_original
    container:
      image: alpine:3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      command: [/scripts/move-file.sh]
      args:
      - "{{inputs.parameters.input_filepath}}"
      - "{{inputs.parameters.output_filepath}}"
      - "{{inputs.parameters.replace_original}}"
      volumeMounts:
      - name: media
        mountPath: /media
      - name: scripts
        mountPath: /scripts
