# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- rbac.yaml
- workflow-template.yaml
- eventsource.yaml
- sensor.yaml
- eventbus.yaml
configurations:
- kustomizeconfig.yaml
configMapGenerator:
- name: transcoder-scripts
  files:
  - scripts/transcode.sh
  - scripts/argo-ffmpeg-progress.sh
  - scripts/wait-for-file.sh
  - scripts/probe-file.sh
  - scripts/move-file.sh
  - scripts/delete-original.sh
- name: transcoder-policy
  files:
  - main.rego=policy/main.rego
  - video/main.rego=policy/video/main.rego
  - video/resolution.rego=policy/video/resolution.rego
  - video/codec.rego=policy/video/codec.rego
  - video/ffmpeg.rego=policy/video/ffmpeg.rego
  - audio.rego=policy/audio.rego
  - filepath.rego=policy/filepath.rego

