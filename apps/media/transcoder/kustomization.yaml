# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- rbac.yaml
- workflow-template.yaml
- eventsource.yaml
- sensor.yaml
- eventbus.yaml
- helmrelease-watcher.yaml
configurations:
- kustomizeconfig.yaml
configMapGenerator:
- name: transcoder-scripts
  options:
    disableNameSuffixHash: true
  files:
  - scripts/transcode.sh
  - scripts/argo-ffmpeg-progress.sh
  - scripts/wait-for-file.sh
  - scripts/probe-file.sh
  - scripts/move-file.sh
  - scripts/delete-original.sh
- name: transcoder-policy
  options:
    disableNameSuffixHash: true
  files:
  - policy/main.rego
  - policy/video_main.rego
  - policy/video_resolution.rego
  - policy/video_codec.rego
  - policy/video_ffmpeg.rego
  - policy/audio.rego
  - policy/filepath.rego

