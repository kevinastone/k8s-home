# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/argoproj.io/sensor_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: transcoder
  namespace: media
spec:
  template:
    serviceAccountName: transcoder-sa

  dependencies:
  - name: mqtt-dep
    eventSourceName: transcoder-mqtt
    eventName: transcode-requests
  - name: webhook-dep
    eventSourceName: transcoder-webhook
    eventName: transcode-webhook

  # (dependencyGroups has been removed to keep the logic strictly isolated)

  triggers:
  - template:
      name: transcode-trigger-mqtt
      # Explicitly bind this trigger to the mqtt dependency
      conditions: "mqtt-dep"
      k8s:
        operation: create
        source:
          resource:
            apiVersion: argoproj.io/v1alpha1
            kind: Workflow
            metadata:
              generateName: transcode-job-
              namespace: media
            spec:
              workflowTemplateRef:
                name: transcoder-workflow
              arguments:
                parameters:
                - name: filepath
                - name: output_filepath
                  value: "Output/"
        parameters:
        - src:
            dependencyName: mqtt-dep
            dataKey: body
          dest: spec.arguments.parameters.0.value

  - template:
      name: transcode-trigger-webhook
      # Explicitly bind this trigger to the webhook dependency
      conditions: "webhook-dep"
      k8s:
        operation: create
        source:
          resource:
            apiVersion: argoproj.io/v1alpha1
            kind: Workflow
            metadata:
              generateName: transcode-job-
              namespace: media
            spec:
              workflowTemplateRef:
                name: transcoder-workflow
              arguments:
                parameters:
                - name: filepath
                - name: output_filepath
                  value: "Output/"
                - name: replace_original
                  value: "true"
        parameters:
        - src:
            dependencyName: webhook-dep
            dataKey: body.path
          dest: spec.arguments.parameters.0.value
        - src:
            dependencyName: webhook-dep
            dataKey: body.output_path
          dest: spec.arguments.parameters.1.value
