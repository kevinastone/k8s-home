apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: /assets/icons/svg/radarr.svg
    gethomepage.dev/name: Radarr
    gethomepage.dev/widget.type: radarr
    gethomepage.dev/widget.url: http://radarr.media.svc:7878
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
    gethomepage.dev/widget.enableQueue: "false"
spec:

  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - radarr.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: radarr
      port: 7878
    matches:
    - path:
        type: PathPrefix
        value: /
