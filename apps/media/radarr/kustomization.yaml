# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- external-secret.yaml
- helmrelease.yaml
- http-route.yaml
- terraform.yaml
- databases.yaml

configMapGenerator:
- name: radarr-recyclarr-config
  options:
    disableNameSuffixHash: true
  files:
  - radarr.yml=resources/recyclarr.yml

components:
- ../../../components/kustomizeconfig
