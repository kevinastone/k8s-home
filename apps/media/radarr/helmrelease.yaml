# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-dirs:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 7.0.2.10888@sha256:69ea515df6e2a3ea1490cfa127ffaaf9597a9db84fffa2fa150a6fae98fe04cb
            command:
            - /bin/sh
            - -c
            args:
            - mkdir -p /downloads/movies
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 7.0.2.10888@sha256:69ea515df6e2a3ea1490cfa127ffaaf9597a9db84fffa2fa150a6fae98fe04cb
            env:
              RADARR__APP__INSTANCENAME: Radarr
              RADARR__APP__THEME: dark
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              RADARR__LOG__ANALYTICSENABLED: "False"
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__LEVEL: info
              RADARR__PORT: &port 7878
              RADARR__POSTGRES__HOST: "$(postgres_host)"
              RADARR__POSTGRES__PORT: "$(postgres_port)"
              RADARR__POSTGRES__USER: "$(postgres_user)"
              RADARR__POSTGRES__PASSWORD: "$(postgres_password)"
              RADARR__POSTGRES__MAINDB: radarr_main
              RADARR__POSTGRES__LOGDB: radarr_log
              RADARR__SERVER__ALLOWEDHOSTS: "radarr,radarr.media,radarr.media.svc,radarr.media.svc.cluster.local,radarr.k8s.kevinastone.com"
              RADARR__UPDATE__MECHANISM: None
              RADARR__UPDATE__AUTOMATICALLY: "False"
            envFrom:
            - prefix: postgres_
              secretRef:
                name: postgres-app
            - secretRef:
                name: radarr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                    httpHeaders:
                    - name: Host
                      value: localhost
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
      recyclarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.8.1@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
            command:
            - /bin/bash
            - -c
            args:
            - |
              until recyclarr sync; do
                echo "Waiting for Radarr API before scheduling..."
                sleep 5
              done
              exec /entrypoint.sh
            env:
              COMPlus_EnableDiagnostics: "0"
              CRON_SCHEDULE: "@daily"
              TZ: America/Los_Angeles
            envFrom:
            - secretRef:
                name: radarr-secret
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: main
        ports:
          http:
            port: *port
    persistence:
      config:
        type: emptyDir
        globalMounts:
        - path: /config
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
      media:
        type: persistentVolumeClaim
        existingClaim: media-media
        advancedMounts:
          main:
            app:
            - path: /storage/media
      downloads:
        type: persistentVolumeClaim
        existingClaim: media-downloads
        advancedMounts:
          main:
            init-dirs:
            - path: /downloads
              subPath: sabnzbd
            app:
            - path: /downloads
              subPath: sabnzbd
      config-file:
        type: configMap
        name: radarr-recyclarr-config
        advancedMounts:
          recyclarr:
            app:
            - path: /config/recyclarr.yml
              subPath: recyclarr.yml
              readOnly: true
      media-cover:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 5Gi
        advancedMounts:
          main:
            app:
            - path: /config/MediaCover
