apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sabnzbd
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: /assets/icons/svg/sabnzbd.svg
    gethomepage.dev/name: SABnzbd
    gethomepage.dev/widget.type: sabnzbd
    gethomepage.dev/widget.url: http://sabnzbd.media.svc:8080
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - sabnzbd.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: sabnzbd
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
