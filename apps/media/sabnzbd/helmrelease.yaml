# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  annotations:
    reconcile.fluxcd.io/requestedAt: "2026-09-23T18:25:00Z"
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  rollback:
    disableWait: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 0
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                    - ser8
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          init-config:
            image:
              repository: cuelang/cue
              tag: 0.17.1@sha256:520f883dcc92642389b3b75e8befe4e5a233a1aa903a8c846c4a3b338b202635
            command:
            - cue
            - export
            - /template:sabnzbd
            - /template/categories.yaml
            - /template/filters.yaml
            - /template/servers.yaml
            - /template/shows.yaml
            - -t
            - NZBGEEK_API_KEY=$(NZBGEEK_API_KEY)
            - -t
            - NEWSHOSTING_USERNAME=$(NEWSHOSTING_USERNAME)
            - -t
            - NEWSHOSTING_PASSWORD=$(NEWSHOSTING_PASSWORD)
            - -e
            - out
            - --out
            - text
            - -f
            - -o
            - /config/sabnzbd.ini
            envFrom:
            - secretRef:
                name: newshosting-secret
            - secretRef:
                name: nzbgeek-secret
            securityContext:
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3@sha256:c89b0322721c3eba47221e5f916505e7e742684651f73c5215717340b6b5402f
            env:
              UMASK: "022"
              SABNZBD__PORT: &port 8080
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd, sabnzbd.media, sabnzbd.media.svc, sabnzbd.media.svc.cluster, sabnzbd.media.svc.cluster.local, sabnzbd.k8s.kevinastone.com
            envFrom:
            - secretRef:
                name: sabnzbd-secret

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              runAsNonRoot: true
              runAsUser: 568
              runAsGroup: 568
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi

    service:
      app:
        controller: main
        ports:
          http:
            port: *port

    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          main:
            init-config:
            - path: /config
            app:
            - path: /config
      config-file:
        type: configMap
        name: sabnzbd-config
        advancedMounts:
          main:
            init-config:
            - path: /template
              readOnly: true
      tmpfs:
        type: emptyDir
        advancedMounts:
          main:
            app:
            - path: /config/logs
              subPath: logs
            - path: /tmp
              subPath: tmp
      incoming:
        type: persistentVolumeClaim
        existingClaim: media-incoming
        advancedMounts:
          main:
            app:
            - path: /incoming
      downloads:
        type: persistentVolumeClaim
        existingClaim: media-downloads
        advancedMounts:
          main:
            app:
            - path: /downloads
              subPath: sabnzbd
      media:
        type: persistentVolumeClaim
        existingClaim: media-media
        advancedMounts:
          main:
            app:
            - path: /storage/media
