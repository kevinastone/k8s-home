# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          init-config:
            image: &image
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3@sha256:b1795982db498ed5691a7b1231f0fac7eed2a1d53e9c81b8e834d02695e76104
            command:
            - sh
            - -c
            - |
              mkdir -p /config
              cp /config-src/sabnzbd.ini /config/sabnzbd.ini
              sed -i "s|NEWSHOSTING_USERNAME|${NEWSHOSTING_USERNAME}|g" /config/sabnzbd.ini
              sed -i "s|NEWSHOSTING_PASSWORD|${NEWSHOSTING_PASSWORD}|g" /config/sabnzbd.ini
              chown -R 568:568 /config
              chmod -R 775 /config
            envFrom:
            - secretRef:
                name: newshosting-secret
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
        containers:
          app:
            image: *image
            env:
              UMASK: "022"
              SABNZBD__PORT: &port 8080
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd, sabnzbd.media, sabnzbd.media.svc, sabnzbd.media.svc.cluster, sabnzbd.media.svc.cluster.local, sabnzbd.k8s.kevinastone.com
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              runAsNonRoot: true
              runAsUser: 568
              runAsGroup: 568
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi

    service:
      app:
        controller: main
        ports:
          http:
            port: *port

    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          main:
            init-config:
            - path: /config
            app:
            - path: /config
      config-file:
        type: configMap
        name: sabnzbd-config
        advancedMounts:
          main:
            init-config:
            - path: /config-src
              readOnly: true
      tmpfs:
        type: emptyDir
        advancedMounts:
          main:
            app:
            - path: /config/logs
              subPath: logs
            - path: /tmp
              subPath: tmp
      incoming:
        type: persistentVolumeClaim
        existingClaim: media-incoming
        advancedMounts:
          main:
            app:
            - path: /incoming
      downloads:
        type: persistentVolumeClaim
        existingClaim: media-downloads
        advancedMounts:
          main:
            app:
            - path: /downloads
      media:
        type: persistentVolumeClaim
        existingClaim: media-media
        advancedMounts:
          main:
            app:
            - path: /media
