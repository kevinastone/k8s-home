# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- helmrelease.yaml
- http-route.yaml
- external-secret.yaml

configMapGenerator:
- name: sabnzbd-config
  files:
  - resources/sabnzbd.ini/main.cue
  - resources/sabnzbd.ini/env.cue
  - resources/sabnzbd.ini/misc.cue
  - resources/sabnzbd.ini/categories.cue
  - resources/sabnzbd.ini/categories.yaml
  - resources/sabnzbd.ini/servers.cue
  - resources/sabnzbd.ini/servers.yaml
  - resources/sabnzbd.ini/shows.cue
  - resources/sabnzbd.ini/shows.yaml
  - resources/sabnzbd.ini/types.cue

configurations:
- kustomizeconfig.yaml
