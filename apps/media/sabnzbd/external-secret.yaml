# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: newshosting-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: one-password
  target:
    name: newshosting-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NEWSHOSTING_USERNAME: "{{ .username }}"
        NEWSHOSTING_PASSWORD: "{{ .password }}"
  dataFrom:
  - extract:
      key: "Newshosting"
---

apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: sabnzbd-api-key
spec:
  length: 32
  allowRepeat: true
  noUpper: false
  symbols: 0
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd-secret
spec:
  refreshInterval: "0"
  target:
    name: sabnzbd-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "homepage"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "homepage"
      data:
        SABNZBD__API_KEY: "{{ .password }}"
        SABNZBD__NZB_KEY: "{{ .password }}"
        sabnzbd_api_key: "{{ .password }}"
        HOMEPAGE_VAR_SABNZBD_API_KEY: "{{ .password }}"
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: sabnzbd-api-key


