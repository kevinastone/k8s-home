# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: newshosting-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: one-password
  target:
    name: newshosting-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NEWSHOSTING_USERNAME: "{{ .username }}"
        NEWSHOSTING_PASSWORD: "{{ .password }}"
  dataFrom:
  - extract:
      key: "Newshosting"
---

# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd-secret
spec:
  refreshInterval: "0"
  refreshPolicy: OnChange
  target:
    name: sabnzbd-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          homepage.dev/secret: "true"
      data:
        SABNZBD__API_KEY: "{{ .password }}"
        SABNZBD__NZB_KEY: "{{ .password }}"
        sabnzbd_api_key: "{{ .password }}"
        HOMEPAGE_VAR_SABNZBD_API_KEY: "{{ .password }}"
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: ClusterGenerator
        name: password-alphanumeric
