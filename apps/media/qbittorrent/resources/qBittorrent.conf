# Application file logging configuration
[Application]
FileLogger\Age=1
FileLogger\AgeType=1
FileLogger\Backup=true
FileLogger\DeleteOld=true
FileLogger\Enabled=false
FileLogger\MaxSizeBytes=66560
FileLogger\Path=/config/qBittorrent/logs

# External programs run on torrent completion
[AutoRun]
enabled=false
program=

# BitTorrent engine and libtorrent session settings
[BitTorrent]
# Add new torrents in active/started state
Session\AddTorrentStopped=false
Session\ExcludedFileNames=
# Inbound BitTorrent listening port (synced with VPN firewall port)
Session\Port=55920
Session\SSL\Port=28733
Session\UseRandomPort=false
# Torrent queueing limits (disabled for unlimited active torrents)
Session\QueueingSystemEnabled=false
# Swarm discovery: announce to all tiers & trackers, enable DHT/PeX/LSD
Session\DHTEnabled=true
Session\PeXEnabled=true
Session\LSDEnabled=true
Session\AnnounceToAllTiers=true
Session\AnnounceToAllTrackers=true
# Automatically add popular public trackers to new downloads
Session\AddTrackersEnabled=true
Session\AdditionalTrackers="udp://tracker.opentrackr.org:1337/announce\nudp://open.stealth.si:80/announce\nudp://tracker.torrent.eu.org:451/announce\nudp://tracker.bittor.pw:1337/announce\nudp://public.popcorn-tracker.org:6969/announce\nudp://tracker.dler.org:6969/announce\nudp://exodus.desync.com:6969/announce\nudp://open.demonii.com:1337/announce"

# Seeding ratio limits: stop torrents immediately after download reaches ratio 0
Session\ShareLimitAction=Stop
Session\GlobalMaxRatio=0
# Default download and temporary storage paths (Engine layer)
# NOTE: Duplicated by [Preferences] Downloads\* below; this entry configures the libtorrent engine session.
Session\DefaultSavePath=/incoming
Session\TempPathEnabled=true
Session\TempPath=/downloads
# Bind BitTorrent traffic exclusively to the VPN interface to prevent IP leaks
# NOTE: Session\Interface binds the network socket, while Session\InterfaceName sets the active UI dropdown selection.
Session\Interface=tun0
Session\InterfaceName=tun0
Session\InterfaceAddress=0.0.0.0
# Global and per-torrent connection limits
Session\MaxConnections=1000
Session\MaxConnectionsPerTorrent=150
Session\MaxHalfOpenConnections=50

# Choking & bandwidth distribution
Session\SeedChokingAlgorithm=FastestUpload

# Disk I/O & buffer optimizations
Session\AsyncIOThreads=8
Session\DiskCacheSize=1024
Session\CoalesceWrites=true
Session\GuidedReadCache=true
Session\SendBufferWatermark=3072
Session\SendBufferLowWatermark=1024
Session\SendBufferWatermarkFactor=150

# Application-level torrent file management
[Core]
# Automatically delete original .torrent files once ingested
AutoDeleteAddedTorrentFile=Always

# Legal notice agreement
[LegalNotice]
Accepted=true

# Configuration schema version
[Meta]
MigrationVersion=8

# Network, proxy, and UPnP port forwarding settings
[Network]
# Disable UPnP/NAT-PMP port forwarding on the host
PortForwardingEnabled=false
Proxy\HostnameLookupEnabled=false
Proxy\Profiles\BitTorrent=true
Proxy\Profiles\Misc=true
Proxy\Profiles\RSS=true

# General WebUI and application preferences
[Preferences]
General\Locale=en
MailNotification\req_auth=true

# WebUI Network and Authentication
WebUI\Address=*
WebUI\Port=8080
WebUI\ServerDomains=*
WebUI\UseUPnP=false
# Allow local/private subnets to access WebUI without login
WebUI\AuthSubnetWhitelist="172.16.0.0/12", "10.0.0.0/8", "192.168.0.0/16"
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\LocalHostAuth=false
# Disable CSRF/Host header validation for reverse proxy compatibility
WebUI\CSRFProtection=false
WebUI\HostHeaderValidation=false

# Behavior & UI display
Advanced\confirmTorrentDeletion=false
General\StatusbarExternalIPDisplayed=true
General\HideZeroValues=true

# Downloads UI paths (UI / WebUI layer)
# NOTE: Duplicated with [BitTorrent] Session\* above; this entry sets the paths displayed in the Options UI dialog.
Downloads\SavePath=/incoming
Downloads\TempPathEnabled=true
Downloads\TempPath=/downloads

# Transfer list sidebar filters
[TransferListFilters]
# Automatically hide categories/status filters with 0 torrents
HideZeroStatusFilters=true
