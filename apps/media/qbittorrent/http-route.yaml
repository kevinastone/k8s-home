apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: /assets/icons/svg/qbittorrent.svg
    gethomepage.dev/name: qBittorrent
    gethomepage.dev/widget.type: qbittorrent
    gethomepage.dev/widget.url: http://qbittorrent.media.svc:8080
    gethomepage.dev/widget.enableLeechProgress: "true"
    gethomepage.dev/widget.enableLeechSize: "true"
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - qbittorrent.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: qbittorrent
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
