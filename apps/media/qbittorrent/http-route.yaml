---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
spec:
  parentRefs:
    - name: auth-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - torrent.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: qbittorrent
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
