# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: 2.6.5.5623@sha256:6152751c3ea2e7751564f5952173d5e83eed0e09f3fabd2cb6bdb58690c39e2f
            env:
              PROWLARR__APP__INSTANCENAME: Prowlarr
              PROWLARR__APP__THEME: dark
              PROWLARR__AUTH__METHOD: External
              PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
              PROWLARR__LOG__DBENABLED: "False"
              PROWLARR__LOG__LEVEL: info
              PROWLARR__PORT: &port 9696
              PROWLARR__SERVER__ALLOWEDHOSTS: "prowlarr,prowlarr.media,prowlarr.media.svc,prowlarr.media.svc.cluster.local,prowlarr.k8s.kevinastone.com"
              PROWLARR__UPDATE__MECHANISM: None
              PROWLARR__UPDATE__AUTOMATICALLY: "False"
            envFrom:
            - secretRef:
                name: prowlarr-secret
            - secretRef:
                name: nzbgeek-secret
            lifecycle:
              postStart:
                exec:
                  command:
                  - /bin/sh
                  - -c
                  - |
                    (
                      while ! curl -s -f -H "X-Api-Key: $api_key" http://127.0.0.1:9696/api/v1/system/status >/dev/null 2>&1; do
                        sleep 2
                      done

                      EXISTING=$(curl -s -f -H "X-Api-Key: $api_key" http://127.0.0.1:9696/api/v1/indexer | jq '.[] | select(.name == "NZBGeek")')

                      if [ -z "$EXISTING" ]; then
                        PAYLOAD=$(curl -s -f -H "X-Api-Key: $api_key" http://127.0.0.1:9696/api/v1/indexer/schema | jq \
                          --arg apikey "$NZBGEEK_API_KEY" \
                          '.[] | select(.name == "NZBgeek") |
                           .name = "NZBGeek" |
                           .enable = true |
                           .redirect = true |
                           .appProfileId = 1 |
                           .priority = 1 |
                           .fields = [.fields[] | if .name == "apiKey" then .value = $apikey else . end]')

                        curl -s -f -X POST \
                          -H "Content-Type: application/json" \
                          -H "X-Api-Key: $api_key" \
                          -d "$PAYLOAD" \
                          http://127.0.0.1:9696/api/v1/indexer
                      else
                        INDEXER_ID=$(echo "$EXISTING" | jq '.id')
                        PAYLOAD=$(echo "$EXISTING" | jq \
                          --arg apikey "$NZBGEEK_API_KEY" \
                          '.enable = true |
                           .redirect = true |
                           .appProfileId = 1 |
                           .priority = 1 |
                           .fields = [.fields[] | if .name == "apiKey" then .value = $apikey else . end]')

                        curl -s -f -X PUT \
                          -H "Content-Type: application/json" \
                          -H "X-Api-Key: $api_key" \
                          -d "$PAYLOAD" \
                          "http://127.0.0.1:9696/api/v1/indexer/$INDEXER_ID"
                      fi
                    ) &
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                    httpHeaders:
                    - name: Host
                      value: localhost
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: main
        ports:
          http:
            port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          main:
            app:
            - path: /config
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
