# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: /assets/icons/svg/prowlarr.svg
    gethomepage.dev/name: Prowlarr
    gethomepage.dev/href: https://prowlarr.k8s.kevinastone.com/search
    gethomepage.dev/weight: 10
    gethomepage.dev/widget.type: prowlarr
    gethomepage.dev/widget.url: http://prowlarr.media.svc:9696
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - prowlarr.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: prowlarr
      port: 9696
    matches:
    - path:
        type: PathPrefix
        value: /
