# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: torrent-redirect
spec:
  parentRefs:
  - name: public-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - torrent.k8s.kevinastone.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: qbittorrent.k8s.kevinastone.com
        statusCode: 302
