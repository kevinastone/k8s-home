apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: torrent-redirect
spec:
  parentRefs:
  - name: public-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - torrent.k8s.kevinastone.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: transmission.k8s.kevinastone.com
        statusCode: 302
