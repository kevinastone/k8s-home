# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1/persistentvolume-v1.json
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: smb.csi.k8s.io
  name: media-incoming
spec:
  capacity:
    storage: 100Gi
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
  - dir_mode=0777
  - file_mode=0777
  - cache=strict
  - actimeo=30
  - nosharesock
  - vers=3.0
  - noserverino # required to prevent data corruption
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: media-incoming
    volumeAttributes:
      source: "//storage.home.kevinastone.com/Incoming"
    nodeStageSecretRef:
      name: storage-cifs-secret
      namespace: smb
