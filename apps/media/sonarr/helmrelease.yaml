# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-dirs:
            image:
              repository: alpine
              tag: 3@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
            command:
            - /bin/sh
            - -c
            args:
            - mkdir -p /downloads/tv
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
        containers:
          app:
            image:
              repository: ghcr.io/kevinastone/nix-containers/sonarr
              tag: 5.0.0.2997@sha256:edc9f98f7fcda4e9d66ab9b9f7a82dcaaaa21132cb8ec4bfc3626c0103dac428
            env:
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__APP__THEME: dark
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
              SONARR__LOG__ANALYTICSENABLED: "False"
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__PORT: &port 8989
              SONARR__POSTGRES__HOST: "$(postgres_host)"
              SONARR__POSTGRES__PORT: "$(postgres_port)"
              SONARR__POSTGRES__USER: "$(postgres_user)"
              SONARR__POSTGRES__PASSWORD: "$(postgres_password)"
              SONARR__POSTGRES__MAINDB: sonarr_main
              SONARR__POSTGRES__LOGDB: sonarr_log
              SONARR__SERVER__ALLOWEDHOSTS: "sonarr,sonarr.media,sonarr.media.svc,sonarr.media.svc.cluster.local,sonarr.k8s.kevinastone.com"
              SONARR__UPDATE__MECHANISM: None
              SONARR__UPDATE__AUTOMATICALLY: "False"
            envFrom:
            - prefix: postgres_
              secretRef:
                name: postgres-app
            - secretRef:
                name: sonarr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                    httpHeaders:
                    - name: Host
                      value: localhost
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: main
        ports:
          http:
            port: *port
    persistence:
      config:
        type: emptyDir
        globalMounts:
        - path: /config
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
      media:
        type: persistentVolumeClaim
        existingClaim: media-media
        advancedMounts:
          main:
            app:
            - path: /storage/media
      downloads:
        type: persistentVolumeClaim
        existingClaim: media-downloads
        advancedMounts:
          main:
            init-dirs:
            - path: /downloads
              subPath: sabnzbd
            app:
            - path: /downloads
              subPath: sabnzbd
      media-cover:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 5Gi
        advancedMounts:
          main:
            app:
            - path: /config/MediaCover
