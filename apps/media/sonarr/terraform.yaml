# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/infra.contrib.fluxcd.io/terraform_v1alpha2.json
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: sonarr
spec:
  serviceAccountName: tf-runner
  interval: 10m
  approvePlan: auto
  path: ./apps/media/sonarr/tofu
  sourceRef:
    kind: GitRepository
    name: fluxcd-sync
    namespace: flux-system
  varsFrom:
  - kind: Secret
    name: sonarr-secret
    varsKeys:
    - api_key
  - kind: Secret
    name: sabnzbd-secret
    varsKeys:
    - sabnzbd_api_key


---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tf-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tf-runner
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["*"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tf-runner
subjects:
- kind: ServiceAccount
  name: tf-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tf-runner
