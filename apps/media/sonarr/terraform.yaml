# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/infra.contrib.fluxcd.io/terraform_v1alpha2.json
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: sonarr
spec:
  serviceAccountName: tf-runner
  interval: 10m
  approvePlan: auto
  path: ./apps/media/sonarr/tofu
  sourceRef:
    kind: GitRepository
    name: fluxcd-sync
    namespace: flux-system
  varsFrom:
  - kind: Secret
    name: sonarr-secret
    varsKeys:
    - api_key
  - kind: Secret
    name: sabnzbd-secret
    varsKeys:
    - sabnzbd_api_key
  - kind: Secret
    name: nzbgeek-secret
