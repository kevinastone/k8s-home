apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: /assets/icons/svg/sonarr.svg
    gethomepage.dev/name: Sonarr
    gethomepage.dev/widget.type: sonarr
    gethomepage.dev/widget.url: http://sonarr.media.svc:8989
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
    gethomepage.dev/widget.enableQueue: "true"
spec:

  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - sonarr.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: sonarr
      port: 8989
    matches:
    - path:
        type: PathPrefix
        value: /
