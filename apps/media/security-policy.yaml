apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: media-authz
spec:
  mergeType: StrategicMerge
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    matchExpressions:
    - key: gateway.k8s.kevinastone.com/public
      operator: DoesNotExist
  authorization:
    defaultAction: Deny
    rules:
    - name: allow-media-and-admin
      action: Allow
      principal:
        jwt:
          provider: authelia
          claims:
          - name: groups
            valueType: StringArray
            values:
            - media
            - lldap_admin
