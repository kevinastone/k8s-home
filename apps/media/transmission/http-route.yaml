apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: transmission
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: /assets/icons/svg/transmission.svg
    gethomepage.dev/name: Transmission
    gethomepage.dev/widget.type: transmission
    gethomepage.dev/widget.url: http://transmission.media.svc:9091
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - transmission.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: transmission
      port: 9091
    matches:
    - path:
        type: PathPrefix
        value: /
