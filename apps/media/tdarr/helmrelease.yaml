# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tdarr
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/haveagitgat/tdarr
              tag: 2.72.01
            env:
              TZ: America/Los_Angeles
              serverIP: 0.0.0.0
              serverPort: &serverPort 8266
              webUIPort: &webUIPort 8265
              internalNode: "true"
              inContainer: "true"
              nodeID: mainNode
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *webUIPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: main
        ports:
          http:
            port: *webUIPort
          server:
            port: *serverPort
    persistence:
      server:
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
        - path: /app/server
      configs:
        type: emptyDir
        globalMounts:
        - path: /app/configs
      tmp:
        type: emptyDir
        globalMounts:
        - path: /temp
      # media:
      #   type: nfs
      #   server: voyager.internal
      #   path: ${SECRET_NFS_DATA}
      #   globalMounts:
      #   - path: /media
