# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tdarr
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/haveagitgat/tdarr
              tag: 2.78.01
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: America/Los_Angeles
              serverIP: 0.0.0.0
              serverPort: &serverPort 8266
              webUIPort: &webUIPort 8265
              internalNode: "false"
              inContainer: "true"
              nodeID: mainNode
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *webUIPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 4Gi
      node:
        replicas: 3
        containers:
          app:
            image:
              repository: ghcr.io/haveagitgat/tdarr_node
              tag: 2.77.01
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: America/Los_Angeles
              serverIP: tdarr.media.svc.cluster.local
              serverPort: "8266"
              TDARR_MODE: "node"
              GPU_VENDOR: "amd"
              ENABLE_TDARR_EXPORTER: "true"
              transcodecpuWorkers: "2"
              transcodegpuWorkers: "2"
              healthcheckcpuWorkers: "1"
              healthcheckgpuWorkers: "1"
              nodeID:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 4Gi
                device/vaapi: 1
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    defaultPodOptions:
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: main
        ports:
          http:
            port: *webUIPort
          server:
            port: *serverPort
    persistence:
      server:
        type: persistentVolumeClaim
        size: 1Gi
        accessMode: ReadWriteOnce
        storageClass: longhorn
        advancedMounts:
          main:
            app:
            - path: /app/server
      configs:
        type: emptyDir
        globalMounts:
        - path: /app/configs
      tmp:
        type: emptyDir
        globalMounts:
        - path: /temp
      cache:
        type: persistentVolumeClaim
        size: 50Gi
        accessMode: ReadWriteMany
        storageClass: longhorn
        globalMounts:
        - path: /cache
      media:
        type: custom
        volumeSpec:
          csi:
            driver: smb.csi.k8s.io
            volumeAttributes:
              source: "//storage.home.kevinastone.com/Incoming"
              secretName: storage-cifs-secret
              mountOptions: "dir_mode=0777,file_mode=0777,cache=strict,actimeo=30,nosharesock,vers=3.0"
        globalMounts:
        - path: /media
