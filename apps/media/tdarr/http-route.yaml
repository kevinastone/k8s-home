apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tdarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: /static/icons/png/tdarr.png
    gethomepage.dev/name: Tdarr
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - tdarr.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: tdarr
      port: 8265
    matches:
    - path:
        type: PathPrefix
        value: /
