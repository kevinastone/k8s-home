# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vpn-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: one-password
  target:
    name: vpn-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WIREGUARD_PRIVATE_KEY: "{{ .private_key }}"
        WIREGUARD_PRESHARED_KEY: "{{ .preshared_key }}"
        WIREGUARD_ADDRESSES: "{{ .addresses }}"
        VPN_SERVICE_PROVIDER: "{{ .provider }}"
        FIREWALL_VPN_INPUT_PORTS: '{{ index . "input_ports" | default "" }}'
  dataFrom:
  - extract:
      key: "VPN Credentials"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nzbgeek-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: one-password
  target:
    name: nzbgeek-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NZBGEEK_API_KEY: "{{ .api_key }}"
  dataFrom:
  - extract:
      key: "NZBGeek"

