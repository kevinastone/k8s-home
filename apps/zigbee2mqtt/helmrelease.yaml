---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 2.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  dependsOn:
    - name: mosquitto
      namespace: mqtt
  values:
    controllers:
      main:
        type: deployment
        containers:
          main:
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 1.35.3@sha256:f80dbca12732841eb9f77b04903d00369543c65632f9209fc1c545e9525e7bdd
            env:
            - name: DEBUG
              value: zigbee-herdsman
 
        initContainers:
         init-config:
           image:
             repository: busybox
             tag: "1.36"
           args:
             - /bin/sh
             - -c
             - "cp -f /config-data/*.yaml /app/data/"

    service:
      main:
        type: ClusterIP
        ports:
          http:
            port: 80

    ingress:
      main:
        enabled: false

    persistence:
      data:
        enabled: true
        retain: false
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /app/data
      config:
        enabled: true
        type: configMap
        name: zigbee2mqtt-config # overriden by kustomizeconfig
        globalMounts:
          - path: /config-data/configuration.yaml
            subPath: configuration.yaml
      secrets:
        enabled: true
        type: secret
        name: zigbee2mqtt-secret # overriden by kustomizeconfig
        globalMounts:
          - path: /app/data/secret.yaml
            subPath: secret.yaml
