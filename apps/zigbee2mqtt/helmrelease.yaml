---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.2.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  dependsOn:
    - name: mosquitto
      namespace: mqtt
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 1.37.1@sha256:d37f2f8227d9c2763ddbe06e48328f9ec3a9b8cf081dfcbda44c9b0af4c0c634
            resources:          
              limits:
                squat.ai/serial: 1
            ports:
            - containerPort: 80
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes
        initContainers:
         init-config:
           image:
             repository: busybox
             tag: "1.36@sha256:5eef5ed34e1e1ff0a4ae850395cbf665c4de6b4b83a32a0bc7bcb998e24e7bbb"
           args:
             - /bin/sh
             - -c
             - "cp -f /config-data/*.yaml /app/data/"

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 80

    persistence:
      data:
        enabled: true
        retain: false
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /app/data
      config:
        enabled: true
        type: configMap
        name: zigbee2mqtt-config # overriden by kustomizeconfig
        globalMounts:
          - path: /config-data/configuration.yaml
            subPath: configuration.yaml
      secrets:
        enabled: true
        type: secret
        name: zigbee2mqtt-secret # overriden by kustomizeconfig
        globalMounts:
          - path: /app/data/secret.yaml
            subPath: secret.yaml
