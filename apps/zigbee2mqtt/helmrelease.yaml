---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  dependsOn:
    - name: mosquitto
      namespace: mqtt
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 1.42.0@sha256:732ae43d714610040bd049487b60af3b2dbcfdefb5f169897455b60d715e2131
            resources:
              limits:
                squat.ai/zigbee: 1
            ports:
            - containerPort: 80
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes
        initContainers:
         init-config:
           image:
             repository: busybox
             tag: "1.37@sha256:db142d433cdde11f10ae479dbf92f3b13d693fd1c91053da9979728cceb1dc68"
           args:
             - /bin/sh
             - -c
             - "cp -f /config-data/*.yaml /app/data/"

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 80

    persistence:
      data:
        enabled: true
        retain: true
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /app/data
      config:
        enabled: true
        type: configMap
        name: zigbee2mqtt-config # overriden by kustomizeconfig
        globalMounts:
          - path: /config-data/configuration.yaml
            subPath: configuration.yaml
      secrets:
        enabled: true
        type: secret
        name: zigbee2mqtt-secret # overriden by kustomizeconfig
        globalMounts:
          - path: /app/data/secret.yaml
            subPath: secret.yaml
