---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.6.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 2.0.0@sha256:6105a3a01a66bbfb98909a7c309d0707ec7b41728ac15d399747077225231545
            resources:
              limits:
                squat.ai/zigbee: 1
            ports:
              - containerPort: 80
                name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes
        initContainers:
          init-config:
            image:
              repository: busybox
              tag: "1.37@sha256:2919d0172f7524b2d8df9e50066a682669e6d170ac0f6a49676d54358fe970b5"
            args:
              - /bin/sh
              - -c
              - "cp -f /config-data/*.yaml /app/data/"

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 80

    persistence:
      data:
        enabled: true
        retain: true
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /app/data
      config:
        enabled: true
        type: configMap
        name: zigbee2mqtt-config # overriden by kustomizeconfig
        globalMounts:
          - path: /config-data/configuration.yaml
            subPath: configuration.yaml
      secrets:
        enabled: true
        type: secret
        name: zigbee2mqtt-secret # overriden by kustomizeconfig
        globalMounts:
          - path: /app/data/secret.yaml
            subPath: secret.yaml
