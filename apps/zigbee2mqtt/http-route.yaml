---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zigbee2mqtt
  labels:
    auth: authelia
spec:
  parentRefs:
    - name: auth-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - zigbee2mqtt.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: zigbee2mqtt
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
