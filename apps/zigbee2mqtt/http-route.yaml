apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zigbee2mqtt
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Servers
    gethomepage.dev/icon: /assets/icons/svg/zigbee2mqtt.svg
    gethomepage.dev/name: Zigbee2MQTT
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - zigbee2mqtt.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: zigbee2mqtt
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
