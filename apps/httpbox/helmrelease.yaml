# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: httpbox
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/kevinastone/httpbox
              tag: master@sha256:b24d0f52856e987892d3cd6768c226be6a6cb821f2351803a6aed2b930e2b57b
            env:
              PORT: &port 80
            ports:
            - containerPort: *port
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /healthz
              readiness: *probes

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
