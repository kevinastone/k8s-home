# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: httpbox
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/kevinastone/httpbox
              tag: master@sha256:66596f82b3ab5f80c8e356d10cff956886d648b7f71d9ddce7f0f6ec8019dea5
            env:
              PORT: &port 80
            ports:
            - containerPort: *port
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /healthz
              readiness: *probes

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
