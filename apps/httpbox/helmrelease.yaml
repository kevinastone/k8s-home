---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: httpbox
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/kevinastone/httpbox
              tag: master@sha256:63337c5257b890aaa31d5c09b6de018979710dfcece9ddfea5b060187252eb04
            env:
              PORT: &port 80
            ports:
              - containerPort: *port
                name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /healthz
              readiness: *probes

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
