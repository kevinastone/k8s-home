---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: httpbox
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.6.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/kevinastone/httpbox
              tag: master@sha256:70fddfe79f2aaa8e93c1c1798b8ac8bc1de08eb78ff46dc5446b8677860e1ea0
            env:
              PORT: &port 80
            ports:
            - containerPort: *port
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /healthz
              readiness: *probes

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
