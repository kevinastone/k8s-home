---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homer
resources:
  - namespace.yaml
  - helmrelease.yaml
  - helmrelease-static.yaml
  - http-route.yaml
configMapGenerator:
  - name: homer-config
    files:
      - config.yml=resources/config.yml
configurations:
  - kustomizeconfig.yaml
