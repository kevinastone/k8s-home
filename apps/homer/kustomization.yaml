---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homer
resources:
  - ./helmrelease.yaml
  - ./http-route.yaml
configMapGenerator:
  - name: homer-config
    files:
      - config.yml=./resources/config.yml
  - name: homer-assets
    files:
      - assets/2048.svg
      # Bug in configMapGenerator with binary data
      # - assets/octoprint.png
      - assets/headlamp.svg
configurations:
  - ./kustomizeconfig.yaml
