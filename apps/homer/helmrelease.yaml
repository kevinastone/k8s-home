---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: homer
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/bastienwirtz/homer
              tag: v24.11.5@sha256:7cc14fdddb94d3e13ccc6c6f3b54d9309d27d5f3f4140f3164e317d5f55e28b3
              pullPolicy: IfNotPresent
            ports:
              - containerPort: 8080
                name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 8080

    persistence:
      config:
        type: configMap
        name: homer-config # overriden by kustomizeconfig
        globalMounts:
          - path: /www/assets/config.yml
            subPath: config.yml
