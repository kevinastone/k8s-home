---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: homer
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

    controllers:
      main:
        replicas: 2
        type: statefulset
        statefulset:
          volumeClaimTemplates:
            - name: assets
              accessMode: ReadWriteOnce
              size: 10Gi
              globalMounts:
                - path: /www/assets/extra

        containers:
          main:
            image:
              repository: ghcr.io/bastienwirtz/homer
              tag: v24.04.1@sha256:2e39d1a791e93eae8fa1a21245a1226681607e2a83ec3c932226e19bc2b285ee
              pullPolicy: IfNotPresent
            ports:
            - containerPort: 8080
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes
        initContainers:
          sync-icons:
            image:
              repository: registry.k8s.io/git-sync/git-sync
              tag: "v4.2.3@sha256:19cc7c317d125c5737ecb9a9159d00b5d97f39c45225c6483de365d62fc09fa8"
            args:
              - --repo=https://github.com/walkxcode/dashboard-icons.git
              - --depth=1
              - --one-time
              - --ref=75950684602fd6871e2a2c39ce7e2ccd4880310d
              - --link=current
              - --root=/www/assets/extra/icons
          sync-theme:
            image:
              repository: registry.k8s.io/git-sync/git-sync
              tag: "v4.2.3@sha256:19cc7c317d125c5737ecb9a9159d00b5d97f39c45225c6483de365d62fc09fa8"
            args:
              - --repo=https://github.com/mrpbennett/catppuccin-homer.git
              - --depth=1
              - --one-time
              - --ref=377dd768acd4e87560db75edc312ddd7b62b3252
              - --link=current
              - --root=/www/assets/extra/theme

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080

    persistence:
      config:
        type: configMap
        name: homer-config # overriden by kustomizeconfig
        globalMounts:
          - path: /www/assets/config.yml
            subPath: config.yml
      custom-assets:
        enabled: true
        type: configMap
        name: homer-assets # overriden by kustomizeconfig
        globalMounts:
          - path: /www/assets/custom
