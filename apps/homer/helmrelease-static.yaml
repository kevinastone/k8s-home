---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: homer-static
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/nginxinc/nginx-unprivileged
              tag: "1.27.2"
              pullPolicy: IfNotPresent
            ports:
              - containerPort: 8080
                name: http
        initContainers:
          sync-icons:
            image:
              repository: registry.k8s.io/git-sync/git-sync
              tag: "v4.3.0@sha256:5813a7da0ccd58f6dfb9d5e48480e2877355e6bb3d7d81c8908eb1adc3a23b6e"
            args:
              - --repo=https://github.com/walkxcode/dashboard-icons.git
              - --depth=1
              - --one-time
              - --ref=75950684602fd6871e2a2c39ce7e2ccd4880310d
              - --link=current
              - --root=/usr/share/nginx/html/static/icons
          sync-theme:
            image:
              repository: registry.k8s.io/git-sync/git-sync
              tag: "v4.3.0@sha256:5813a7da0ccd58f6dfb9d5e48480e2877355e6bb3d7d81c8908eb1adc3a23b6e"
            args:
              - --repo=https://github.com/mrpbennett/catppuccin-homer.git
              - --depth=1
              - --one-time
              - --ref=377dd768acd4e87560db75edc312ddd7b62b3252
              - --link=current
              - --root=/usr/share/nginx/html/static/theme
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 8080

    persistence:
      static:
        enabled: true
        size: 10Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /usr/share/nginx/html/static
