---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: homer-static
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/kevinastone/homer-assets
              tag: "main@sha256:afc16e68c7e6e8e30f7b13da84677501850c0de50f3eb9a6c814b86cd1899450"
              pullPolicy: IfNotPresent
            ports:
              - containerPort: 8080
                name: http
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 8080
