# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: isponsorblocktv-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: one-password
  target:
    name: isponsorblocktv-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.json: |
          {
            "devices": [
              {
                "screen_id": "{{ .living_room }}",
                "name": "Living Room"
              },
              {
                "screen_id": "{{ .office }}",
                "name": "Office"
              },
              {
                "screen_id": "{{ .bedroom }}",
                "name": "Bedroom"
              }
            ],
            "skip_categories": ["sponsor", "selfpromo"],
            "skip_count_tracking": true,
            "mute_ads": true,
            "skip_ads": true,
            "auto_play": false,
            "apikey": "",
            "channel_whitelist": []
          }
  dataFrom:
  - extract:
      key: "iSponsorBlockTV"
