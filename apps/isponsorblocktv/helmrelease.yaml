---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: isponsorblocktv
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/dmunozv04/isponsorblocktv
              tag: v2.0.8@sha256:03d56604cc8a09601fa6e223666734c3b8ebb0b7706bacc14e2754bf3291dba0

    persistence:
      config:
        enabled: true
        name: isponsorblocktv-config # overriden by kustomizeconfig
        type: configMap
        globalMounts:
          - path: /app/data/config.json
            subPath: config.json
