---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: isponsorblocktv
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.3.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/dmunozv04/isponsorblocktv
              tag: v2.1.0@sha256:5081159324ca13f2b6641eec08f68ef5711f736354cb2cada61c2a69c49a8928

    persistence:
      config:
        enabled: true
        name: isponsorblocktv-config # overriden by kustomizeconfig
        type: configMap
        globalMounts:
          - path: /app/data/config.json
            subPath: config.json
