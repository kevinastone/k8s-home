---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: isponsorblocktv
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/dmunozv04/isponsorblocktv
              tag: v2.5.2@sha256:33b49ff675015ba520bd6be8deef8402fbd31a4ca73ce726f670421cb6bd6f06

    persistence:
      config:
        enabled: true
        name: isponsorblocktv-config # overriden by kustomizeconfig
        type: configMap
        globalMounts:
          - path: /app/data/config.json
            subPath: config.json
