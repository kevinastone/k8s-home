---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: isponsorblocktv
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.4.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/dmunozv04/isponsorblocktv
              tag: v2.2.0@sha256:40e2f6c8cae26beb3e35c1d2b6250f395343c31728b8d41ce3bf5be5fe2e6900

    persistence:
      config:
        enabled: true
        name: isponsorblocktv-config # overriden by kustomizeconfig
        type: configMap
        globalMounts:
          - path: /app/data/config.json
            subPath: config.json
