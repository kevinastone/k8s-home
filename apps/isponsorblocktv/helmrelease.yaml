---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: isponsorblocktv
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.7.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/dmunozv04/isponsorblocktv
              tag: v2.3.0@sha256:8cdb9f50a08d4277e22f25a73abb1edf77ad24c6f3d1295bf2cb310e34f7ebea

    persistence:
      config:
        enabled: true
        name: isponsorblocktv-config # overriden by kustomizeconfig
        type: configMap
        globalMounts:
          - path: /app/data/config.json
            subPath: config.json
