---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: ghostfolio
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.4.0
      sourceRef:
        kind: HelmRepository
        name: bernd-schorgers
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghostfolio/ghostfolio
              tag: 2.105.0@sha256:855e1f97a353a92460cb197e91c1aceda88bfbc9b5b11d1d4912db027cf025aa
            env:
              # REDIS_HOST: rfr-redis-0
              # REDIS_PORT: 6379
              DATABASE_URL: $(uri)
              POSTGRES_DB: ghostfolio
              POSTGRES_USER: $(username)
              POSTGRES_PASSWORD: $(password)
            envFrom:
            - secretRef:
                name: ghostfolio-env # overriden by kustomizeconfig
            - secretRef:
                name: postgres-app
            ports:
            - containerPort: 3333
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 3333
