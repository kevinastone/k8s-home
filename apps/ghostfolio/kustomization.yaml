---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ghostfolio
resources:
  - namespace.yaml
  - postgres
  - dragonfly.yaml
  - helmrelease.yaml
  - http-route.yaml
configurations:
  - kustomizeconfig.yaml
secretGenerator:
  - name: ghostfolio-env
    files:
    - ACCESS_TOKEN_SALT=secrets/access_token.salt.encrypted
    - JWT_SECRET_KEY=secrets/jwt.secret.encrypted
