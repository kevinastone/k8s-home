apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  replicas: 2
  resources:
    requests:
      memory: 300Mi
    limits:
      cpu: 100m
      memory: 500Mi
  args:
  - --version_check=false
  - --cache_mode
  - --maxmemory=256M
  # Needed by Ghostfolio
  - '--default_lua_flags=allow-undeclared-keys,disable-atomicity'
