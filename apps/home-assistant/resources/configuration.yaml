homeassistant:
  # Name of the location where Home Assistant is running
  name: Home
  # Location required to calculate the time the sun rises and sets
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  elevation: !secret home_elevation
  # metric for Metric, imperial for Imperial
  unit_system: us_customary
  country: US
  # Pick yours from here: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  time_zone: America/Los_Angeles

  external_url: https://automation.k8s.kevinastone.com

  # Customization file
  customize: !include customize.yaml

# Enables Defaults
assist_pipeline:
backup:
# bluetooth:
config:
conversation:
# dhcp:
energy:
history:
homeassistant_alerts:
cloud:
image_upload:
logbook:
media_source:
mobile_app:
my:
# ssdp:
stream:
sun:
usb:
webhook:
# zeroconf:

# Uncomment this if you are using SSL/TLS, running in Docker container, etc.
http:
  use_x_forwarded_for: yes
  trusted_proxies:
  - 172.16.0.0/12
  - 10.0.0.0/8
  - 192.168.0.0/16

# Enables the frontend
frontend:
lovelace:
  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true

# InfluxDB
influxdb:
  host: influxdb.k8s.kevinastone.com
  tags:
    db: home_assistant
  max_retries: 3

recorder:
  db_url: !env_var postgres_uri
  db_max_retries: 360 # 60 minutes (with 10sec interval below)
  db_retry_wait: 10

## # MQTT
## mqtt:
##   broker: mqtt

group: !include group.yaml
automation: !include automation.yaml
script: !include script.yaml
zone: !include zone.yaml

template:
- binary_sensor:
  - name: "washing_machine"
    state: >
      {{ states('sensor.laundry_power_power')|float(0) > 10 }}
    delay_on: "00:00:10"
    delay_off: "00:02:00"
