title: Home
views:
- type: masonry
  path: default_view
  title: Home
  panel: false
  cards:
  - type: entities
    title: Bedroom
    entities:
    - entity: sensor.bedroom_temperature_temperature
      name: Temperature
    - entity: sensor.bedroom_temperature_humidity
      name: Humidity
    - entity: sensor.bedroom_temperature_pressure
      name: Pressure
    footer:
      type: graph
      entity: sensor.bedroom_temperature_temperature
      detail: 2
  - type: entities
    title: Office
    entities:
    - entity: sensor.office_temperature_temperature
      name: Temperature
    - entity: sensor.office_temperature_humidity
      name: Humidity
    - entity: sensor.office_temperature_pressure
      name: Pressure
    footer:
      type: graph
      entity: sensor.office_temperature_temperature
      detail: 2
  - type: entities
    title: Living Room
    entities:
    - entity: sensor.living_room_temperature_temperature
      name: Temperature
    - entity: sensor.living_room_temperature_humidity
      name: Humidity
    - entity: sensor.living_room_temperature_pressure
      name: Pressure
    footer:
      type: graph
      entity: sensor.living_room_temperature_temperature
      detail: 2
  - type: vertical-stack
    cards:
    - type: tile
      entity: sensor.rack_power_power
      name:
        type: device
      features:
      - type: trend-graph
      features_position: inline
    - type: tile
      entity: sensor.media_power_power
      name:
        type: device
      features:
      - type: trend-graph
      features_position: inline
    - type: tile
      entity: sensor.desk_power_power
      name:
        type: device
      features:
      - type: trend-graph
      features_position: inline
    - type: history-graph
      entities:
      - entity: binary_sensor.washing_machine
