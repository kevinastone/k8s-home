---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2025.12.0@sha256:8951fcbb794da8f261e1639c668639bc90f9520b48099b5715f6d5fbfef08a0e
            envFrom:
              - prefix: postgres_
                secretRef:
                  name: postgres2-app
            ports:
              - containerPort: 8123
                name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 8123
    persistence:
      config:
        retain: true
        size: 10Gi
        storageClass: longhorn
        accessMode: ReadWriteMany
        globalMounts:
          - path: /config
      config-data:
        enabled: true
        type: configMap
        name: home-assistant-config # overriden by kustomizeconfig
        globalMounts:
          - path: /config/automation.yaml
            subPath: automation.yaml
          - path: /config/configuration.yaml
            subPath: configuration.yaml
          - path: /config/customize.yaml
            subPath: customize.yaml
          - path: /config/group.yaml
            subPath: group.yaml
          - path: /config/script.yaml
            subPath: script.yaml
          - path: /config/secrets.example.yaml
            subPath: secrets.example.yaml
          - path: /config/ui-lovelace.yaml
            subPath: ui-lovelace.yaml
          - path: /config/zone.yaml
            subPath: zone.yaml
      secrets:
        type: secret
        name: home-assistant-secret # overriden by kustomizeconfig
        globalMounts:
          - path: /config/secrets.yaml
            subPath: secrets.yaml
