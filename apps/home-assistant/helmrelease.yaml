# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.11.0@sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e
            envFrom:
            - prefix: postgres_
              secretRef:
                name: postgres2-app
            ports:
            - containerPort: 8123
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 8123
    persistence:
      config:
        retain: true
        size: 10Gi
        storageClass: longhorn
        accessMode: ReadWriteOnce
        globalMounts:
        - path: /config
      config-data:
        enabled: true
        type: configMap
        name: home-assistant-config # overriden by kustomizeconfig
        globalMounts:
        - path: /config/automation.yaml
          subPath: automation.yaml
        - path: /config/configuration.yaml
          subPath: configuration.yaml
        - path: /config/customize.yaml
          subPath: customize.yaml
        - path: /config/group.yaml
          subPath: group.yaml
        - path: /config/script.yaml
          subPath: script.yaml
        - path: /config/secrets.example.yaml
          subPath: secrets.example.yaml
        - path: /config/ui-lovelace.yaml
          subPath: ui-lovelace.yaml
        - path: /config/zone.yaml
          subPath: zone.yaml
      secrets:
        type: secret
        name: home-assistant-secret # overriden by kustomizeconfig
        globalMounts:
        - path: /config/secrets.yaml
          subPath: secrets.yaml
