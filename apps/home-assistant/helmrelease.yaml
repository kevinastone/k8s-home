---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        type: statefulset

        containers:
          main:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2024.10.4@sha256:408a5a63e3e9a89ceb6ecd98345e54c86073314b4d94e217cd54f7208307406d
            envFrom:
            - secretRef:
                name: postgres2-app
            ports:
            - containerPort: 8123
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 8123
    persistence:
      config:
        retain: false
        size: 10Gi
        storageClass: longhorn
        accessMode: ReadWriteMany
        globalMounts:
          - path: /config
      config-data:
        enabled: true
        type: configMap
        name: home-assistant-config # overriden by kustomizeconfig
        globalMounts:
          - path: /config/automation.yaml
            subPath: automation.yaml
          - path: /config/configuration.yaml
            subPath: configuration.yaml
          - path: /config/customize.yaml
            subPath: customize.yaml
          - path: /config/group.yaml
            subPath: group.yaml
          - path: /config/script.yaml
            subPath: script.yaml
          - path: /config/secrets.example.yaml
            subPath: secrets.example.yaml
          - path: /config/ui-lovelace.yaml
            subPath: ui-lovelace.yaml
          - path: /config/zone.yaml
            subPath: zone.yaml
      secrets:
        type: secret
        name: home-assistant-secret # overriden by kustomizeconfig
        globalMounts:
          - path: /config/secrets.yaml
            subPath: secrets.yaml
