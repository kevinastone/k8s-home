---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 2.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        type: statefulset

        containers:
          main:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2024.2.2
            envFrom:
            - secretRef:
                name: postgres-app
          # Configure the code-server sidecar
          code:
            dependsOn: main
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.21.1
            args:
              - --auth
              - "none"
              - --user-data-dir
              - "/config/.vscode"
              - --extensions-dir
              - "/config/.vscode"
              - --port
              - "8081"
              - "/config"

        initContainers:
          init-config:
            image:
              repository: busybox
              tag: "1.36"
            args:
              - /bin/sh
              - -c
              - "cp -f /config-data/*.yaml /config/"

    service:
      main:
        type: ClusterIP
        ports:
          http:
            port: 8123
      code:
        type: ClusterIP
        controller: main
        ports:
          http:
            port: 8081

    persistence:
      config:
        enabled: true
        retain: false
        size: 10Gi
        storageClass: longhorn
        accessMode: ReadWriteMany
        globalMounts:
          - path: /config
      config-data:
        enabled: true
        type: configMap
        name: home-assistant-config-data # overriden by kustomizeconfig
        globalMounts:
          - path: /config-data
      secrets:
        enabled: true
        type: secret
        name: home-assistant-secret # overriden by kustomizeconfig
        globalMounts:
          - path: /config/secrets.yaml
            subPath: secrets.yaml
