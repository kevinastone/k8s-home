---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - automation.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: home-assistant
          port: 8123
      matches:
        - path:
            type: PathPrefix
            value: /
