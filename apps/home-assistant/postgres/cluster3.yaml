---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres3
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.2-3
  primaryUpdateStrategy: unsupervised
  affinity:
    podAntiAffinityType: required
  storage:
    size: 10Gi
    storageClass: openebs-hostpath
  bootstrap:
    recovery:
      source: postgres2
  replica:
    enabled: true
    source: postgres2
  resources:
    requests:
      cpu: 200m
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
  walStorage:
    size: 1Gi
    storageClass: openebs-hostpath
  replicationSlots:
    highAvailability:
      enabled: true
  postgresql:
    parameters:
      max_slot_wal_keep_size: 256MB
      hot_standby_feedback: 'on'
      wal_keep_size: 32MB
      max_wal_size: 256MB
      min_wal_size: 32MB
  backup:
    barmanObjectStore:
      destinationPath: s3://postgres/home-assistant
      endpointURL: http://minio.minio:9000
      s3Credentials:
        accessKeyId:
          name: s3-creds
          key: ACCESS_KEY
        secretAccessKey:
          name: s3-creds
          key: SECRET_KEY
      wal:
        compression: &compression bzip2
      data:
        compression: *compression
    retentionPolicy: "30d"
  externalClusters:
  - name: postgres2
    barmanObjectStore:
      destinationPath: s3://postgres/home-assistant
      endpointURL: http://minio.minio:9000
      s3Credentials:
        accessKeyId:
          name: s3-creds
          key: ACCESS_KEY
        secretAccessKey:
          name: s3-creds
          key: SECRET_KEY
      wal:
        compression: *compression
      data:
        compression: *compression
