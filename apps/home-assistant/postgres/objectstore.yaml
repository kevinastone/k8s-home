---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres2
spec:
  configuration:
    destinationPath: s3://postgres/home-assistant
    endpointURL: https://s3.k8s.kevinastone.com
    s3Credentials:
      accessKeyId:
        name: s3-creds
        key: ACCESS_KEY
      secretAccessKey:
        name: s3-creds
        key: SECRET_KEY
    wal:
      compression: &compression bzip2
    data:
      compression: *compression
  retentionPolicy: "7d"
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        memory: 256Mi
