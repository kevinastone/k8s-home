# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
- ../components/helmrelease
resources:
# keep-sorted start
- dao-2048
- home-monitoring
- homepage
- httpbox
- isponsorblocktv
- media
- super-sudoku
- unifi
- ws4kp
- zigbee2mqtt
# keep-sorted end
patches:
- target:
    group: helm.toolkit.fluxcd.io
    kind: HelmRelease
    name: sabnzbd
  patch: |-
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: sabnzbd
    spec:
      upgrade:
        remediation:
          retries: 0
