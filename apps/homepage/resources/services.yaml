---
- Metrics:
    - Grafana:
        icon: grafana.svg
        href: https://grafana.k8s.kevinastone.com
        app: grafana
        namespace: grafana
    - Kubernetes Dashboard:
        icon: kubernetes.svg
        href: https://dashboard.k8s.kevinastone.com
        app: kubernetes-dashboard
        namespace: kubernetes-dashboard
    - Prometheus:
        icon: prometheus.svg
        href: https://prometheus.k8s.kevinastone.com/alerts?state=firing&state=pending&showEmptyGroups=0
        app: kube-prometheus-stack-prometheus
        namespace: prometheus
        podSelector: >-
          app.kubernetes.io/instance in (
              prometheus
          )
        widget:
          type: prometheusmetric
          url: http://prometheus-kube-prometheus-prometheus.prometheus.svc:9090
          refreshInterval: 10000 # optional - in milliseconds, defaults to 10s
          metrics:
            - label: Firing Alerts
              query: alertmanager_alerts{state="active"}
              format:
                type: number
        # widget:
        #   type: prometheus
        #   url: http://prometheus-kube-prometheus-prometheus.prometheus.svc:9090
