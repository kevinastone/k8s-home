title: Dashboard
theme: dark
color: slate
headerStyle: underlined
iconStyle: theme
target: _self
statusStyle: "dot"
layout:
  Metrics:
    style: row
    columns: 3
    icon: mdi-chart-line
    useEqualHeights: true
  Servers:
    style: row
    columns: 3
    icon: mdi-server
  Media:
    style: row
    columns: 3
    icon: mdi-television-play
    useEqualHeights: true
  Games:
    style: row
    columns: 3
    icon: mdi-gamepad-variant

quicklaunch:
  disabled: true
  searchDescription: true
  hideInternetSearch: true
  hideVisitURL: true
disableUpdateCheck: true

providers:
  longhorn:
    # username: "longhorn-username" # optional
    # password: "very-secret-longhorn-password" # optional
    url: http://longhorn-frontend.longhorn-system.svc
