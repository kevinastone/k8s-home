# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage-static
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/kevinastone/homer-assets
              tag: "main@sha256:322e3a634eae1bc65f9e558e9233672bca24137abd269457be6af68317e9217b"
              pullPolicy: IfNotPresent
            ports:
            - containerPort: 8080
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 8080
