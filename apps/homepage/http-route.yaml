# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - home.k8s.kevinastone.com
  - homepage.k8s.kevinastone.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /assets
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: homepage-assets
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /
    # Sticky sessions prevent unnecessary re-renders on page loads and tab focusing when replica count > 1
    # https://gethomepage.dev/installation/k8s/#multiple-replicas
    sessionPersistence:
      sessionName: homepage_session
      type: Cookie
      cookieConfig:
        lifetimeType: Session
    backendRefs:
    - name: homepage
      port: 80
