# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
- rbac.yaml
- helmrelease.yaml
- helmrelease-assets.yaml
- http-route.yaml
- kubernetes-store.yaml
- secret.yaml
- external-secret.yaml
configMapGenerator:
- name: homepage-config
  files:
  - resources/bookmarks.yaml
  - resources/custom.css
  - resources/custom.js
  - resources/docker.yaml
  - resources/kubernetes.yaml
  - resources/services.yaml
  - resources/settings.yaml
  - resources/widgets.yaml
components:
- ../../components/namespace
- ../../components/goldilocks
- ../../components/kustomizeconfig
