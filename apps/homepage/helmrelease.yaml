# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        replicas: 2
        podDisruptionBudget:
          minAvailable: 1
        containers:
          main:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
            env:
              LOG_TARGETS: stdout
              HOMEPAGE_ALLOWED_HOSTS: "*"
            envFrom:
            - secretRef:
                name: homepage-secrets
            ports:
            - containerPort: 3000
              name: http
            probes:
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 50Mi
          assets:
            image:
              repository: ghcr.io/kevinastone/homepage-assets-nginx
              tag: main@sha256:96712da55c879bd29117eb04d94074cf47ae37f9e3ea98a27a46cde00591dfab
            ports:
            - containerPort: 8080
              name: assets
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop:
                - ALL
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 3000
          assets:
            port: 8080
            targetPort: 8080
    persistence:
      config:
        type: configMap
        name: homepage-config # overriden by kustomizeconfig
        globalMounts:
        - subPath: bookmarks.yaml
          path: /app/config/bookmarks.yaml
        - subPath: custom.css
          path: /app/config/custom.css
        - subPath: custom.js
          path: /app/config/custom.js
        - subPath: docker.yaml
          path: /app/config/docker.yaml
        - subPath: kubernetes.yaml
          path: /app/config/kubernetes.yaml
        - subPath: services.yaml
          path: /app/config/services.yaml
        - subPath: settings.yaml
          path: /app/config/settings.yaml
        - subPath: widgets.yaml
          path: /app/config/widgets.yaml
      nginx-cache:
        type: emptyDir
        advancedMounts:
          main:
            assets:
            - path: /var/cache/nginx
      nginx-tmp:
        type: emptyDir
        advancedMounts:
          main:
            assets:
            - path: /tmp
    serviceAccount:
      homepage: {}
    defaultPodOptions:
      automountServiceAccountToken: true
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: homepage
