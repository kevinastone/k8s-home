# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.1.2@sha256:da9dca9ec258c628146bed1445da0853f2b88f0b10bafd97c091de807c363d60
            env:
              LOG_TARGETS: stdout
              HOMEPAGE_ALLOWED_HOSTS: "*"
            ports:
            - containerPort: 3000
              name: http
            probes:
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 50Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 3000

    persistence:
      config:
        type: configMap
        name: homepage-config # overriden by kustomizeconfig
        globalMounts:
        - subPath: bookmarks.yaml
          path: /app/config/bookmarks.yaml
        - subPath: custom.css
          path: /app/config/custom.css
        - subPath: custom.js
          path: /app/config/custom.js
        - subPath: docker.yaml
          path: /app/config/docker.yaml
        - subPath: kubernetes.yaml
          path: /app/config/kubernetes.yaml
        - subPath: services.yaml
          path: /app/config/services.yaml
        - subPath: settings.yaml
          path: /app/config/settings.yaml
        - subPath: widgets.yaml
          path: /app/config/widgets.yaml
      assets:
        type: image
        image: ghcr.io/kevinastone/homer-assets:main@sha256:db205c2e3a31aa0f748a931baa4276dfa52f8ad675097318aadd198c46ac5398
        pullPolicy: IfNotPresent
        globalMounts:
        - path: /app/public/assets
    serviceAccount:
      homepage: {}
    defaultPodOptions:
      automountServiceAccountToken: true
