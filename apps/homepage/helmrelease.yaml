# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        replicas: 2
        podDisruptionBudget:
          minAvailable: 1
        containers:
          main:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
            env:
              LOG_TARGETS: stdout
              HOMEPAGE_ALLOWED_HOSTS: "*"
            envFrom:
            - secretRef:
                name: homepage-secrets
            ports:
            - containerPort: 3000
              name: http
            probes:
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 50Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 3000

    persistence:
      config:
        type: configMap
        name: homepage-config # overriden by kustomizeconfig
        globalMounts:
        - subPath: bookmarks.yaml
          path: /app/config/bookmarks.yaml
        - subPath: custom.css
          path: /app/config/custom.css
        - subPath: custom.js
          path: /app/config/custom.js
        - subPath: docker.yaml
          path: /app/config/docker.yaml
        - subPath: kubernetes.yaml
          path: /app/config/kubernetes.yaml
        - subPath: services.yaml
          path: /app/config/services.yaml
        - subPath: settings.yaml
          path: /app/config/settings.yaml
        - subPath: widgets.yaml
          path: /app/config/widgets.yaml
      assets:
        type: image
        image: ghcr.io/kevinastone/homepage-assets:main@sha256:6a1ec34d3b412cb35b373be21ad8b66bc976cd94f4f31c2f6fc3368d2f585fa1
        pullPolicy: IfNotPresent
        globalMounts:
        - path: /app/public/assets
    serviceAccount:
      homepage: {}
    defaultPodOptions:
      automountServiceAccountToken: true
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: homepage
