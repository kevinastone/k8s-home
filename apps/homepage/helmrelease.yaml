# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.4.0@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61
            env:
              LOG_TARGETS: stdout
              HOMEPAGE_ALLOWED_HOSTS: "*"
            envFrom:
            - secretRef:
                name: sabnzbd-secret
                optional: true
            - secretRef:
                name: sonarr-secret
                optional: true
            - secretRef:
                name: prowlarr-secret
                optional: true


            ports:
            - containerPort: 3000
              name: http
            probes:
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 50Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 3000

    persistence:
      config:
        type: configMap
        name: homepage-config # overriden by kustomizeconfig
        globalMounts:
        - subPath: bookmarks.yaml
          path: /app/config/bookmarks.yaml
        - subPath: custom.css
          path: /app/config/custom.css
        - subPath: custom.js
          path: /app/config/custom.js
        - subPath: docker.yaml
          path: /app/config/docker.yaml
        - subPath: kubernetes.yaml
          path: /app/config/kubernetes.yaml
        - subPath: services.yaml
          path: /app/config/services.yaml
        - subPath: settings.yaml
          path: /app/config/settings.yaml
        - subPath: widgets.yaml
          path: /app/config/widgets.yaml
      assets:
        type: image
        image: ghcr.io/kevinastone/homer-assets:main@sha256:5a1d61652f42e23bc036652e31391d225106bc0f72293baffec5d29622a0520e
        pullPolicy: IfNotPresent
        globalMounts:
        - path: /app/public/assets
    serviceAccount:
      homepage: {}
    defaultPodOptions:
      automountServiceAccountToken: true
