# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v1.13.2@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
            env:
              LOG_TARGETS: stdout
              HOMEPAGE_ALLOWED_HOSTS: "*"
            ports:
            - containerPort: 3000
              name: http
            probes:
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 50Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 3000

    persistence:
      config:
        type: configMap
        name: homepage-config # overriden by kustomizeconfig
        globalMounts:
        - subPath: bookmarks.yaml
          path: /app/config/bookmarks.yaml
        - subPath: custom.css
          path: /app/config/custom.css
        - subPath: custom.js
          path: /app/config/custom.js
        - subPath: docker.yaml
          path: /app/config/docker.yaml
        - subPath: kubernetes.yaml
          path: /app/config/kubernetes.yaml
        - subPath: services.yaml
          path: /app/config/services.yaml
        - subPath: settings.yaml
          path: /app/config/settings.yaml
        - subPath: widgets.yaml
          path: /app/config/widgets.yaml
      assets:
        type: image
        image: ghcr.io/kevinastone/homer-assets:main@sha256:ece8f0e30b66a1688f3b144a4e3651999762b782016fc6f40e6f4eb8c3f801f5
        pullPolicy: IfNotPresent
        globalMounts:
        - path: /app/public/assets
    serviceAccount:
      homepage: {}
    defaultPodOptions:
      automountServiceAccountToken: true
