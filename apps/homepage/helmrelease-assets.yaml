# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage-assets
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        strategy: RollingUpdate
        replicas: 2
        podDisruptionBudget:
          minAvailable: 1
        containers:
          main:
            image:
              repository: ghcr.io/kevinastone/homepage-assets-nginx
              tag: main@sha256:622808912bcfd9966235238e361513862311e357dd5e1f76d3a1eba4484e33c1
            ports:
            - containerPort: 8080
              name: http
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 8080
    persistence:
      cache:
        type: emptyDir
        globalMounts:
        - path: /var/cache/nginx
      conf-d:
        type: emptyDir
        globalMounts:
        - path: /etc/nginx/conf.d
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
    defaultPodOptions:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: *app
