---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - grafana.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: grafana
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
