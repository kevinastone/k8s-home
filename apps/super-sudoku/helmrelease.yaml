# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: super-sudoku
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/kevinastone/super-sudoku
              tag: master@sha256:f622d79c436f3b018a937d497837f4aebf6090ece5ceb8abb5bdafd99b233522
            ports:
            - containerPort: 80
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
