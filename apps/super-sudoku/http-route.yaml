apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: super-sudoku
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Games
    gethomepage.dev/icon: /custom/sudoku.svg
    gethomepage.dev/name: Sudoku
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - sudoku.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: super-sudoku
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
