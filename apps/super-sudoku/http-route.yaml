---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: super-sudoku
  labels:
    auth: authelia
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - sudoku.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: super-sudoku
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
