apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "2048"
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Games
    gethomepage.dev/icon: /assets/custom/2048.svg
    gethomepage.dev/name: "2048"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=dao-2048"
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - 2048.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: dao-2048
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
