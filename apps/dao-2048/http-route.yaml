---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "2048"
spec:
  parentRefs:
    - name: auth-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - 2048.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: dao-2048
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
