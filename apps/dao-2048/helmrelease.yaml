# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dao-2048
spec:
  interval: 5m
  chart:
    spec:
      chart: dao-2048
      version: 1.4.1
      sourceRef:
        kind: HelmRepository
        name: dao-2048
        namespace: flux-system
      interval: 5m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
