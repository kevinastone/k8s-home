# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ws4kp
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/netbymatt/ws4kp
              tag: 8.2.3@sha256:bc8caaade5e49bfc14c12786b86f52bd10ae4a47575b5e209cd27ab42c9f1688
            env:
              WSQS_wide: "true"
            envFrom:
            - secretRef:
                name: ws4kp-secrets # overriden by kustomizeconfig
            ports:
            - containerPort: 8080
              name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
