---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ws4kp
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/netbymatt/ws4kp
              tag: main@sha256:3a068df4268423f2af8cc131e763dc47bcd5e927a10c238371e91a165d19fd3c
            envFrom:
              - secretRef:
                  name: ws4kp-secrets # overriden by kustomizeconfig
            ports:
              - containerPort: 8080
                name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
