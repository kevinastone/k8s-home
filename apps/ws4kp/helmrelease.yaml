---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ws4kp
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/netbymatt/ws4kp
              tag: main@sha256:9401464c9191ec54220c19c316bb7fd19eb1ef3a7b671a7ef765ddf9d5e5eb0e
            ports:
              - containerPort: 8080
                name: http
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
              readiness: *probes
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
