# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weather
resources:
- helmrelease.yaml
- http-route.yaml
components:
- ../../components/namespace
- ../../components/kustomizeconfig
secretGenerator:
- name: ws4kp-secrets
  files:
  - WSQS_latLonQuery=secrets/latLonQuery.txt.encrypted
  - WSQS_latLon=secrets/latLon.txt.encrypted
