# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ws4kp
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Servers
    gethomepage.dev/icon: /assets/custom/weather_star.png
    gethomepage.dev/name: "WeatherStar 4000+"
spec:
  parentRefs:
  - name: public-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - weather.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: ws4kp
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
