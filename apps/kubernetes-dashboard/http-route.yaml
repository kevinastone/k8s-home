---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-dashboard
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Metrics
    gethomepage.dev/icon: /static/icons/svg/kubernetes.svg
    gethomepage.dev/name: Kubernetes Dashboard
spec:
  parentRefs:
    - name: auth-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - dashboard.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: kubernetes-dashboard
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
