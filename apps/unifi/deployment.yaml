apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-health
  namespace: unifi
  labels:
    app.kubernetes.io/name: unifi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unifi
    spec:
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
