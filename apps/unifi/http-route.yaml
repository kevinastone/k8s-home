apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi
  namespace: unifi
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Servers
    gethomepage.dev/icon: /assets/icons/svg/unifi.svg
    gethomepage.dev/name: UniFi
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=unifi"
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - unifi.k8s.kevinastone.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: unifi-controller
      port: 443
