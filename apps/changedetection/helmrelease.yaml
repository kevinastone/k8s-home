---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
# https://github.com/dgtlmoon/changedetection.io
# https://github.com/dgtlmoon/changedetection.io/blob/master/docker-compose.yml
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: changedetection
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: 0.48.00@sha256:fa9f4c863800b16729c4ee6611651c0a3c70cb2b1dac6917d7d6ba3ca9190f68
            env:
              PORT: &port 5000
              BASE_URL: https://changedetection.k8s.kevinastone.com
              DISABLE_VERSION_CHECK: "true"
              # USE_X_SETTINGS: 1
              # PLAYWRIGHT_DRIVER_URL: ws://localhost:3000/?stealth=1&--disable-web-security=true&--user-data-dir=~/tmp/cache
            resources:
              requests:
                cpu: 25m
                memory: 145M
              limits:
                memory: 512M
          # browser:
          #   image:
          #     repository: docker.io/browserless/chrome
          #     tag: latest
          #     pullPolicy: IfNotPresent
          #   env:
          #     - { name: SCREEN_WIDTH, value: "1920" }
          #     - { name: SCREEN_HEIGHT, value: "1024" }
          #     - { name: SCREEN_DEPTH, value: "16" }
          #     - { name: ENABLE_DEBUGGER, value: "false" }
          #     - { name: PREBOOT_CHROME, value: "true" }
          #     - { name: CONNECTION_TIMEOUT, value: "300000" }
          #     - { name: MAX_CONCURRENT_SESSIONS, value: "10" }
          #     - { name: CHROME_REFRESH_TIME, value: "600000" }
          #     - { name: DEFAULT_BLOCK_ADS, value: "true" }
          #     - { name: DEFAULT_STEALTH, value: "true" }
          #   resources:
          #     requests:
          #       cpu: 25m
          #       memory: 979M
          #     limits:
          #       memory: 1G

    service:
      app:
        controller: main
        ports:
          http:
            port: 80
            targetPort: *port

    persistence:
      data:
        enabled: true
        retain: false
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /datastore
