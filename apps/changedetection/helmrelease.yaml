# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: changedetection
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: 0.52.9@sha256:e95931043d68da46e90498ce74ad317b392caade07186dc06bdfa1710901bf90
            env:
              PORT: &port 5000
              BASE_URL: https://changedetection.k8s.kevinastone.com
              DISABLE_VERSION_CHECK: "true"
              USE_X_SETTINGS: 1
              # PLAYWRIGHT_DRIVER_URL: ws://localhost:3000/?stealth=1&--disable-web-security=true&--user-data-dir=~/tmp/cache
              PLAYWRIGHT_DRIVER_URL: 'ws://localhost:3000/chrome?launch={"defaultViewport":{"height":720,"width":1280},"headless":false,"stealth":true}&blockAds=true'
            resources:
              requests:
                cpu: 25m
                memory: 145M
              limits:
                memory: 512M
          browser:
            image:
              repository: ghcr.io/browserless/chrome
              tag: v2.40.0@sha256:02af9f8dc9510851f60089cf020ea6212102ee2119323e22001e7540944ab31c
              pullPolicy: IfNotPresent
            env:
            - {name: SCREEN_WIDTH, value: "1920"}
            - {name: SCREEN_HEIGHT, value: "1024"}
            - {name: SCREEN_DEPTH, value: "16"}
            - {name: ENABLE_DEBUGGER, value: "false"}
            - {name: PREBOOT_CHROME, value: "true"}
            - {name: CONNECTION_TIMEOUT, value: "300000"}
            - {name: MAX_CONCURRENT_SESSIONS, value: "10"}
            - {name: CHROME_REFRESH_TIME, value: "600000"}
            - {name: DEFAULT_BLOCK_ADS, value: "true"}
            - {name: DEFAULT_STEALTH, value: "true"}
            resources:
              requests:
                cpu: 25m
                memory: 512M
              limits:
                memory: 1G

    service:
      app:
        controller: main
        ports:
          http:
            port: 80
            targetPort: *port

    persistence:
      data:
        enabled: true
        retain: true
        size: 1Gi
        accessMode: ReadWriteOnce
        # globalMounts:
        #   - path: /datastore
        advancedMounts:
          main:
            app:
            - path: /datastore
