# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: changedetection
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: 0.54.10@sha256:c85fb73ce4e1986c90b9b747e0247cd67b0d4ebcce4718a5f7205dc64ccc178a
            env:
              PORT: &port 5000
              BASE_URL: https://changedetection.k8s.kevinastone.com
              DISABLE_VERSION_CHECK: "true"
              USE_X_SETTINGS: 1
              # PLAYWRIGHT_DRIVER_URL: ws://localhost:3000/?stealth=1&--disable-web-security=true&--user-data-dir=~/tmp/cache
              PLAYWRIGHT_DRIVER_URL: 'ws://localhost:3000/chrome?launch={"defaultViewport":{"height":720,"width":1280},"headless":false,"stealth":true}&blockAds=true'
            resources:
              requests:
                cpu: 25m
                memory: 145M
              limits:
                memory: 512M
          browser:
            image:
              repository: ghcr.io/browserless/chrome
              tag: v2.47.0@sha256:d4d2b7cf6f038d815fb5a296c42928ce84a80106847189ad1a7a10f4c7827503
              pullPolicy: IfNotPresent
            env:
            - {name: SCREEN_WIDTH, value: "1920"}
            - {name: SCREEN_HEIGHT, value: "1024"}
            - {name: SCREEN_DEPTH, value: "16"}
            - {name: ENABLE_DEBUGGER, value: "false"}
            - {name: PREBOOT_CHROME, value: "true"}
            - {name: CONNECTION_TIMEOUT, value: "300000"}
            - {name: MAX_CONCURRENT_SESSIONS, value: "10"}
            - {name: CHROME_REFRESH_TIME, value: "600000"}
            - {name: DEFAULT_BLOCK_ADS, value: "true"}
            - {name: DEFAULT_STEALTH, value: "true"}
            resources:
              requests:
                cpu: 25m
                memory: 512M
              limits:
                memory: 1G

    service:
      app:
        controller: main
        ports:
          http:
            port: 80
            targetPort: *port

    persistence:
      data:
        enabled: true
        retain: true
        size: 1Gi
        accessMode: ReadWriteOnce
        # globalMounts:
        #   - path: /datastore
        advancedMounts:
          main:
            app:
            - path: /datastore
