---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: changedetection
  labels:
    auth: authelia
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - changedetection.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: changedetection
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
