# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-monitoring
resources:
- helmrelease.yaml
configMapGenerator:
- name: home-monitoring-dashboard
  options:
    labels:
      grafana_dashboard: "true"
  files:
  - dashboards/home.json
- name: home-monitoring-vector-config
  files:
  - config/vector.yaml
components:
- ../../components/namespace
- ../../components/kustomizeconfig
patches:
- target:
    kind: Namespace
  patch: |-
    apiVersion: v1
    kind: Namespace
    metadata:
      name: _
      labels:
        secrets.k8s-home.internal/clickhouse-vector: "true"
