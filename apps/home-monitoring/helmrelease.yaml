# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-monitoring-vector
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/vectordotdev/helm-charts/vector
      ref:
        tag: 0.62.1
  values:
    role: Stateless-Aggregator
    replicas: 1
    containerPorts:
    - name: &promPort prom-exporter
      containerPort: 9090
      protocol: TCP
    podMonitor:
      enabled: true
      port: *promPort
    service:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    dataDir: /vector-data-dir
    extraVolumes:
    - name: clickhouse-creds
      secret:
        secretName: clickhouse-vector-creds
    extraVolumeMounts:
    - name: clickhouse-creds
      mountPath: /etc/vector-secrets
      readOnly: true
    existingConfigMaps:
    - home-monitoring-vector-config
