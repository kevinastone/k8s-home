# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
spec:
  interval: 5m
  chart:
    spec:
      chart: vpa
      version: 5.2.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
      interval: 5m
  values:
    recommender:
      extraArgs:
        prometheus-address: http://vmselect-vm-stack.victoria-metrics.svc:8481/select/0/prometheus
        storage: prometheus
    updater:
      enabled: false
