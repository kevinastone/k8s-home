# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
spec:
  interval: 5m
  chart:
    spec:
      chart: vpa
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    recommender:
      extraArgs:
        prometheus-address: http://vmsingle-vm-stack.victoria-metrics.svc:8428
        storage: prometheus
    updater:
      enabled: false
