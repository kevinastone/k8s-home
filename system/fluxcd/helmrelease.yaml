# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
      ref:
        tag: 0.62.1
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    instance:
      cluster:
        size: medium
      sync:
        name: fluxcd-sync
        url: ssh://git@github.com/kevinastone/k8s-home
        ref: refs/heads/main
        path: ./
        pullSecret: fluxcd-sync
      kustomize:
        patches:
        - target:
            kind: Kustomization
            name: fluxcd-sync
          patch: |
            - op: add
              path: /spec/retryInterval
              value: 1m
            - op: add
              path: /spec/decryption
              value:
                provider: sops
                secretRef:
                  name: sops-age
