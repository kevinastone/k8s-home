---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: exdns
spec:
  interval: 5m
  chart:
    spec:
      chart: k8s-gateway
      version: 2.3.0
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
  values:
    domain: k8s.kevinastone.com

    replicaCount: 2

    service:
      type: LoadBalancer
      labels:
        ip-pool: static
      annotations:
        io.cilium/lb-ipam-ips: 192.168.120.54
        metallb.universe.tf/loadBalancerIPs: 192.168.120.54
