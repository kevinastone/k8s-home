# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      url: oci://ghcr.io/emberstack/helm-charts/reflector
      ref:
        tag: 10.0.70
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
