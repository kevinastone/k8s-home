# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/openebs/charts/localpv-provisioner
      ref:
        tag: 4.6.0
  values:
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rawfile-localpv
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/openebs/charts/rawfile-localpv
      ref:
        tag: 0.15.3
  values:
    node:
      defaultPool: default
      storagePools:
        default:
          path: /var/openebs/rawfile
    storageClasses:
    - name: openebs-rawfile
      enabled: true
      isDefault: false
      isDefaultClass: false
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
      parameters:
        csi.storage.k8s.io/fstype: ext4
        thinProvision: "true"
        storagePool: default
    capabilities:
      apiServer:
        enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
