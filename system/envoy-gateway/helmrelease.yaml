# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://docker.io/envoyproxy/gateway-helm
      ref:
        tag: 1.9.3
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    config:
      envoyGateway:
        extensionApis:
          enableBackend: true
