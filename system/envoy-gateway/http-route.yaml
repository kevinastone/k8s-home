# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: http
  - name: public-gateway
    namespace: envoy
    sectionName: http
  hostnames:
  - "*.k8s.kevinastone.com"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
