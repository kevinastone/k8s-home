apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-https-redirect
  namespace: envoy
spec:
  parentRefs:
    - name: auth-gateway
      namespace: envoy
      sectionName: http
  hostnames:
    - "*.k8s.kevinastone.com"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-https-redirect
  namespace: envoy
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy
      sectionName: http
  hostnames:
    - "*.k8s.kevinastone.com"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
