---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: envoy
resources:
  - namespace.yaml
  - helmrelease.yaml
  - envoy-proxy.yaml
  - gateway-class.yaml
  - gateway.yaml
  - security-policy.yaml
  - pod-monitor.yaml
  - http-route.yaml
configMapGenerator:
  - name: envoy-gateway-dashboard
    options:
      labels:
        grafana_dashboard: 'true'
    files:
      - dashboards/envoy-clusters.json
      - dashboards/envoy-gateway-global.json
      - dashboards/envoy-proxy-global.json
