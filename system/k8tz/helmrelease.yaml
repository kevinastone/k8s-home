# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8tz
spec:
  interval: 5m
  chart:
    spec:
      chart: k8tz
      version: 0.20.0
      sourceRef:
        kind: HelmRepository
        name: k8tz
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    namespace: null
    timezone: America/Los_Angeles
    injectionStrategy: hostPath
