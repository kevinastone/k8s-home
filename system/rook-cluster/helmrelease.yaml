---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: rook-ceph-cluster
spec:
  interval: 12h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://ghcr.io/rook/rook-ceph-cluster
  ref:
    tag: v1.17.7
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    operatorNamespace: rook-ceph
    cephClusterSpec:
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.prometheus.svc.cluster.local:9090
      mgr:
        count: 2
        allowMultiplePerNode: false
        modules:
          - name: rook
            enabled: true
          - name: "pg_autoscaler"
            enabled: true
          - name: "diskprediction_local"
            enabled: true
          - name: prometheus
            enabled: true
          - name: insights
            enabled: true
          - name: localpool
            enabled: true
          - name: alerts
            enabled: true
          - name: rgw
            enabled: true
          - name: progress
            enabled: true
      mon:
        count: 3
      # mgr:
      #   count: 2
      #   allowMultiplePerNode: false
      #   modules:
      #     - name: "pg_autoscaler"
      #       enabled: true
      #     - name: "diskprediction_local"
      #       enabled: true
      #     - name: prometheus
      #       enabled: true
      #     - name: nfs
      #       enabled: true
      #     - name: insights
      #       enabled: true
      #     - name: localpool
      #       enabled: true
      #     - name: alerts
      #       enabled: true
      #     - name: rgw
      #       enabled: true
      #     - name: progress
      #       enabled: true
      # mgr:
      #   modules:
      #     - name: insights
      #       enabled: true
      #     - name: pg_autoscaler
      #       enabled: true
      #     - name: rook
      #       enabled: true
      # network:
      #   provider: host
      #   connections:
      #     requireMsgr2: true
      cephVersion:
        dataDirHostPath: /var/lib/rook
      storage:
        useAllNodes: true
        useAllDevices: false
        config:
          osdsPerDevice: "1"
