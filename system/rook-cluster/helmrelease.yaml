# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph-cluster
spec:
  interval: 12h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://ghcr.io/rook/rook-ceph-cluster
  ref:
    tag: v1.20.3
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    operatorNamespace: rook-ceph
    cephClusterSpec:
      dataDirHostPath: /var/lib/rook-ceph
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://vmsingle-vm-stack.victoria-metrics.svc.cluster.local:8428
      mgr:
        count: 2
        allowMultiplePerNode: false
        modules:
        - name: rook
          enabled: true
        - name: "pg_autoscaler"
          enabled: true
          # - name: "diskprediction_local"
          #   enabled: true
          # - name: prometheus
          #   enabled: true
          # - name: insights
          #   enabled: true
          # - name: localpool
          #   enabled: true
          # - name: alerts
          #   enabled: true
          # - name: rgw
          #   enabled: true
          # - name: progress
          #   enabled: true
      mon:
        count: 3
      # mgr:
      #   count: 2
      #   allowMultiplePerNode: false
      #   modules:
      #     - name: "pg_autoscaler"
      #       enabled: true
      #     - name: "diskprediction_local"
      #       enabled: true
      #     - name: prometheus
      #       enabled: true
      #     - name: nfs
      #       enabled: true
      #     - name: insights
      #       enabled: true
      #     - name: localpool
      #       enabled: true
      #     - name: alerts
      #       enabled: true
      #     - name: rgw
      #       enabled: true
      #     - name: progress
      #       enabled: true
      # mgr:
      #   modules:
      #     - name: insights
      #       enabled: true
      #     - name: pg_autoscaler
      #       enabled: true
      #     - name: rook
      #       enabled: true
      # network:
      #   provider: host
      #   connections:
      #     requireMsgr2: true
      cephVersion:
        image: quay.io/ceph/ceph:v21.1.0
      storage:
        # Set to true to make the operator discover and use all nodes in the cluster.
        useAllNodes: true

        # This is a critical setting for hostPath.
        # We must explicitly tell Ceph not to use dedicated devices.
        useAllDevices: false

        # Defines the storage backend to use for the OSDs.
        # In this case, we'll use a directory-based store.
        config:
          metadataDevice: ""
          databaseDevice: ""

        # The `nodes` array allows you to define specific node configurations.
        # We can use this to select which nodes will run the Ceph daemons.
        nodes:
        - name: "" # Leave this empty to apply to all nodes selected by `useAllNodes`.
          # The `directories` section is where we specify the host paths for storage.
          directories:
          - path: /var/lib/rook-ceph/osds # This is where OSD data will be stored.
            # We can also specify the device class if we want to.
            # deviceClass: hdd
    # The `cephBlockPools` section defines the RBD block pool.
    cephBlockPools:
    - name: replicapool
      spec:
        replicated:
          # The number of replicas for data objects.
          size: 3
      storageClass:
        enabled: true
        name: rook-ceph-block
        reclaimPolicy: Delete
        allowVolumeExpansion: true
