# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rook-ceph-mgr-dashboard
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Metrics
    gethomepage.dev/icon: /assets/icons/svg/rook.svg
    gethomepage.dev/name: Rook
    gethomepage.dev/pod-selector: "app=rook-ceph-mgr"
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - rook.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: rook-ceph-mgr-dashboard
      port: 7000
    matches:
    - path:
        type: PathPrefix
        value: /
