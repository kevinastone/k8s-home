---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rook-ceph-mgr-dashboard
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Metrics
    gethomepage.dev/icon: /static/icons/svg/rook.svg
    gethomepage.dev/name: Rook
spec:
  parentRefs:
    - name: auth-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - rook.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: rook-ceph-mgr-dashboard
          port: 7000
      matches:
        - path:
            type: PathPrefix
            value: /
