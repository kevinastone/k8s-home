---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: cloudflare/cloudflared
              tag: 2025.11.1@sha256:89ee50efb1e9cb2ae30281a8a404fed95eb8f02f0a972617526f8c5b417acae2
            args:
              - tunnel
              - --config
              - /etc/cloudflared/config/config.yaml
              - --loglevel
              - debug
              - run
            ports:
              - containerPort: 2000
                name: metrics
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /ready
                port: metrics
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 10
              readiness: *probes

    service:
      main:
        controller: main
        type: ExternalName
        externalName: 7830819a-c96e-4ac6-a997-9bffa30a57fc.cfargotunnel.com
        annotations:
          external-dns.alpha.kubernetes.io/hostname: fluxcd.kevinastone.com
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    serviceMonitor:
      main:
        serviceName: cloudflared
        endpoints:
          - port: metrics
            scheme: http
    persistence:
      config:
        type: configMap
        name: cloudflared-config # overriden by kustomizeconfig
        globalMounts:
          - path: /etc/cloudflared/config/config.yaml
            subPath: config.yaml
            readOnly: true
      creds:
        type: secret
        name: cloudflared-tunnel-creds # overriden by kustomizeconfig
        globalMounts:
          - path: /creds
