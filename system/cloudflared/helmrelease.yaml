# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/cloudflare/cloudflared
              tag: 2026.11.0@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
            args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - --loglevel
            - debug
            - run
            ports:
            - containerPort: &metrics-port 2000
              name: metrics
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /ready
                port: metrics
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 10
              readiness: *probes

    service:
      main:
        controller: main
        clusterIP: None
        # type: ExternalName
        # externalName: 7830819a-c96e-4ac6-a997-9bffa30a57fc.cfargotunnel.com
        annotations:
          external-dns.alpha.kubernetes.io/hostname: fluxcd.kevinastone.com
          external-dns.alpha.kubernetes.io/target: 7830819a-c96e-4ac6-a997-9bffa30a57fc.cfargotunnel.com
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        ports:
          metrics:
            port: *metrics-port
    serviceMonitor:
      main:
        serviceName: cloudflared
        endpoints:
        - port: metrics
          scheme: http
    persistence:
      config:
        type: configMap
        name: cloudflared-config # overriden by kustomizeconfig
        globalMounts:
        - path: /etc/cloudflared/config/config.yaml
          subPath: config.yaml
          readOnly: true
      secrets:
        type: secret
        name: cloudflared-tunnel-creds # overriden by kustomizeconfig
        globalMounts:
        - path: /creds
