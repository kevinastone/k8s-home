# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eraser
spec:
  interval: 15m
  chart:
    spec:
      chart: eraser
      version: 1.4.2
      sourceRef:
        kind: HelmRepository
        name: eraser
        namespace: flux-system
      interval: 15m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    runtimeConfig:
      manager:
        runtime:
          name: crio
          address: unix:///run/crio/crio.sock
        scheduling:
          repeatInterval: 24h
          beginImmediately: true
      components:
        collector:
          enabled: true
        scanner:
          enabled: false
        eraser:
          enabled: true
