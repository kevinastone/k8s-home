# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: eraser
spec:
  interval: 24h
  url: https://eraser-dev.github.io/eraser/charts
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eraser
spec:
  interval: 5m
  chart:
    spec:
      chart: eraser
      version: 1.4.2
      sourceRef:
        kind: HelmRepository
        name: eraser
      interval: 15m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    runtimeConfig:
      manager:
        runtime:
          name: crio
          address: unix:///run/crio/crio.sock
        scheduling:
          repeatInterval: 24h
          beginImmediately: true
      components:
        collector:
          enabled: true
        scanner:
          enabled: false
        eraser:
          enabled: true
