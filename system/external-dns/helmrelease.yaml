# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  interval: 5m
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    policy: sync
    deploymentAnnotations:
      secret.reloader.stakater.com/auto: "true"
    provider:
      name: cloudflare
    extraArgs:
      "cloudflare-dns-records-per-page": 5000
    env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token-secret
          key: api-token
    domainFilters:
    - k8s.kevinastone.com
    sources:
    - service
    txtOwnerId: k8s-home
    serviceMonitor:
      enabled: true
