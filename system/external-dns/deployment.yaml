---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
      - name: external-dns
        image: registry.k8s.io/external-dns/external-dns:v0.14.1@sha256:7bb4c52748dec4fa2df1a8df7b94355c9677c70378cfe555ee4eb9a476409f0c
        args:
        - --txt-owner-id
        - $(OWNER_ID)
        - --provider
        - cloudflare
        # (optional) configure how many DNS records to fetch per request
        - --cloudflare-dns-records-per-page
        - "5000"
        - --source=service
        # - --source=gateway-httproute
        - --domain-filter
        - $(DOMAIN_NAME)
        envFrom:
        - configMapRef:
            name: external-dns-config # overriden by kustomizeconfig
        - secretRef:
            name: external-dns-secret # overriden by kustomizeconfig
