# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://quay.io/jetstack/charts/cert-manager
      ref:
        tag: v1.21.3
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      enabled: false

    dns01RecursiveNameservers: "rodney.ns.cloudflare.com:53,rosalyn.ns.cloudflare.com:53"

    prometheus:
      enabled: true
      servicemonitor:
        enabled: true

    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1

    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      enableGatewayAPI: true
