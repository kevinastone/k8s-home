---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minio2
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        nameOverride: *app
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: quay.io/minio/minio
              tag: RELEASE.2025-07-23T15-54-02Z
            env:
              # Trigger the GO-GC more frequently (everytime it grows by 20%)
              GOGC: "20"
              # NOTE: users who have limited memory can set CI=true to reduce pre-allocated memory from 1GiB/2GiB to 256MiB.
              CI: "true"
              HOME: /home
              MINIO_ROOT_USER_FILE: /secrets/root-user
              MINIO_ROOT_PASSWORD_FILE: /secrets/root-password
              MINIO_IDENTITY_OPENID_CONFIG_URL: https://auth.k8s.kevinastone.com/.well-known/openid-configuration
              MINIO_IDENTITY_OPENID_CLIENT_ID: minio
              MINIO_IDENTITY_OPENID_ROLE_POLICY: consoleAdmin
              MINIO_IDENTITY_OPENID_CLAIM_PREFIX: authelia
              MINIO_IDENTITY_OPENID_DISPLAY_NAME: Authelia
              MINIO_IDENTITY_OPENID_SCOPES: openid,profile,email
              MINIO_BROWSER_REDIRECT_URL: https://minio.k8s.kevinastone.com
              MINIO_PROMETHEUS_AUTH_TYPE: public
              MINIO_UPDATE: "off"
            envFrom:
              - secretRef:
                  name: minio-secret
            args:
              - server
              - /data
              - --console-address
              - :9001
            ports:
              - containerPort: 9000
                name: api
              - containerPort: 9001
                name: http
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /minio/health/live
                    port: api
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
                ephemeral-storage: 50Mi
              limits:
                cpu: 750m
                memory: 1Gi
                ephemeral-storage: 2Gi
      provisioning:
        type: job
        initContainers:
          wait-for-minio:
            image:
              repository: ghcr.io/groundnuty/k8s-wait-for
              tag: v1.6
            args:
              - service
              - *app
        containers:
          main:
            image:
              repository: quay.io/minio/mc
              tag: RELEASE.2025-07-21T05-28-08Z
            env:
              MINIO_SCHEME: http
              MINIO_ROOT_USER_FILE: /secrets/root-user
              MINIO_ROOT_PASSWORD_FILE: /secrets/root-password
            envFrom:
              - secretRef:
                  name: minio-secret
            command:
              - /bin/bash
              - -c
              - |-
                set -e;

                function attachPolicy() {
                  local tmp=$(mc admin $1 info minio $2 | sed -n -e 's/^Policy.*: \(.*\)$/\1/p');
                  IFS=',' read -r -a CURRENT_POLICIES <<< "$tmp";
                  if [[ ! "${CURRENT_POLICIES[*]}" =~ "$3" ]]; then
                    mc admin policy attach minio $3 --$1=$2;
                  fi;
                };

                function detachDanglingPolicies() {
                  local tmp=$(mc admin $1 info minio $2 | sed -n -e 's/^Policy.*: \(.*\)$/\1/p');
                  IFS=',' read -r -a CURRENT_POLICIES <<< "$tmp";
                  IFS=',' read -r -a DESIRED_POLICIES <<< "$3";
                  for current in "${CURRENT_POLICIES[@]}"; do
                    if [[ ! "${DESIRED_POLICIES[*]}" =~ "${current}" ]]; then
                      mc admin policy detach minio $current --$1=$2;
                    fi;
                  done;
                }

                function addUsersFromFile() {
                  local username=$(grep -oP '^username=\K.+' $1);
                  local password=$(grep -oP '^password=\K.+' $1);
                  local disabled=$(grep -oP '^disabled=\K.+' $1);
                  local policies_list=$(grep -oP '^policies=\K.+' $1);
                  local set_policies=$(grep -oP '^setPolicies=\K.+' $1);

                  mc admin user add minio "${username}" "${password}";

                  IFS=',' read -r -a POLICIES <<< "${policies_list}";
                  for policy in "${POLICIES[@]}"; do
                    attachPolicy user "${username}" "${policy}";
                  done;
                  if [ "${set_policies}" == "true" ]; then
                    detachDanglingPolicies user "${username}" "${policies_list}";
                  fi;

                  local user_status="enable";
                  if [[ "${disabled}" != "" && "${disabled,,}" == "true" ]]; then
                    user_status="disable";
                  fi;

                  mc admin user "${user_status}" minio "${username}";
                };

                echo "Start Minio provisioning";

                mc alias set minio http://minio2:9000 $(<$MINIO_ROOT_USER_FILE) $(<$MINIO_ROOT_PASSWORD_FILE)

                # Provision Users
                while read -d '' configFile; do
                  addUsersFromFile "${configFile}";
                done < <(find "/users/" -type l -not -name '..data' -print0);

                # Provision Buckets
                mc mb minio/postgres --ignore-existing
                mc version suspend minio/postgres

                echo "End Minio provisioning";

            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          api:
            port: 9000
          http:
            port: 9001
    serviceMonitor:
      main:
        enabled: true
        serviceName: *app
        endpoints:
          - port: api
            path: /minio/v2/metrics/cluster
            interval: 30s
          - port: api
            path: /minio/v2/metrics/node
            interval: 30s
    serviceAccount:
      create: true
      name: *app
    rbac:
      create: true
      roles:
        service-reader:
          forceRename: service-reader
          type: Role
          rules:
            - apiGroups:
                - ""
              resources:
                - pods
                - services
                - jobs
              verbs:
                - get
                - list
                - watch
      bindings:
        service-reader:
          forceRename: service-reader
          type: RoleBinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: service-reader
          subjects:
            - kind: ServiceAccount
              name: *app
              namespace: "{{ .Release.Namespace }}"
    persistence:
      home:
        type: emptyDir
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        retain: true
        size: 100Gi
        storageClass: longhorn
        advancedMounts:
          main:
            main:
              - path: /data
      secrets:
        type: secret
        name: minio-root-secret # overriden by kustomizeconfig
        globalMounts:
          - path: /secrets
      users:
        type: secret
        name: minio-users # overriden by kustomizeconfig
        advancedMounts:
          provisioning:
            main:
              - path: /users
