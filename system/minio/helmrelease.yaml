---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: minio
spec:
  interval: 5m
  chart:
    spec:
      chart: minio
      version: 14.7.7
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 5m
  driftDetection:
    mode: enabled
  values:
    # mode: distributed
    # statefulset:
    #   replicaCount: 4
    #   zones: 1
    persistence:
      storageClass: storage-nas
      size: 250Gi
    resourcesPreset: small
    extraEnvVars:
    # Trigger the GO-GC more frequently (everytime it grows by 20%)
    - name: GOGC
      value: "20"
    # NOTE: users who have limited memory can set CI=true to reduce pre-allocated memory from 1GiB/2GiB to 256MiB.
    - name: CI
      value: "true"
    - name: MINIO_IDENTITY_OPENID_CONFIG_URL
      value: https://auth.k8s.kevinastone.com/.well-known/openid-configuration
    - name: MINIO_IDENTITY_OPENID_CLIENT_ID
      value: minio
    - name: MINIO_IDENTITY_OPENID_ROLE_POLICY
      value: consoleAdmin
    - name: MINIO_IDENTITY_OPENID_CLAIM_PREFIX
      value: authelia
    - name: MINIO_IDENTITY_OPENID_DISPLAY_NAME
      value: Authelia
    - name: MINIO_IDENTITY_OPENID_SCOPES
      value: openid,profile,email
    - name: MINIO_BROWSER_REDIRECT_URL
      value: https://minio.k8s.kevinastone.com
    extraEnvVarsSecret: minio-secret
    metrics:
      serviceMonitor:
        enabled: true
    auth:
      existingSecret: minio-root-secret # overriden by kustomizeconfig
    volumePermissions:
      enabled: false
    provisioning:
      enabled: true
      usersExistingSecrets:
        - minio-users # overriden by kustomizeconfig
      buckets:
        - name: longhorn
        - name: postgres
      networkPolicy:
        enabled: false
