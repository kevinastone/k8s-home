---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minio
resources:
  - namespace.yaml
  - helmrelease.yaml
  - http-route.yaml
secretGenerator:
  - name: minio-root-secret
    literals:
      - root-user=kstone
    files:
      - root-password=secrets/password.txt.encrypted
  - name: minio-users
    # options:
    #   disableNameSuffixHash: true
    files:
      - longhorn=secrets/longhorn.txt.encrypted
  - name: minio-secret
    files:
      - MINIO_IDENTITY_OPENID_CLIENT_SECRET=secrets/client.secret.encrypted
configMapGenerator:
  - name: minio-dashboard
    options:
      labels:
        grafana_dashboard: 'true'
    files:
      - dashboards/minio.json
configurations:
  - kustomizeconfig.yaml
