---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-admin
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - minio.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: minio
          port: 9001
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-s3
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - s3.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: minio
          port: 9000
      matches:
        - path:
            type: PathPrefix
            value: /
