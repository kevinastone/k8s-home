# ---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-admin
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Servers
    gethomepage.dev/icon: /static/icons/svg/minio.svg
    gethomepage.dev/name: MinIO
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=minio"
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - minio.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: minio
          port: 9001
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-s3
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - s3.k8s.kevinastone.com
  rules:
    - backendRefs:
        - name: minio
          port: 9000
      matches:
        - path:
            type: PathPrefix
            value: /
