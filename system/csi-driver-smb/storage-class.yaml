apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-nas
provisioner: smb.csi.k8s.io
parameters:
  source: "//storage.home.kevinastone.com/NAS"
  csi.storage.k8s.io/provisioner-secret-name: "storage-cifs-secret"
  csi.storage.k8s.io/provisioner-secret-namespace: "smb"
  csi.storage.k8s.io/node-stage-secret-name: "storage-cifs-secret"
  csi.storage.k8s.io/node-stage-secret-namespace: "smb"
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
- dir_mode=0777
- file_mode=0777
- uid=1001
- gid=1001
- vers=3.0
