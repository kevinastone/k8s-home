# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smb
resources:
- namespace.yaml
- helmrelease.yaml
- storage-class.yaml
secretGenerator:
- name: storage-cifs-secret
  options:
    disableNameSuffixHash: true
  literals:
  - username=longhorn
  files:
  - password=secrets/password.txt.encrypted
