# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/clusterexternalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: cloudflare-api-token-secret
spec:
  refreshTime: 1h
  namespaceSelectors:
  - matchLabels:
      secrets.k8s-home.internal/cloudflare-dns: "true"
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: one-password
    target:
      name: cloudflare-api-token-secret
      creationPolicy: Owner
      template:
        engineVersion: v2
        data:
          api-token: "{{ .credential }}"
    dataFrom:
    - extract:
        key: "Cloudflare DNS API Token"
