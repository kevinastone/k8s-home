# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://quay.io/cilium/charts/cilium
      ref:
        tag: 1.20.4
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    tls:
      secretsNamespace:
        name: &secrets-namespace cilium

    l2announcements:
      enabled: false
      leaseDuration: 120s
      leaseRenewDeadline: 30s
      leaseRetryPeriod: 2s

    bgpControlPlane:
      enabled: true

    bpf:
      autoMount:
        enabled: false

    k8sNetworkPolicy:
      enabled: true
    policyEnforcementMode: "never"
    l7Proxy: false

    kubeProxyReplacement: true

    externalIPs:
      enabled: true

    k8sClientRateLimit:
      qps: 50
      burst: 100

    operator:
      replicas: 2
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true

    monitor:
      enabled: false

    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true

    dashboards:
      enabled: true
      labelValue: "true"

    kubeConfigPath: /etc/kubernetes/admin.conf
    k8sServiceHost: 192.168.120.3
    k8sServicePort: 16443

    rollOutCiliumPods: true
