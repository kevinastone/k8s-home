apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Metrics
    gethomepage.dev/icon: /icons/svg/longhorn.svg
    gethomepage.dev/name: Longhorn
    gethomepage.dev/pod-selector: "app=longhorn-ui"
spec:
  parentRefs:
  - name: auth-gateway
    namespace: envoy
    sectionName: https
  hostnames:
  - longhorn.k8s.kevinastone.com
  rules:
  - backendRefs:
    - name: longhorn-frontend
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
