# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
spec:
  interval: 5m
  url: https://charts.longhorn.io
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 5m
  chart:
    spec:
      chart: longhorn
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 5m
  driftDetection:
    mode: enabled
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      imageRegistry: docker.io

    longhornUI:
      replicas: 1

    metrics:
      serviceMonitor:
        enabled: true

    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
      defaultFsType: xfs
      defaultDataLocality: best-effort
      unmapMarkSnapChainRemoved: "enabled"
      nfsOptions: "vers=4.1,noresvport,softerr,timeo=600,retrans=5"

    defaultSettings:
      defaultReplicaCount: "2"
      replicaAutoBalance: best-effort
      removeSnapshotsDuringFilesystemTrim: true
