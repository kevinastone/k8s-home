# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 5m
  chart:
    spec:
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      imageRegistry: docker.io

    longhornUI:
      replicas: 1

    metrics:
      serviceMonitor:
        enabled: true

    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
      defaultFsType: xfs
      defaultDataLocality: best-effort
      unmapMarkSnapChainRemoved: "enabled"
      nfsOptions: "vers=4.1,noresvport,softerr,timeo=600,retrans=5"

    defaultSettings:
      defaultReplicaCount: "2"
      replicaAutoBalance: best-effort
      removeSnapshotsDuringFilesystemTrim: true
